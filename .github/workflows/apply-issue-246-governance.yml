name: Apply Issue 246 Governance Delta

on:
  push:
    branches:
      - feat/246-adipometry-foundation
    paths:
      - .github/issue-246/apply-governance.py.gz.b64
      - .github/workflows/apply-issue-246-governance.yml

permissions:
  contents: write

concurrency:
  group: issue-246-governance-delta
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply delta
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/issue-246/apply-governance.py.gz.b64 | gzip --decompress > /tmp/apply-issue-246-governance.py
          test "$(sha256sum /tmp/apply-issue-246-governance.py | cut -d' ' -f1)" = "5fa535c581f630bc74113b7a21a4d6dccac5274b760a90e9c743d92405fe3359"
          python -m py_compile /tmp/apply-issue-246-governance.py
          cp /tmp/apply-issue-246-governance.py .github/issue-246/apply-governance.py
          python .github/issue-246/apply-governance.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and generate Prisma client
        run: |
          pnpm --filter @corrida/api exec prisma format
          pnpm --filter @corrida/api exec prisma generate

      - name: Verify migration paths
        run: |
          bash scripts/verify-adipometry-migration-existing-data.sh
          bash scripts/verify-adipometry-migration-full-chain.sh

      - name: Apply migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Verify adipometry persistence and governance
        run: |
          bash scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-audit-remediation.sh
          bash scripts/verify-adipometry-persistence-boundaries.sh
          bash scripts/verify-adipometry-clinical-governance.sh

      - name: Validate repository
        run: |
          pnpm type-check
          pnpm lint
          pnpm test
          pnpm build
          pnpm arch:check
          pnpm access:check
          pnpm docs:check

      - name: Commit validated delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue-246/apply-governance.py
          git rm .github/issue-246/apply-governance.py.gz.b64
          git rm .github/workflows/apply-issue-246-governance.yml
          rmdir .github/issue-246 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(adipometry): add contract clinical governance"
          git push origin HEAD:feat/246-adipometry-foundation
