name: Apply Issue 246 Governance Delta

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/issue-246/transport.part-*
      - .github/workflows/apply-issue-246-governance.yml

permissions:
  contents: write

concurrency:
  group: issue-246-governance-delta
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/246-adipometry-foundation
          fetch-depth: 0

      - name: Reconstruct and apply verified delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-246/transport.part-* > /tmp/issue246transport.tar.xz.b64
          test "$(sha256sum /tmp/issue246transport.tar.xz.b64 | cut -d' ' -f1)" = "9276004934e04d4edb9a2d0c5dad7c5fcabcd35df91913c9697fca310a665c76"
          base64 --decode /tmp/issue246transport.tar.xz.b64 > /tmp/issue246transport.tar.xz
          test "$(sha256sum /tmp/issue246transport.tar.xz | cut -d' ' -f1)" = "37927df6844309388321025468a40ce36b981a53868f51c479968b5b692a118e"
          rm -rf /tmp/issue246transport
          mkdir -p /tmp/issue246transport
          tar -xJf /tmp/issue246transport.tar.xz -C /tmp/issue246transport
          python - <<'PYFIX'
          from pathlib import Path
          migration = Path('/tmp/issue246transport/apps/api/prisma/migrations/20260730224500_add_adipometry_clinical_governance/migration.sql')
          sql = migration.read_text()
          sql = sql.replace(
              'BEGIN;\n\n-- Issue #246:',
              'BEGIN;\n\n' + 'CREATE OR REPLACE FUNCTION "roundAdipometryValue"(\n  p_value NUMERIC,\n  p_scale INTEGER,\n  p_mode TEXT\n) RETURNS NUMERIC\nLANGUAGE plpgsql\nIMMUTABLE\nSTRICT\nAS $round$\nDECLARE\n  v_factor NUMERIC;\n  v_absolute NUMERIC;\n  v_lower NUMERIC;\n  v_fraction NUMERIC;\n  v_rounded NUMERIC;\nBEGIN\n  IF p_scale < 0 OR p_scale > 8 THEN\n    RAISE EXCEPTION \'ADIPOMETRY_ROUNDING_SCALE_INVALID\' USING ERRCODE = \'22023\';\n  END IF;\n  IF p_mode = \'HALF_UP\' THEN RETURN ROUND(p_value, p_scale); END IF;\n  IF p_mode <> \'HALF_EVEN\' THEN\n    RAISE EXCEPTION \'ADIPOMETRY_ROUNDING_MODE_INVALID\' USING ERRCODE = \'22023\';\n  END IF;\n  v_factor := POWER(10::NUMERIC, p_scale);\n  v_absolute := ABS(p_value) * v_factor;\n  v_lower := FLOOR(v_absolute);\n  v_fraction := v_absolute - v_lower;\n  IF v_fraction < 0.5 THEN v_rounded := v_lower;\n  ELSIF v_fraction > 0.5 THEN v_rounded := v_lower + 1;\n  ELSIF MOD(v_lower, 2) = 0 THEN v_rounded := v_lower;\n  ELSE v_rounded := v_lower + 1; END IF;\n  RETURN SIGN(p_value) * v_rounded / v_factor;\nEND;\n$round$;\n\n' + '-- Issue #246:',
              1,
          )
          sql = sql.replace(
              'FOREIGN KEY ("professorId", "contractId") REFERENCES "Professor"("id", "contractId")\n  ON DELETE RESTRICT ON UPDATE CASCADE;',
              'FOREIGN KEY ("professorId") REFERENCES "Professor"("id")\n  ON DELETE RESTRICT ON UPDATE CASCADE;',
          )
          sql = sql.replace(
              'FOREIGN KEY ("approvedByProfessorId", "contractId")\n  REFERENCES "Professor"("id", "contractId") ON DELETE RESTRICT ON UPDATE CASCADE;',
              'FOREIGN KEY ("approvedByProfessorId")\n  REFERENCES "Professor"("id") ON DELETE RESTRICT ON UPDATE CASCADE;',
          )
          sql = sql.replace(
              'FOREIGN KEY ("protocolId", "protocolCode", "protocolVersion")\n  REFERENCES "AdipometryProtocol"("id", "code", "version") ON DELETE RESTRICT ON UPDATE CASCADE;',
              'FOREIGN KEY ("protocolId")\n  REFERENCES "AdipometryProtocol"("id") ON DELETE RESTRICT ON UPDATE CASCADE;',
          )
          sql = sql.replace(
              "  IF JSONB_TYPEOF(p_definition -> 'testVectors') IS DISTINCT FROM 'array'\n     OR JSONB_ARRAY_LENGTH(p_definition -> 'testVectors') < 3 THEN RETURN FALSE; END IF;",
              "  IF JSONB_TYPEOF(p_definition -> 'testVectors') IS DISTINCT FROM 'array'\n     OR JSONB_ARRAY_LENGTH(p_definition -> 'testVectors') < 3 THEN RETURN FALSE; END IF;\n  RETURN TRUE;",
              1,
          )
          migration.write_text(sql)

          for script_name in [
              'verify-adipometry-migration-existing-data.sh',
              'verify-adipometry-migration-full-chain.sh',
          ]:
              script = Path('/tmp/issue246transport/scripts') / script_name
              content = script.read_text()
              case_continuation = '|' + chr(92) + '\n'
              loop_continuation = ' ' + chr(92) + '\n'
              content = content.replace(
                  '    20260730204000_canonicalize_legacy_no_maturation_rule)',
                  '    20260730204000_canonicalize_legacy_no_maturation_rule' + case_continuation
                  + '    20260730210000_remove_adipometry_textual_maturation_inference' + case_continuation
                  + '    20260730211000_use_structured_adipometry_maturation_rule' + case_continuation
                  + '    20260730224500_add_adipometry_clinical_governance)',
                  1,
              )
              content = content.replace(
                  '  20260730204000_canonicalize_legacy_no_maturation_rule\n',
                  '  20260730204000_canonicalize_legacy_no_maturation_rule' + loop_continuation
                  + '  20260730210000_remove_adipometry_textual_maturation_inference' + loop_continuation
                  + '  20260730211000_use_structured_adipometry_maturation_rule' + loop_continuation
                  + '  20260730224500_add_adipometry_clinical_governance\n',
                  1,
              )
              script.write_text(content)
          PYFIX
          python -m py_compile /tmp/issue246transport/apply.py
          cp -a /tmp/issue246transport/apps /tmp/issue246transport/packages /tmp/issue246transport/docs /tmp/issue246transport/scripts .
          cp /tmp/issue246transport/apply.py .github/issue-246/apply.py
          python .github/issue-246/apply.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and generate Prisma client
        run: |
          pnpm --filter @corrida/api exec prisma format
          pnpm --filter @corrida/api exec prisma generate

      - name: Verify migration paths
        run: |
          bash scripts/verify-adipometry-migration-existing-data.sh
          bash scripts/verify-adipometry-migration-full-chain.sh

      - name: Apply migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Verify adipometry persistence and governance
        run: |
          bash scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-audit-remediation.sh
          bash scripts/verify-adipometry-persistence-boundaries.sh
          bash scripts/verify-adipometry-clinical-governance.sh

      - name: Validate repository
        run: |
          pnpm type-check
          pnpm lint
          pnpm test
          pnpm build
          pnpm arch:check
          pnpm access:check
          pnpm docs:check

      - name: Commit validated delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue-246/apply.py
          git rm -f .github/issue-246/apply-governance.py.gz.b64
          git rm -f .github/issue-246/transport.part-*
          git rm -f .github/workflows/apply-issue-246-governance.yml
          rmdir .github/issue-246 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(adipometry): add contract clinical governance"
          git push origin HEAD:feat/246-adipometry-foundation
