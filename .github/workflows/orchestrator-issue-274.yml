name: Orchestrator Issue 274 Workspace

on:
  push:
    branches:
      - feat/274-enrollment-conversion
    paths:
      - .github/workflows/orchestrator-issue-274.yml
      - .orchestrator/issue-274.patch.gz.b64

permissions:
  contents: write

jobs:
  apply-corrective-patch:
    if: github.event.head_commit.message == 'chore: stage issue 274 corrective patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and apply patch
        run: |
          base64 --decode .orchestrator/issue-274.patch.gz.b64 | gzip --decompress > /tmp/issue-274.patch
          git apply --check /tmp/issue-274.patch
          git apply /tmp/issue-274.patch
      - name: Remove temporary orchestration files
        run: rm -f .orchestrator/issue-274.patch.gz.b64 .orchestrator/issue-274-export-run.txt .github/workflows/orchestrator-issue-274.yml
      - name: Commit corrected implementation
        run: |
          git config user.name "chatgpt-orchestrator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address issue 274 audit findings"
          git push origin HEAD:feat/274-enrollment-conversion