name: Apply Issue 270 Corrections

on:
  push:
    branches:
      - feat/270-pre-registration-admin
    paths:
      - '.issue-270-corrections/**'
      - '.github/workflows/apply-issue-270-corrections.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/270-pre-registration-admin
          fetch-depth: 0

      - name: Apply correction package
        shell: bash
        run: |
          set -euo pipefail
          cat .issue-270-corrections/part* | base64 --decode > /tmp/issue-270-corrections.tgz
          tar -xzf /tmp/issue-270-corrections.tgz -C .
          rm -rf .issue-270-corrections
          rm -f .github/workflows/apply-issue-270-corrections.yml
          rm -f .github/workflows/export-issue-270-source.yml

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve audit findings for issue 270'
          git push origin HEAD:feat/270-pre-registration-admin
