name: Apply Issue 246 Revision Lifecycle

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/issue-246-revision-lifecycle/**
      - .github/workflows/apply-issue-246-revision-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: issue-246-revision-lifecycle
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/246-adipometry-foundation
          fetch-depth: 0

      - name: Apply transparent revision lifecycle delta
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/issue-246-revision-lifecycle/apply.py
          python .github/issue-246-revision-lifecycle/apply.py
          test "$(sha256sum apps/api/prisma/migrations/20260731120000_complete_adipometry_revision_lifecycle/migration.sql | cut -d' ' -f1)" = "30f0e18010ec33ed99eebcbeb83ba83df4f76f7401c71378731a609a6bde24c7"
          git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and generate Prisma client
        run: |
          pnpm --filter @corrida/api exec prisma format
          pnpm --filter @corrida/api exec prisma generate

      - name: Verify migration paths
        run: |
          bash scripts/verify-adipometry-migration-existing-data.sh
          bash scripts/verify-adipometry-migration-full-chain.sh

      - name: Apply migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Verify adipometry persistence and governance
        run: |
          bash scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-audit-remediation.sh
          bash scripts/verify-adipometry-persistence-boundaries.sh
          GOVERNANCE_DATABASE_URL="${DATABASE_URL%%\?*}"
          DATABASE_URL="$GOVERNANCE_DATABASE_URL" bash scripts/verify-adipometry-clinical-governance.sh

      - name: Validate repository
        run: |
          pnpm type-check
          pnpm lint
          pnpm test
          pnpm build
          pnpm arch:check
          pnpm access:check
          pnpm docs:check

      - name: Commit validated lifecycle delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .adipometry-foundation-v2-*.ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated lifecycle delta to commit" >&2
            exit 1
          fi
          git commit -m "feat(adipometry): complete audited revision lifecycle"
          git push origin HEAD:feat/246-adipometry-foundation
