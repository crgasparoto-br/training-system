name: Apply Issue 273 Follow-up

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-273-followup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild follow-up patch
        run: |
          set -euo pipefail
          base64 --decode .issue273/followup.patch.gz.b64 > /tmp/issue273-followup.patch.gz
          gzip --test /tmp/issue273-followup.patch.gz
          gunzip --stdout /tmp/issue273-followup.patch.gz > /tmp/issue273-followup.patch
          wc -c /tmp/issue273-followup.patch

      - name: Validate and apply follow-up patch
        run: |
          set +e
          patch --dry-run -p1 --forward --batch < /tmp/issue273-followup.patch > /tmp/issue273-patch.log 2>&1
          status=$?
          cat /tmp/issue273-patch.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          patch -p1 --forward --batch < /tmp/issue273-followup.patch

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-273-followup-diagnostics-${{ github.run_id }}
          path: |
            /tmp/issue273-patch.log
            /tmp/issue273-followup.patch
          if-no-files-found: warn
          retention-days: 1

      - name: Remove transport-only files
        run: |
          rm -rf .issue273
          rm -f .github/workflows/apply-issue-273-followup.yml

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete PAR-Q cutover and documentation (#273)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
