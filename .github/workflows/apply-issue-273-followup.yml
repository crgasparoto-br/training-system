name: Apply Issue 273 Follow-up

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-273-followup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply cutover and documentation patch
        run: |
          base64 --decode .issue273/followup.patch.gz.b64 | gunzip > /tmp/issue273-followup.patch
          patch -p1 --forward --batch < /tmp/issue273-followup.patch

      - name: Remove transport-only files
        run: |
          rm -rf .issue273
          rm -f .github/workflows/apply-issue-273-followup.yml

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete PAR-Q cutover and documentation (#273)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
