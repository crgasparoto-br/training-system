name: Fix Issue 273 Migration Rerun

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/fix-issue-273-rerun.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Make onboarding constraints idempotent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '''DO $$ BEGIN
            ALTER TABLE "StudentOnboardingProcess"
              ADD CONSTRAINT "StudentOnboardingProcess_parqSubmissionId_key" UNIQUE ("parqSubmissionId");
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            ALTER TABLE "StudentOnboardingProcess"
              ADD CONSTRAINT "StudentOnboardingProcess_parqSubmissionId_fkey"
              FOREIGN KEY ("parqSubmissionId") REFERENCES "StudentParqSubmission"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          '''
          new = '''DO $$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'StudentOnboardingProcess_parqSubmissionId_key'
                AND conrelid = '"StudentOnboardingProcess"'::regclass
            ) THEN
              ALTER TABLE "StudentOnboardingProcess"
                ADD CONSTRAINT "StudentOnboardingProcess_parqSubmissionId_key" UNIQUE ("parqSubmissionId");
            END IF;
          END $$;
          DO $$ BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'StudentOnboardingProcess_parqSubmissionId_fkey'
                AND conrelid = '"StudentOnboardingProcess"'::regclass
            ) THEN
              ALTER TABLE "StudentOnboardingProcess"
                ADD CONSTRAINT "StudentOnboardingProcess_parqSubmissionId_fkey"
                FOREIGN KEY ("parqSubmissionId") REFERENCES "StudentParqSubmission"("id") ON DELETE SET NULL ON UPDATE CASCADE;
            END IF;
          END $$;
          '''
          for name in [
            'apps/api/prisma/migrations/20260725201000_issue_273_canonical_parq/migration.sql',
            'prisma/migrations/20260725201000_issue_273_canonical_parq/migration.sql',
          ]:
            path = Path(name)
            content = path.read_text()
            if old not in content:
              raise SystemExit(f'constraint block not found in {name}')
            path.write_text(content.replace(old, new, 1))
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-issue-273-rerun.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make PAR-Q onboarding constraints rerunnable (#273)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
