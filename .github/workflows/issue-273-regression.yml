name: Apply Issue 273 Remediation V3

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
      - '.issue273/remediation-v3-part-*.b64'
  push:
    branches:
      - feat/273-canonical-parq
    paths:
      - '.github/workflows/issue-273-regression.yml'
      - '.issue273/remediation-v3-part-*.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-remediation:
    name: Inspect validated issue 273 remediation tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 0

      - name: Decode and validate remediation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          import hashlib
          import io
          import pathlib
          import tarfile

          parts = sorted(glob.glob('.issue273/remediation-v3-part-*.b64'))
          if not parts:
              raise SystemExit('no remediation-v3 payload parts found')
          encoded = ''.join(
              ''.join(pathlib.Path(path).read_text(encoding='utf-8').split())
              for path in parts
          )
          raw = base64.b64decode(encoded, validate=True)
          print(f'payload bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} magic={raw[:8].hex()}')
          if raw[:6] != b'\xfd7zXZ\x00':
              raise SystemExit(f'payload is not xz: magic={raw[:8].hex()}')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              unsafe = [
                  member.name
                  for member in members
                  if member.name.startswith('/')
                  or '..' in pathlib.PurePosixPath(member.name).parts
                  or '.git' in pathlib.PurePosixPath(member.name).parts
              ]
              if unsafe:
                  raise SystemExit(f'unsafe payload paths: {unsafe}')
              print('--- validated payload files ---')
              for member in members:
                  print(member.name)
          PY

  apply-remediation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: inspect-remediation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 0

      - name: Apply validated payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          import io
          import pathlib
          import tarfile

          parts = sorted(glob.glob('.issue273/remediation-v3-part-*.b64'))
          encoded = ''.join(
              ''.join(pathlib.Path(path).read_text(encoding='utf-8').split())
              for path in parts
          )
          raw = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              unsafe = [
                  member.name
                  for member in members
                  if member.name.startswith('/')
                  or '..' in pathlib.PurePosixPath(member.name).parts
                  or '.git' in pathlib.PurePosixPath(member.name).parts
              ]
              if unsafe:
                  raise SystemExit(f'unsafe payload paths: {unsafe}')
              archive.extractall(path='.', members=members, filter='data')
          PY
          rm -rf .issue273
          git diff --check

      - name: Commit remediation to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: implement issue 273 audit remediation"
          git push origin HEAD:feat/273-canonical-parq
