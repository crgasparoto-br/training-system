name: Issue 273 Regression Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Apply remaining API type corrections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          prontuario = Path('apps/api/src/modules/prontuario/prontuario.service.ts')
          content = prontuario.read_text()
          if 'const includeRecord = {' not in content:
              marker = 'const prisma = new PrismaClient();\n'
              helpers = '''const prisma = new PrismaClient();

          const includeRecord = {
            goals: { orderBy: [{ priority: 'asc' as const }, { createdAt: 'asc' as const }] },
            anamnesisFollowUps: { orderBy: { createdAt: 'asc' as const } },
            activityHistory: { orderBy: { createdAt: 'asc' as const } },
            medicationsProcedures: { orderBy: { createdAt: 'asc' as const } },
            painCases: {
              include: { followUps: { orderBy: { followUpAt: 'desc' as const } } },
              orderBy: { createdAt: 'desc' as const },
            },
            discomfortSnapshots: {
              include: { entries: true },
              orderBy: { snapshotAt: 'desc' as const },
            },
          };

          function parseDate(value?: string | null) {
            if (!value) return undefined;
            const parsed = new Date(value.includes('T') ? value : `${value}T00:00:00`);
            return Number.isNaN(parsed.getTime()) ? undefined : parsed;
          }
          '''
              if marker not in content:
                  raise SystemExit('PRNT Prisma marker not found')
              content = content.replace(marker, helpers, 1)
          prontuario.write_text(content)

          profile = Path('apps/api/src/modules/alunos/profile-review.service.ts')
          content = profile.read_text()
          selection = re.compile(
              r'''      select: \{\n        contractId: true,\n        userId: true,\n        professor: \{ select: \{ contractId: true \} \},\n        currentStudentContract: \{\n          select: \{\n            contract: \{\n              select: \{\n                companyContractId: true,\n              \},\n            \},\n          \},\n        \},\n      \},\n'''
          )
          content, count = selection.subn(
              '      select: {\n        contractId: true,\n        userId: true,\n      },\n',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'profile review contract selection replacements: {count}')
          resolver = re.compile(
              r'''    const contractId = resolveAlunoCompanyContractId\(aluno\);\n    if \(!contractId\) \{\n      throw new Error\('Contrato do aluno não encontrado para aplicar revisão cadastral'\);\n    \}\n'''
          )
          content, count = resolver.subn('    const contractId = aluno.contractId;\n', content, count=1)
          if count != 1:
              raise SystemExit(f'profile review contract resolver replacements: {count}')
          profile.write_text(content)
          PY

      - name: Commit source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/prontuario/prontuario.service.ts \
            apps/api/src/modules/alunos/profile-review.service.ts
          git commit -m "fix: restore PRNT helpers and canonical contract context"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
