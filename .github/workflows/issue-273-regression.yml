name: Issue 273 Regression Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    name: Materialize repository for issue 273 remediation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package exact checkout
        run: tar -czf "$RUNNER_TEMP/training-system-checkout.tgz" .

      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: issue-273-checkout-${{ github.sha }}
          path: ${{ runner.temp }}/training-system-checkout.tgz
          if-no-files-found: error
          retention-days: 1
