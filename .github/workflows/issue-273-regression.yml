name: Inspect Issue 273 Remediation Payload

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
  push:
    branches:
      - feat/273-canonical-parq
    paths:
      - '.github/workflows/issue-273-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-remediation:
    name: Inspect issue 273 remediation v3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 0

      - name: Decode and inspect payload without modifying repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          import hashlib
          import io
          import pathlib
          import tarfile

          parts = sorted(glob.glob('.issue273/remediation-v3-part-*.b64'))
          if not parts:
              raise SystemExit('no remediation-v3 payload parts found')
          encoded = ''.join(pathlib.Path(path).read_text(encoding='utf-8').strip() for path in parts)
          print(f'parts={len(parts)} encoded_bytes={len(encoded)}')
          raw = base64.b64decode(encoded, validate=True)
          print(f'decoded_bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} magic={raw[:8].hex()}')
          if raw[:6] != b'\xfd7zXZ\x00':
              raise SystemExit(f'payload is not xz: magic={raw[:8].hex()}')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              print('--- payload files ---')
              for member in members:
                  print(member.name)
              unsafe = [m.name for m in members if m.name.startswith('/') or '..' in pathlib.PurePosixPath(m.name).parts]
              if unsafe:
                  raise SystemExit(f'unsafe payload paths: {unsafe}')
          PY
          echo '--- repository remains unchanged ---'
          test -z "$(git status --short)"
