name: Inspect Issue 273 Remediation Payload

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
  push:
    branches:
      - feat/273-canonical-parq
    paths:
      - '.github/workflows/issue-273-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-remediation:
    name: Inspect issue 273 remediation v3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 0

      - name: Decode and inspect payload without modifying repository
        shell: bash
        run: |
          set -euo pipefail
          cat .issue273/remediation-v3-part-*.b64 > "$RUNNER_TEMP/remediation.tgz.b64"
          base64 --decode "$RUNNER_TEMP/remediation.tgz.b64" > "$RUNNER_TEMP/remediation.tgz"
          echo '--- payload files ---'
          tar -tzf "$RUNNER_TEMP/remediation.tgz"
          mkdir "$RUNNER_TEMP/remediation-tree"
          tar -xzf "$RUNNER_TEMP/remediation.tgz" -C "$RUNNER_TEMP/remediation-tree"
          echo '--- payload checksums ---'
          find "$RUNNER_TEMP/remediation-tree" -type f -print0 | sort -z | xargs -0 sha256sum
          echo '--- repository remains unchanged ---'
          git status --short
