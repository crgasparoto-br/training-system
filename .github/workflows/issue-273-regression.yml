name: Export Issue 273 Remediation Sources

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
      - '.issue273/**'
  push:
    branches:
      - feat/273-canonical-parq
    paths:
      - '.github/workflows/issue-273-regression.yml'
      - '.issue273/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sources:
    name: Export issue 273 remediation source fragments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 0

      - name: Copy remediation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue273-sources
          cp .issue273/remediation-v3-part-*.b64 /tmp/issue273-sources/
          cp .issue273/atomic-*.b64 /tmp/issue273-sources/
          sha256sum /tmp/issue273-sources/* > /tmp/issue273-sources/SHA256SUMS

      - name: Upload remediation sources
        uses: actions/upload-artifact@v4
        with:
          name: issue-273-remediation-sources-${{ github.run_id }}
          path: /tmp/issue273-sources
          if-no-files-found: error
          retention-days: 3
