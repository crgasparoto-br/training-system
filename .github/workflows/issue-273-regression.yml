name: Extract Issue 273 Remediation V3

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
      - '.issue273/remediation-v3-part-*.b64'
  push:
    branches:
      - feat/273-canonical-parq
    paths:
      - '.github/workflows/issue-273-regression.yml'
      - '.issue273/remediation-v3-part-*.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-payload:
    name: Extract validated issue 273 remediation v3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 0

      - name: Decode, validate and extract payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue-273-remediation-v3
          python - <<'PY'
          import base64
          import glob
          import hashlib
          import io
          import json
          import pathlib
          import tarfile

          paths = sorted(glob.glob('.issue273/remediation-v3-part-*.b64'))
          if not paths:
              raise SystemExit('no remediation-v3 payload parts found')
          encoded = ''.join(
              ''.join(pathlib.Path(path).read_text(encoding='utf-8').split())
              for path in paths
          )
          padding = (-len(encoded)) % 4
          encoded += '=' * padding
          raw = base64.b64decode(encoded, validate=True)
          if raw[:6] != b'\xfd7zXZ\x00':
              raise SystemExit(f'payload is not xz: magic={raw[:8].hex()}')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              unsafe = [
                  member.name
                  for member in members
                  if member.name.startswith('/')
                  or '..' in pathlib.PurePosixPath(member.name).parts
                  or '.git' in pathlib.PurePosixPath(member.name).parts
              ]
              if unsafe:
                  raise SystemExit(f'unsafe payload paths: {unsafe}')
              archive.extractall(path='/tmp/issue-273-remediation-v3', members=members, filter='data')
              manifest = {
                  'parts': paths,
                  'padding_added': padding,
                  'decoded_length': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'members': [{'name': member.name, 'size': member.size} for member in members],
              }
          pathlib.Path('/tmp/issue-273-remediation-v3/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Upload extracted payload
        uses: actions/upload-artifact@v4
        with:
          name: issue-273-remediation-v3-${{ github.run_id }}
          path: /tmp/issue-273-remediation-v3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
