name: Issue 273 Regression Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-tests:
    name: Align legacy UI tests with canonical PAR-Q cutover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update discriminant frontend fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          form_test = Path('apps/web/src/pages/AlunoForm.behavior.test.tsx')
          content = form_test.read_text()
          empty_parq = '''const emptyParq = {
            q1: false,
            q2: false,
            q3: false,
            q4: false,
            q5: false,
            q6: false,
            q7: false,
            q8: false,
          };

          '''
          if empty_parq not in content:
              raise SystemExit('emptyParq fixture not found')
          content = content.replace(empty_parq, '', 1)
          old_expectation = '''      age: 30,
                intakeForm: {
                  parqResponses: emptyParq,
                },
              });
              assertAssessmentFieldsAreAbsent(payload);
          '''
          new_expectation = '''      age: 30,
              });
              expect(payload.intakeForm).not.toHaveProperty('parqResponses');
              assertAssessmentFieldsAreAbsent(payload);
          '''
          if old_expectation not in content:
              raise SystemExit('legacy AlunoForm PAR-Q expectation not found')
          form_test.write_text(content.replace(old_expectation, new_expectation, 1))

          resumo_test = Path('apps/web/src/components/alunos/AlunoResumoHubTab.test.tsx')
          content = resumo_test.read_text()
          old_fixture = '''      intakeForm: {
                assessmentDate: '2026-02-01T12:00:00.000Z',
                mainGoal: 'Correr 10 km sem dor',
                parqResponses: {
                  chestPain: true,
                  dizziness: false,
                },
              },
          '''
          new_fixture = '''      intakeForm: {
                assessmentDate: '2026-02-01T12:00:00.000Z',
                mainGoal: 'Correr 10 km sem dor',
              },
              parq: {
                state: 'COMPLETED_REVIEW_REQUIRED',
                latestSubmission: {
                  id: 'submission-1',
                  positiveCount: 1,
                },
              },
          '''
          if old_fixture not in content:
              raise SystemExit('legacy AlunoResumoHubTab PAR-Q fixture not found')
          resumo_test.write_text(content.replace(old_fixture, new_fixture, 1))
          PY

      - name: Commit test corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/pages/AlunoForm.behavior.test.tsx \
            apps/web/src/components/alunos/AlunoResumoHubTab.test.tsx
          git commit -m "test: align UI fixtures with canonical PAR-Q cutover"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
