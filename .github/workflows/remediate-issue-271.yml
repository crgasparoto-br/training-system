name: Remediate Issue 271

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/remediate-issue-271.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Apply remediation
        run: python3 scripts/remediate-issue-271.py

      - name: Commit remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/utils/brazilian-cpf.ts packages/utils/brazilian-cpf.test.ts packages/utils/index.ts \
            apps/api/src/modules/pre-registration-public/pre-registration-public.routes.ts \
            apps/api/src/modules/alunos/student-identity.service.ts \
            apps/api/src/modules/alunos/student-public-pre-registration.service.ts \
            apps/api/tests/pre-registration-public.integration.test.ts \
            apps/web/src/pages/PublicPreRegistration/PublicPreRegistration.tsx \
            apps/web/src/pages/PublicPreRegistration/PublicPreRegistration.test.tsx
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit.'
          else
            git commit -m "fix: validate identity and clarify health handoff (#271)"
            git push origin HEAD:feat/271-public-pre-registration
          fi
