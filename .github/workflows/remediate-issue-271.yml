name: Remediate Issue 271

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/remediate-issue-271.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply remediation
        run: python3 scripts/remediate-issue-271.py

      - name: Remove orchestration-only files
        run: |
          rm -f scripts/remediate-issue-271.py
          rm -f .github/workflows/remediate-issue-271.yml
          rm -f .github/workflows/export-issue-271-source.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: pnpm docs:check

      - name: Commit validated remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: validate identity and clarify health handoff (#271)"
          git push origin HEAD:feat/271-public-pre-registration
