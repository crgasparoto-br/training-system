name: Export Issue 270 Source

on:
  push:
    branches:
      - feat/270-pre-registration-admin
    paths:
      - '.github/workflows/export-issue-270-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: issue-270-source-${{ github.run_id }}
          path: .
          include-hidden-files: true
          retention-days: 1
