name: Apply Issue 246 Prisma Fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/246-adipometry-foundation

      - name: Apply verified Prisma fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/issue246-prisma-fix.tar.gz
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/b901dd6aadc37b408a1163baf82efabf901166bb" \
            | jq --raw-output '.content' \
            | tr -d '\n' \
            | base64 --decode > "$package"
          echo "cccbd787daaedc250bce0418f1d5490bf9b6491bb5b698f7b476a087c3ffbc0f  $package" | sha256sum --check --strict
          tar --extract --gzip --file "$package" --directory /tmp/issue246-prisma-fix
          bash /tmp/issue246-prisma-fix/apply-issue246-prisma-fix.sh

      - name: Commit Prisma relation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma apps/api/prisma/migrations/20260730141000_add_adipometry_relation_uniques/migration.sql
          git diff --cached --check
          git commit -m "fix(adpt): align Prisma correction relations"
          git push origin HEAD:feat/246-adipometry-foundation
