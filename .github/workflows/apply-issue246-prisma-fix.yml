name: Apply Issue 246 Prisma Fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.pull_request.head.sha || '', 'never')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/246-adipometry-foundation

      - name: Apply verified Prisma fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/issue246-prisma-fix.tar.gz
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/dbf7e55cd7af9bd84ac9f6531875cd2a7b4e7d2c" \
            | jq --raw-output '.content' \
            | tr -d '\n' \
            | base64 --decode > "$package"
          echo "2dc62f7a7f653907bfbf9d30d1523ce48fef4a719c86f71e020fcfd0c13dad37  $package" | sha256sum --check --strict
          tar --extract --gzip --file "$package" --directory "$GITHUB_WORKSPACE"
          git checkout HEAD -- .github/workflows/apply-issue246-prisma-fix.yml

      - name: Commit Prisma relation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma apps/api/prisma/migrations/20260730141000_add_adipometry_relation_uniques/migration.sql
          git diff --cached --check
          git commit -m "fix(adpt): align Prisma correction relations"
          git push origin HEAD:feat/246-adipometry-foundation
