name: Issue 248 Adipometry Integration

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/verify-issue-248-*'
      - 'apps/api/src/modules/access-control/professional-actor.service.ts'
      - 'apps/api/src/modules/adipometry/**'
      - 'apps/api/src/modules/auth/auth.routes.ts'
      - 'apps/web/src/pages/PhysicalAssessment/Adipometry*.tsx'
      - 'apps/web/src/pages/PhysicalAssessment/adipometry-*.ts'
      - 'apps/web/src/pages/PhysicalAssessment/useAdipometryWorkspace.ts'
      - 'apps/web/src/pages/PhysicalAssessmentProtocol.tsx'
      - 'apps/web/src/services/adipometry.service.ts'
      - 'packages/types/adipometry-web.ts'
      - '.github/workflows/issue-248-adipometry-integration.yml'

permissions:
  contents: read

concurrency:
  group: issue-248-adipometry-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-browser:
    name: Validate ADPT with browser, API and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      NODE_ENV: test
      JWT_SECRET: issue-248-adipometry-browser-integration-secret
      CORS_ORIGINS: http://127.0.0.1:4180
      FRONTEND_URL: http://127.0.0.1:4180

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence manifest
        shell: bash
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          AUDIT_MERGE_PREVIEW_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          mkdir -p artifacts/issue-275
          cat > artifacts/issue-275/issue-248-integration-evidence.json <<EOF
          {
            "schemaVersion": 1,
            "kind": "issue-248-adipometry-integration",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "eventName": "${GITHUB_EVENT_NAME}",
            "headSha": "${AUDIT_HEAD_SHA}",
            "baseSha": "${AUDIT_BASE_SHA}",
            "mergePreviewSha": "${AUDIT_MERGE_PREVIEW_SHA}",
            "dataset": "synthetic-postgresql-16"
          }
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime dependencies
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          VITE_API_URL=http://127.0.0.1:3011 pnpm --filter @corrida/web build

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Install Chrome
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Apply migrations
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec prisma migrate deploy 2>&1 \
            | tee artifacts/issue-275/issue-248-migrations.log

      - name: Verify ADPT integrated browser flow
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-248-adipometry-browser-runner.ts 2>&1 \
            | tee artifacts/issue-275/issue-248-browser.log

      - name: Upload ADPT integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-248-adipometry-integration-${{ github.run_id }}
          path: artifacts/issue-275
          if-no-files-found: error
          retention-days: 14
