name: Issue 275 Rollout Consumer Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/config/pre-registration-availability*'
      - 'apps/web/src/config/pre-registration-rollout*'
      - 'apps/web/src/pages/PreRegistrationAvailabilityBoundary*'
      - 'apps/web/src/pages/PreRegistrationUnavailable.tsx'
      - 'apps/web/src/services/api.ts'
      - 'apps/api/tests/issue-275-rollout-consumer.browser.integration.test.ts'
      - 'docs/operations/pre-registration-rollout-and-qa.md'
      - 'docs/operations/pre-registration-rollout-audience-contract.md'
      - '.github/workflows/issue-275-rollout-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-275-rollout-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rollout-consumer:
    name: Verify disabled rollout at the real consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      VITE_API_URL: http://127.0.0.1:3002
      VITE_PRE_REGISTRATION_ENABLED: 'true'
      RUN_ISSUE_275_ROLLOUT_CONSUMER_BROWSER: 'true'
      JWT_SECRET: issue-275-rollout-consumer-ci-secret
      CORS_ORIGINS: http://127.0.0.1:4176
      FRONTEND_URL: http://127.0.0.1:4176
      PRIVACY_NOTICE_URL: https://example.test/privacidade
      PRIVACY_NOTICE_VERSION: 2026-07
      HEALTH_PRIVACY_NOTICE_VERSION: 2026-07

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build route-enabled web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/issue-275
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build 2>&1 \
            | tee artifacts/issue-275/rollout-consumer-web-build.log

      - name: Generate Prisma Client and apply migrations
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec prisma generate
          pnpm --filter @corrida/api exec prisma migrate deploy 2>&1 \
            | tee artifacts/issue-275/rollout-consumer-migrations.log

      - name: Install Chrome
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Verify availability boundary controls
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/web exec vitest run \
            src/pages/PreRegistrationAvailabilityBoundary.test.tsx 2>&1 \
            | tee artifacts/issue-275/rollout-consumer-unit.log

      - name: Verify public, resume and administrative consumers
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec jest --runInBand \
            tests/issue-275-rollout-consumer.browser.integration.test.ts 2>&1 \
            | tee artifacts/issue-275/rollout-consumer-browser.log

      - name: Verify evidence semantics
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/issue-275/rollout-consumer-browser.json
          test -s artifacts/issue-275/rollout-consumer-public-token-route.png
          test -s artifacts/issue-275/rollout-consumer-authenticated-resume.png
          test -s artifacts/issue-275/rollout-consumer-administrative-list.png
          jq -e '
            .schemaVersion == 2 and
            .buildMode == "pre-registration-route-enabled" and
            .apiMode == "PRE_REGISTRATION_ENABLED=false" and
            (.surfaces | length) == 3 and
            ([.surfaces[] | select(.rawCodeAbsent != true)] | length) == 0 and
            ([.surfaces[] | select(.contradictoryInviteGuidanceAbsent != true)] | length) == 0 and
            ([.surfaces[] | select(.audienceCopyMatched != true)] | length) == 0 and
            ([.surfaces[] | select(.wrongAudienceCopyAbsent != true)] | length) == 0 and
            ([.surfaces[] | select(.name == "public-token-route" and .audience == "public")] | length) == 1 and
            ([.surfaces[] | select(.name == "authenticated-resume" and .audience == "authenticated")] | length) == 1 and
            ([.surfaces[] | select(.name == "administrative-list" and .audience == "administrative")] | length) == 1
          ' artifacts/issue-275/rollout-consumer-browser.json >/dev/null
          grep -q 'Test Suites:.*passed' artifacts/issue-275/rollout-consumer-browser.log
          grep -q 'Test Files.*passed' artifacts/issue-275/rollout-consumer-unit.log

      - name: Upload rollout consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-275-rollout-consumer-${{ github.run_id }}
          path: artifacts/issue-275
          if-no-files-found: error
          retention-days: 14
