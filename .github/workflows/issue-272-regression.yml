name: Issue 272 Regression Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-272-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-tests:
    name: Align issue 273 frontend tests with canonical PAR-Q
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update discriminant frontend fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          form_test = Path('apps/web/src/pages/AlunoForm.behavior.test.tsx')
          content = form_test.read_text()
          content, count = re.subn(r'const emptyParq = \{.*?\};\n\n', '', content, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'emptyParq replacements: {count}')
          content, count = re.subn(
              r'''      age: 30,\n      intakeForm: \{\n        parqResponses: emptyParq,\n      \},\n    \}\);\n    assertAssessmentFieldsAreAbsent\(payload\);''',
              "      age: 30,\n    });\n    expect(payload.intakeForm).not.toHaveProperty('parqResponses');\n    assertAssessmentFieldsAreAbsent(payload);",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'AlunoForm expectation replacements: {count}')
          form_test.write_text(content)

          resumo_test = Path('apps/web/src/components/alunos/AlunoResumoHubTab.test.tsx')
          content = resumo_test.read_text()
          content, count = re.subn(
              r'''      intakeForm: \{\n        assessmentDate: '2026-02-01T12:00:00.000Z',\n        mainGoal: 'Correr 10 km sem dor',\n        parqResponses: \{\n          chestPain: true,\n          dizziness: false,\n        \},\n      \},''',
              '''      intakeForm: {
        assessmentDate: '2026-02-01T12:00:00.000Z',
        mainGoal: 'Correr 10 km sem dor',
      },
      parq: {
        state: 'COMPLETED_REVIEW_REQUIRED',
        latestSubmission: {
          id: 'submission-1',
          positiveCount: 1,
        },
      },''',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'AlunoResumoHubTab fixture replacements: {count}')
          resumo_test.write_text(content)
          PY

      - name: Commit test corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/pages/AlunoForm.behavior.test.tsx \
            apps/web/src/components/alunos/AlunoResumoHubTab.test.tsx
          git commit -m "test: align UI fixtures with canonical PAR-Q cutover"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
