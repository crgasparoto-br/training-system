name: Issue 136 Adipometry Remediation

on:
  push:
    branches:
      - fix/136-capacity-prescription-persistence

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'persist adipometry methodology snapshot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/136-capacity-prescription-persistence
          fetch-depth: 0

      - name: Apply readable remediation scripts
        shell: bash
        run: |
          python .github/remediation/issue-136/01-core.py
          python .github/remediation/issue-136/02-source.py
          python .github/remediation/issue-136/03-tests-docs.py

      - name: Remove temporary remediation files and commit
        shell: bash
        run: |
          rm -rf .github/remediation/issue-136
          rm -f .github/workflows/issue-136-adipometry-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: persist adipometry methodology snapshot"
          git push origin HEAD:fix/136-capacity-prescription-persistence
