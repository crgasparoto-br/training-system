name: Bootstrap issue 247 remediation v2

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/247-adipometry-api' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/247-adipometry-api
          fetch-depth: 0

      - name: Execute corrected remediation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-247-remediation-runner.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit patch and remove temporary workflows"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('runner script markers not found')

          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )

          helper_old = (
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          )
          helper_new = (
              'updated, count = re.subn('
              'pattern, lambda _match: replacement, text, count=1, flags=flags)'
          )
          if code.count(helper_old) != 1:
              raise SystemExit('substitution helper was not found exactly once')
          code = code.replace(helper_old, helper_new, 1)

          permission_start = (
              'replace_once(\n'
              '    test,\n'
              '    """  await Promise.all(['
          )
          start = code.find(permission_start)
          if start < 0:
              raise SystemExit('permission replacement start was not found')
          end = code.find('\nsub_once(', start)
          if end < 0:
              raise SystemExit('permission replacement end was not found')

          permission_replacement = r'''sub_once(
    test,
    r"  await Promise\.all\(\[\n\s*setPermission\(collaboratorFunction\.id, '', true\),\n\s*setPermission\(collaboratorFunction\.id, VIEW_KEY, true\),\n\s*setPermission\(collaboratorFunction\.id, MANAGE_KEY, true\),\n\s*setPermission\(collaboratorFunction\.id, CORRECT_KEY, false\),\n\s*\]\);",
    """  await Promise.all([
    setPermission(operatorFunction.id, '', true),
    setPermission(operatorFunction.id, VIEW_KEY, true),
    setPermission(operatorFunction.id, MANAGE_KEY, true),
    setPermission(operatorFunction.id, CORRECT_KEY, false),
  ]);""",
)'''
          code = code[:start] + permission_replacement + code[end:]

          cleanup_old = (
              "Path('.github/workflows/issue-247-remediation-patch.yml').unlink()\n"
              "Path('.github/workflows/issue-247-remediation-runner.yml').unlink()"
          )
          cleanup_new = "\n".join([
              "Path('.github/workflows/issue-247-remediation-patch.yml').unlink(missing_ok=True)",
              "Path('.github/workflows/issue-247-remediation-runner.yml').unlink(missing_ok=True)",
              "Path('.github/workflows/issue-247-remediation-bootstrap.yml').unlink(missing_ok=True)",
              "Path('.github/workflows/issue-247-remediation-bootstrap-v2.yml').unlink(missing_ok=True)",
          ])
          if code.count(cleanup_old) != 1:
              raise SystemExit('cleanup block was not found exactly once')
          code = code.replace(cleanup_old, cleanup_new, 1)

          Path('/tmp/issue-247-remediation.py').write_text(code + '\n')
          PY
          python /tmp/issue-247-remediation.py

      - name: Commit remediation and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(adpt): remediate adversarial CI failures'
          git push origin HEAD:feat/247-adipometry-api
