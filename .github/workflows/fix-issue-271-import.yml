name: Fix Issue 271 Type Import

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/fix-issue-271-import.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/271-public-pre-registration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Add missing shared type import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/PublicPreRegistration/PublicPreRegistration.tsx')
          text = path.read_text()
          anchor = '  PreRegistrationSessionDTO,\n  PreRegistrationStep,\n'
          replacement = '  PreRegistrationSessionDTO,\n  PreRegistrationStep,\n  SavePreRegistrationStepDTO,\n'
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('type import anchor not found')
              path.write_text(text.replace(anchor, replacement, 1))
          PY
          rm -f .github/workflows/fix-issue-271-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: import issue 271 save-step DTO'
          git push origin HEAD:feat/271-public-pre-registration
