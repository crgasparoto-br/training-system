name: Issue 274 Loop Visible Remediation

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-274-loop-visible.yml'
      - '.audit/issue-loop-engineer/remediate-issue-274-v2.py'
      - '.audit/issue-loop-engineer/adjust-issue-274-tests-v2.py'
      - '.audit/issue-loop-engineer/adjust-issue-274-lock-v3.py'

permissions:
  contents: write

jobs:
  remediate:
    name: Apply, test and publish audit remediations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/274-enrollment-conversion
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply remediation patch
        run: |
          python .audit/issue-loop-engineer/remediate-issue-274-v2.py
          python .audit/issue-loop-engineer/adjust-issue-274-tests-v2.py
          python .audit/issue-loop-engineer/adjust-issue-274-lock-v3.py

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Validate civil date contract
        run: pnpm --filter @corrida/api test -- --runInBand tests/student-identity-civil-date.test.ts

      - name: Validate atomicity and concurrent deduplication
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/issue-274-loop-diagnostic
          RUN_DATABASE_INTEGRATION_TESTS=true pnpm --filter @corrida/api test -- --runInBand tests/issue-274-loop-remediation.integration.test.ts 2>&1 \
            | tee artifacts/issue-274-loop-diagnostic/atomicity-test.txt

      - name: Upload atomicity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-274-loop-diagnostic-${{ github.run_id }}
          path: artifacts/issue-274-loop-diagnostic
          if-no-files-found: warn
          retention-days: 7

      - name: Validate existing issue 274 remediation scenarios
        run: RUN_DATABASE_INTEGRATION_TESTS=true pnpm --filter @corrida/api test -- --runInBand tests/issue-274-a005-a006-remediation.integration.test.ts

      - name: Validate public deduplication contract
        run: pnpm --filter @corrida/api test -- --runInBand tests/pre-registration-public-deduplication.contract.test.ts

      - name: Type check API
        run: pnpm --filter @corrida/api type-check

      - name: Publish remediation commit
        shell: bash
        run: |
          git config user.name "solverit-issue-loop"
          git config user.email "solverit-issue-loop@users.noreply.github.com"
          rm -f .audit/issue-loop-engineer/remediate-issue-274-v2.py
          rm -f .audit/issue-loop-engineer/adjust-issue-274-tests-v2.py
          rm -f .audit/issue-loop-engineer/adjust-issue-274-lock-v3.py
          rm -f .github/workflows/issue-274-loop-visible.yml
          rm -rf artifacts/issue-274-loop-diagnostic
          git add -A
          git diff --cached --check
          git commit -m "fix(issue-274): fechar atomicidade e data civil"
          git push origin HEAD:feat/274-enrollment-conversion
