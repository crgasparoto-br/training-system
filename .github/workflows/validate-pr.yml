name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  issue_246_bootstrap:
    name: Apply issue 246 foundation
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/246-adipometry-domain-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract implementation bundle
        shell: bash
        run: |
          sed -n '/BUNDLE_BASE64: >-/{n;s/^[[:space:]]*//;p;q;}' \
            .github/workflows/issue-246-bootstrap.yml > /tmp/issue-246-bundle.base64
          base64 -d /tmp/issue-246-bundle.base64 > /tmp/issue-246-bundle.tar.gz
          tar -xzf /tmp/issue-246-bundle.tar.gz

      - name: Apply deterministic patch
        run: node scripts/apply-issue-246-foundation.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Prisma schema
        run: pnpm --filter @corrida/api exec prisma format --schema prisma/schema.prisma

      - name: Validate generated changes
        run: |
          pnpm type-check
          pnpm arch:check
          pnpm docs:check

      - name: Commit implementation and remove bootstrap
        shell: bash
        run: |
          git checkout origin/develop -- .github/workflows/validate-pr.yml
          rm .github/workflows/issue-246-bootstrap.yml
          rm scripts/apply-issue-246-foundation.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(adipometry): add historical domain foundation'
          git push origin HEAD:${{ github.head_ref }}
