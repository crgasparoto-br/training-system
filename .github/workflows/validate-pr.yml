name: Apply Issue 268 Final Type Fixes

on:
  pull_request:
    types:
      - reopened
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    name: Apply final tenant type fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/268-student-lifecycle-domain

      - name: Apply corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .issue268-type-fixes.py
          rm .issue268-type-fixes.py
          git diff --check
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-issue-268"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(alunos): complete canonical tenant type propagation"
          git push origin HEAD:feature/268-student-lifecycle-domain
