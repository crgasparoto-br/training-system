name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/270-pre-registration-admin
          fetch-depth: 0

      - name: Apply final responsive correction
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          layout = Path('apps/web/src/layouts/DashboardLayout.tsx')
          layout_text = layout.read_text().replace(
              "<main className={cn('flex-1 py-6 transition-all duration-200'",
              "<main className={cn('min-w-0 flex-1 py-6 transition-all duration-200'",
          )
          layout.write_text(layout_text)

          page = Path('apps/web/src/pages/PreRegistrationAdmin/PreRegistrationAdminList.tsx')
          text = page.read_text()
          table = '''              <div className="hidden w-full min-w-0 max-w-full overflow-x-auto md:block">
                <table className="w-full table-fixed text-left text-sm">
                  <thead className="border-b border-border text-xs uppercase tracking-wide text-muted-foreground">
                    <tr>
                      <th className="w-[23%] px-3 py-3">Pessoa</th>
                      <th className="w-[15%] px-3 py-3">Etapa e convite</th>
                      <th className="w-[14%] px-3 py-3">Progresso</th>
                      <th className="w-[14%] px-3 py-3">Responsável</th>
                      <th className="w-[13%] px-3 py-3">Última atividade</th>
                      <th className="w-[17%] px-3 py-3">Próxima ação</th>
                      <th className="w-[4%] px-2 py-3">
                        <span className="sr-only">Abrir</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-border">
                    {result.items.map((lead) => (
                      <tr key={lead.id} className="hover:bg-muted/40">
                        <td className="min-w-0 px-3 py-3 align-top">
                          <Link
                            className="block truncate font-medium text-foreground hover:text-primary"
                            to={`/pre-matriculas/${lead.id}`}
                          >
                            {lead.name}
                          </Link>
                          <p className="mt-0.5 truncate text-xs text-muted-foreground">
                            {contactLine(lead)}
                          </p>
                          <p className="mt-1 truncate text-[11px] text-muted-foreground">
                            Origem: {lead.origin}
                          </p>
                          {lead.contacts.masked && (
                            <p className="mt-1 text-[11px] text-muted-foreground">
                              Contato protegido por permissão
                            </p>
                          )}
                        </td>
                        <td className="px-3 py-3 align-top">
                          <span className={statusClass(lead.status)}>
                            {STATUS_LABELS[lead.status]}
                          </span>
                          <p className="mt-2 text-xs text-muted-foreground">
                            Convite: {inviteLabel(lead)}
                          </p>
                        </td>
                        <td className="px-3 py-3 align-top">
                          <ProgressSummary lead={lead} />
                        </td>
                        <td className="px-3 py-3 align-top text-muted-foreground">
                          <span className="line-clamp-3">
                            {lead.responsible?.name || 'Não definido'}
                          </span>
                        </td>
                        <td className="px-3 py-3 align-top text-muted-foreground">
                          {formatDate(lead.lastActivityAt)}
                        </td>
                        <td className="min-w-0 px-3 py-3 align-top">
                          <span className="block font-medium text-foreground">
                            {lead.nextAction.label}
                          </span>
                          <p className="mt-0.5 line-clamp-3 text-xs text-muted-foreground">
                            {lead.nextAction.description}
                          </p>
                          {lead.progress.parqRequiresProfessionalReview && (
                            <p className="mt-2 flex items-center gap-1 text-xs font-medium text-warning">
                              <ShieldAlert className="h-3.5 w-3.5" aria-hidden="true" />
                              Atenção profissional
                            </p>
                          )}
                        </td>
                        <td className="px-2 py-3 align-top">
                          <Link
                            aria-label={`Abrir ${lead.name}`}
                            to={`/pre-matriculas/${lead.id}`}
                          >
                            <ArrowRight className="h-4 w-4 text-muted-foreground" />
                          </Link>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
'''
          text, replacements = re.subn(
              r'              <div className="hidden w-full min-w-0 max-w-full overflow-x-auto md:block">.*?              </div>\n',
              table,
              text,
              count=1,
              flags=re.S,
          )
          if replacements != 1:
              raise SystemExit(f'Expected one table replacement, got {replacements}')
          page.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/layouts/DashboardLayout.tsx apps/web/src/pages/PreRegistrationAdmin/PreRegistrationAdminList.tsx
          git diff --cached --check
          git commit -m 'fix: align pre-registration table and mobile shell'
          git push origin HEAD:feat/270-pre-registration-admin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (api)
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply test database migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Verify lifecycle legacy backfill
        run: |
          set -o pipefail
          bash scripts/verify-student-lifecycle-legacy-backfill.sh 2>&1 | tee lifecycle-backfill-output.log

      - name: Upload lifecycle legacy backfill output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-backfill-output-${{ github.run_id }}
          path: lifecycle-backfill-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify lifecycle migration rerun
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e PGPASSWORD=postgres \
            postgres:16-alpine \
            psql -h localhost -U postgres -d training_system_test -v ON_ERROR_STOP=1 \
            -f /workspace/apps/api/prisma/migrations/20260721120000_student_lifecycle_domain/migration.sql

      - name: Type check
        run: |
          set -o pipefail
          pnpm type-check 2>&1 | tee type-check-output.log

      - name: Upload type-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-output-${{ github.run_id }}
          path: type-check-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: |
          set -o pipefail
          pnpm docs:check 2>&1 | tee docs-check-output.log

      - name: Upload documentation check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-check-output-${{ github.run_id }}
          path: docs-check-output.log
          if-no-files-found: ignore
          retention-days: 7
