name: Issue 246 Schema Cleanup

on:
  pull_request:
    branches:
      - develop

jobs:
  cleanup:
    if: github.head_ref == 'feat/246-adipometry-domain-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore canonical schema and apply targeted ADPT additions
        shell: bash
        run: |
          git show origin/develop:apps/api/prisma/schema.prisma > apps/api/prisma/schema.prisma
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/prisma/schema.prisma';

          function replaceOnce(content, anchor, replacement, label) {
            const count = content.split(anchor).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: expected exactly one anchor, found ${count}`);
            }
            return content.replace(anchor, replacement);
          }

          const schemaModels = `model AdipometryProtocolVersion {
            id                  String                    @id @default(cuid())
            code                String
            name                String
            version             String
            status              AdipometryProtocolStatus @default(DRAFT)
            reference           String?
            populationCriteria  Json?
            requiredSkinfolds   String[]                  @default([])
            inputUnits          Json?
            outputUnits         Json?
            equations           Json?
            limits              Json?
            precisionRules      Json?
            missingDataBehavior String
            testVectors         Json?
            approvedAt          DateTime?
            approvedBy          String?
            disabledReason      String?
            createdAt           DateTime                  @default(now())
            updatedAt           DateTime                  @updatedAt
            assessments         AdipometryAssessment[]

            @@unique([code, version])
            @@index([status, code])
          }

          model AdipometrySequence {
            id         String          @id @default(cuid())
            contractId String
            alunoId    String
            lastValue  Int             @default(0)
            createdAt  DateTime        @default(now())
            updatedAt  DateTime        @updatedAt
            contract   CompanyContract @relation("AdipometrySequenceContract", fields: [contractId], references: [id], onDelete: Cascade)
            aluno      Aluno           @relation("AdipometrySequenceAluno", fields: [alunoId], references: [id], onDelete: Cascade)

            @@unique([contractId, alunoId])
            @@index([alunoId])
          }

          model AdipometryAssessment {
            id                     String                      @id @default(cuid())
            contractId             String
            alunoId                String
            professorId            String
            code                   String
            sequenceNumber         Int
            assessmentDate         DateTime
            status                 AdipometryAssessmentStatus @default(DRAFT)
            weightKg               Decimal?                    @db.Decimal(6, 3)
            tricepsMm              Decimal?                    @db.Decimal(6, 2)
            subscapularMm          Decimal?                    @db.Decimal(6, 2)
            suprailiacMm           Decimal?                    @db.Decimal(6, 2)
            abdominalMm            Decimal?                    @db.Decimal(6, 2)
            thighMm                Decimal?                    @db.Decimal(6, 2)
            sumSkinfoldsMm         Decimal?                    @db.Decimal(7, 2)
            bodyFatPercentage      Decimal?                    @db.Decimal(5, 2)
            fatMassKg              Decimal?                    @db.Decimal(7, 3)
            leanMassKg             Decimal?                    @db.Decimal(7, 3)
            protocolCode           String?
            protocolVersion        String?
            calculationSnapshot    Json?
            supportAnthropometryId String?
            notes                  String?
            correctionOfId         String?                     @unique
            correctionReason       String?
            correctedByProfessorId String?
            correctedAt            DateTime?
            createdAt              DateTime                    @default(now())
            updatedAt              DateTime                    @updatedAt
            contract               CompanyContract             @relation("AdipometryAssessmentContract", fields: [contractId], references: [id], onDelete: Cascade)
            aluno                  Aluno                       @relation("AdipometryAssessmentAluno", fields: [alunoId], references: [id], onDelete: Cascade)
            professor              Professor                   @relation("AdipometryAssessmentProfessor", fields: [professorId], references: [id], onDelete: Restrict)
            protocol               AdipometryProtocolVersion?  @relation(fields: [protocolCode, protocolVersion], references: [code, version], onDelete: Restrict)
            supportAnthropometry   AnthropometryAssessment?    @relation("AdipometryAnthropometryReference", fields: [supportAnthropometryId], references: [id], onDelete: SetNull)
            correctionOf           AdipometryAssessment?       @relation("AdipometryCorrection", fields: [correctionOfId], references: [id], onDelete: Restrict)
            correctedByAssessment  AdipometryAssessment?       @relation("AdipometryCorrection")
            correctedByProfessor   Professor?                  @relation("AdipometryCorrectedByProfessor", fields: [correctedByProfessorId], references: [id], onDelete: Restrict)
            auditLogs              AdipometryAuditLog[]

            @@unique([contractId, alunoId, code])
            @@unique([contractId, alunoId, sequenceNumber])
            @@index([contractId, alunoId, assessmentDate])
            @@index([contractId, alunoId, status, assessmentDate])
            @@index([professorId])
            @@index([protocolCode, protocolVersion])
            @@index([supportAnthropometryId])
            @@index([correctedByProfessorId])
          }

          model AdipometryAuditLog {
            id               String                @id @default(cuid())
            contractId       String
            assessmentId     String
            actorProfessorId String
            action           AdipometryAuditAction
            reason           String?
            beforeSnapshot   Json?
            afterSnapshot    Json?
            createdAt        DateTime              @default(now())
            contract         CompanyContract       @relation("AdipometryAuditContract", fields: [contractId], references: [id], onDelete: Cascade)
            assessment       AdipometryAssessment  @relation(fields: [assessmentId], references: [id], onDelete: Cascade)
            actorProfessor   Professor             @relation("AdipometryAuditActor", fields: [actorProfessorId], references: [id], onDelete: Restrict)

            @@index([contractId, assessmentId, createdAt])
            @@index([actorProfessorId, createdAt])
          }

          `;

          const schemaEnums = `
          enum AdipometryAssessmentStatus {
            DRAFT
            COMPLETED
          }

          enum AdipometryProtocolStatus {
            DRAFT
            APPROVED
            DISABLED
          }

          enum AdipometryAuditAction {
            DRAFT_CREATED
            DRAFT_UPDATED
            COMPLETED
            CORRECTION_CREATED
            CORRECTION_VIEWED
          }
          `;

          let content = fs.readFileSync(path, 'utf8');
          content = replaceOnce(
            content,
            '  goalCapacityClassifications   ProntuarioGoalCapacityClassification[] @relation("GoalCapacityClassificationContract")\n\n  @@index([type])',
            '  goalCapacityClassifications   ProntuarioGoalCapacityClassification[] @relation("GoalCapacityClassificationContract")\n  adipometryAssessments        AdipometryAssessment[] @relation("AdipometryAssessmentContract")\n  adipometrySequences          AdipometrySequence[] @relation("AdipometrySequenceContract")\n  adipometryAuditLogs          AdipometryAuditLog[] @relation("AdipometryAuditContract")\n\n  @@index([type])',
            'CompanyContract relations'
          );
          content = replaceOnce(
            content,
            '  goalCapacityClassificationsUpdated ProntuarioGoalCapacityClassification[] @relation("GoalCapacityClassificationUpdatedBy")\n\n  @@index([collaboratorFunctionId])',
            '  goalCapacityClassificationsUpdated ProntuarioGoalCapacityClassification[] @relation("GoalCapacityClassificationUpdatedBy")\n  adipometryAssessments             AdipometryAssessment[] @relation("AdipometryAssessmentProfessor")\n  adipometryCorrections             AdipometryAssessment[] @relation("AdipometryCorrectedByProfessor")\n  adipometryAuditLogs               AdipometryAuditLog[] @relation("AdipometryAuditActor")\n\n  @@index([collaboratorFunctionId])',
            'Professor relations'
          );
          content = replaceOnce(
            content,
            '  goalCapacityClassifications   ProntuarioGoalCapacityClassification[] @relation("GoalCapacityClassificationAluno")\n\n  @@unique([contractId, userId])',
            '  goalCapacityClassifications   ProntuarioGoalCapacityClassification[] @relation("GoalCapacityClassificationAluno")\n  adipometryAssessments        AdipometryAssessment[] @relation("AdipometryAssessmentAluno")\n  adipometrySequences          AdipometrySequence[] @relation("AdipometrySequenceAluno")\n\n  @@unique([contractId, userId])',
            'Aluno relations'
          );
          content = replaceOnce(
            content,
            '  observations   AnthropometryObservation[]\n\n  @@unique([contractId, alunoId, code])',
            '  observations   AnthropometryObservation[]\n  adipometryReferences AdipometryAssessment[] @relation("AdipometryAnthropometryReference")\n\n  @@unique([contractId, alunoId, code])',
            'AnthropometryAssessment relation'
          );
          content = replaceOnce(content, 'model TrainingPlan {', `${schemaModels}model TrainingPlan {`, 'model insertion');
          content = `${content.trimEnd()}\n${schemaEnums}`;
          fs.writeFileSync(path, content);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate targeted schema
        run: |
          pnpm --filter @corrida/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @corrida/api exec prisma generate
          pnpm type-check

      - name: Commit minimized schema diff
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/validate-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/schema.prisma
          git commit -m 'refactor(adipometry): minimize Prisma schema diff'
          git push origin HEAD:${{ github.head_ref }}
