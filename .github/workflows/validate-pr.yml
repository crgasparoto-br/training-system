name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - 'feat/**'

jobs:
  validate:
    name: Export issue 274 source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source snapshot
        run: tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf /tmp/issue-274-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-274-source-${{ github.run_id }}
          path: /tmp/issue-274-source.tgz
          if-no-files-found: error
          retention-days: 1
