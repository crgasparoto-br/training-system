name: Issue 246 Physical Table Remediation

on:
  pull_request:
    branches:
      - develop

jobs:
  remediate:
    if: github.head_ref == 'feat/246-adipometry-domain-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Align migration and verifier with physical table names
        shell: bash
        run: |
          migration='apps/api/prisma/migrations/20260730070000_issue_246_adipometry_foundation/migration.sql'
          verifier='scripts/verify-adipometry-foundation.sh'

          grep -q '"Athlete"' "$migration"
          grep -q '"Educator"' "$migration"
          grep -q '"Athlete"' "$verifier"
          grep -q '"Educator"' "$verifier"

          sed -i 's/"Athlete"/"Aluno"/g; s/"Educator"/"Professor"/g' "$migration" "$verifier"
          sed -i '/^DB_URL=/a DB_URL="${DB_URL%%\\?*}"' "$verifier"

          ! grep -q '"Athlete"\|"Educator"' "$migration" "$verifier"
          grep -Fq 'DB_URL="${DB_URL%%\?*}"' "$verifier"
          bash -n "$verifier"

      - name: Commit physical table remediation
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/validate-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/migrations/20260730070000_issue_246_adipometry_foundation/migration.sql scripts/verify-adipometry-foundation.sh
          git commit -m 'fix(adipometry): target current physical tables'
          git push origin HEAD:${{ github.head_ref }}
