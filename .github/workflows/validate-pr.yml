name: Issue 246 Historical Integrity Remediation

on:
  pull_request:
    branches:
      - develop

jobs:
  remediate:
    if: github.head_ref == 'feat/246-adipometry-domain-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Recover and harden deterministic patch
        shell: bash
        run: |
          git show aa9b57c55dd3a5f99e5f7d3a8d3772a85885844b:.github/workflows/validate-pr.yml \
            | awk '
                /node <<'"'"'NODE'"'"'/ { capture = 1; next }
                capture && /^[[:space:]]+NODE$/ { exit }
                capture { sub(/^          /, ""); print }
              ' > /tmp/issue-246-historical-patch.cjs

          node <<'FIX'
          const fs = require('node:fs');
          const path = '/tmp/issue-246-historical-patch.cjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = `function replaceOnce(path, before, after, label) {
            const content = fs.readFileSync(path, 'utf8');
            const count = content.split(before).length - 1;
            if (count !== 1) {
              throw new Error(\`${'${label}'}: expected one anchor, found ${'${count}'}\`);
            }
            fs.writeFileSync(path, content.replace(before, after));
          }`;
          const after = `function replaceOnce(path, before, after, label) {
            const content = fs.readFileSync(path, 'utf8');
            const variants = [...new Set([before, before.replaceAll('"', '\\\\"')])];
            const matches = variants
              .map((candidate) => ({ candidate, count: content.split(candidate).length - 1 }))
              .filter(({ count }) => count > 0);
            const total = matches.reduce((sum, match) => sum + match.count, 0);
            if (total !== 1) {
              throw new Error(\`${'${label}'}: expected one anchor, found ${'${total}'}\`);
            }
            fs.writeFileSync(path, content.replace(matches[0].candidate, after));
          }`;
          if (!source.includes(before)) {
            throw new Error('replaceOnce helper not found in recovered patch');
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          FIX

          node /tmp/issue-246-historical-patch.cjs

          node <<'FIX_DELIMITERS'
          const fs = require('node:fs');

          const migrationPath = 'apps/api/prisma/migrations/20260730070000_issue_246_adipometry_foundation/migration.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const migrationStart = migration.indexOf('CREATE OR REPLACE FUNCTION protect_approved_adipometry_protocol_version()');
          const migrationEnd = migration.indexOf('CREATE OR REPLACE FUNCTION protect_completed_adipometry_assessment()', migrationStart);
          if (migrationStart < 0 || migrationEnd < 0) throw new Error('approved protocol function block not found');
          let migrationBlock = migration.slice(migrationStart, migrationEnd);
          migrationBlock = migrationBlock
            .replace(/AS \$+\n/, 'AS $$$$\n')
            .replace(/\n\$+;\n/, '\n$$$$;\n');
          if (!migrationBlock.includes('AS $$\n') || !migrationBlock.includes('\n$$;\n')) {
            throw new Error('migration dollar delimiters were not normalized');
          }
          migration = migration.slice(0, migrationStart) + migrationBlock + migration.slice(migrationEnd);
          fs.writeFileSync(migrationPath, migration);

          const verifierPath = 'scripts/verify-adipometry-foundation.sh';
          let verifier = fs.readFileSync(verifierPath, 'utf8');
          const verifierStart = verifier.indexOf('CREATE OR REPLACE FUNCTION issue246_snapshot(');
          const verifierEnd = verifier.indexOf('\nSQL\npsql_run -f /work/setup.sql', verifierStart);
          if (verifierStart < 0 || verifierEnd < 0) throw new Error('snapshot helper block not found');
          let verifierBlock = verifier.slice(verifierStart, verifierEnd);
          verifierBlock = verifierBlock
            .replace(/AS \$+\n/, 'AS $$$$\n')
            .replace(/\n\$+;\n?$/, '\n$$$$;');
          if (!verifierBlock.includes('AS $$\n') || !verifierBlock.endsWith('$$;')) {
            throw new Error('verifier dollar delimiters were not normalized');
          }
          verifier = verifier.slice(0, verifierStart) + verifierBlock + verifier.slice(verifierEnd);
          fs.writeFileSync(verifierPath, verifier);
          FIX_DELIMITERS

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm --filter @corrida/api exec prisma generate
          pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Run historical integrity controls
        run: |
          bash -n scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-foundation.sh
          pnpm type-check
          pnpm docs:check

      - name: Commit historical integrity remediation
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/validate-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/migrations/20260730070000_issue_246_adipometry_foundation/migration.sql scripts/verify-adipometry-foundation.sh packages/types/adipometry.ts
          git commit -m 'fix(adipometry): enforce reproducible historical snapshots'
          git push origin HEAD:${{ github.head_ref }}
