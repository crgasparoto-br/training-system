name: Apply Issue 268 Type Fix

on:
  pull_request:
    types:
      - reopened
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    name: Apply discard relation type fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/268-student-lifecycle-domain

      - name: Patch lifecycle service
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/alunos/student-lifecycle.service.ts')
          source = path.read_text()
          old = """    return transitionStudentLifecycleStatusInTransaction(
                tx,
                alunoId,
                contractId,
                aluno.status as StudentLifecycleStatus,
                'DISCARDED',
                {
                  actor: { professorId: actorProfessorId },
                  alunoUpdate: {
                    discardedAt: new Date(),
                    discardReason: normalizedReason,
                    discardedByProfessorId: actorProfessorId,
                  },
                  metadata: { reason: normalizedReason },
                  additionalEvents: ['DISCARDED'],
                }
              );
          """
          new = """    await transitionStudentLifecycleStatusInTransaction(
                tx,
                alunoId,
                contractId,
                aluno.status as StudentLifecycleStatus,
                'DISCARDED',
                {
                  actor: { professorId: actorProfessorId },
                  alunoUpdate: {
                    discardedAt: new Date(),
                    discardReason: normalizedReason,
                  },
                  metadata: { reason: normalizedReason },
                  additionalEvents: ['DISCARDED'],
                }
              );

              return tx.aluno.update({
                where: { id: alunoId },
                data: { discardedByProfessor: { connect: { id: actorProfessorId } } },
              });
          """
          if old not in source:
              raise SystemExit('expected lifecycle snippet not found')
          path.write_text(source.replace(old, new))
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-issue-268"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/modules/alunos/student-lifecycle.service.ts
          git commit -m "fix(alunos): persist discard actor through relation update"
          git push origin HEAD:feature/268-student-lifecycle-domain
