name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/242-service-catalog-transaction-timeout
          fetch-depth: 0

      - name: Normalize issue 242 audit correction
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/services/service.bootstrap.ts')
          source = path.read_text()
          wrong = "  const optionIds = new Map(\n  existing.options.map((row) => [row.code, row.id])\n);"
          correct = "  const optionIds = new Map(\n    existing.options.map((row) => [row.code, row.id])\n  );"
          if wrong in source:
              path.write_text(source.replace(wrong, correct, 1))
          elif correct not in source:
              raise SystemExit('Expected option map declaration was not found')
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/services/service.bootstrap.ts
          git commit -m "style(api): normalize catalog conflict map (#242)"
          git push origin HEAD:fix/242-service-catalog-transaction-timeout

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (api)
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply test database migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Type check
        run: |
          set -o pipefail
          pnpm type-check 2>&1 | tee type-check-output.log

      - name: Upload type-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-output-${{ github.run_id }}
          path: type-check-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: pnpm docs:check
