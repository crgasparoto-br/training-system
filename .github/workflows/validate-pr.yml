name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/210-services-commercial-catalog

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final catalog compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(content: str, old: str, new: str, label: str) -> str:
              if new in content:
                  print(f'{label}: already applied')
                  return content
              if old not in content:
                  raise RuntimeError(f'{label}: source anchor not found')
              print(f'{label}: applied')
              return content.replace(old, new, 1)

          service_path = Path('apps/api/src/modules/services/service.service.ts')
          service = service_path.read_text(encoding='utf-8')
          service = replace_required(
              service,
              '  assertValidity,\n  normalizeCatalogCode,',
              '  assertValidity,\n  isPlanComponentCommerciallyActive,\n  normalizeCatalogCode,',
              'domain helper import',
          )

          option_start = service.index('function mapCommercialOption')
          option_end = service.index('function mapPresentationItem', option_start)
          option_segment = service[option_start:option_end]
          option_segment = replace_required(
              option_segment,
              '    origin: asOrigin(row.origin),\n    createdAt: row.createdAt.toISOString(),',
              '    origin: asOrigin(row.origin),\n    usedByPlansCount: 0,\n    createdAt: row.createdAt.toISOString(),',
              'option impact default',
          )
          service = service[:option_start] + option_segment + service[option_end:]

          component_start = service.index('function mapComponent')
          component_end = service.index('async function listServiceRows', component_start)
          component_segment = service[component_start:component_end]
          component_segment = replace_required(
              component_segment,
              '    isActive: row.isActive,\n    displayOrder: row.displayOrder,',
              '''    isActive: row.isActive,
                  isCommerciallyActive: isPlanComponentCommerciallyActive({
                    isActive: row.isActive,
                    targetServiceId: row.targetServiceId,
                    targetOptionId: row.targetOptionId,
                    targetServiceActive: row.targetServiceActive,
                    targetOptionActive: row.targetOptionActive,
                  }),
                  displayOrder: row.displayOrder,''',
              'effective component status',
          )
          service = service[:component_start] + component_segment + service[component_end:]
          service = replace_required(
              service,
              '  const activeComponentsCount = components.filter((component) => component.isActive).length;',
              '  const activeComponentsCount = components.filter((component) => component.isCommerciallyActive).length;',
              'effective component count',
          )

          detail_start_marker = '    const [optionRows, presentationRows, componentRows, usedByRows] = await Promise.all(['
          detail_done_marker = '    const components = componentRows.map(mapComponent);'
          if 'optionImpactRows' not in service:
              detail_start = service.index(detail_start_marker)
              detail_end = service.index(detail_done_marker, detail_start)
              replacement = '''    const [optionRows, presentationRows, componentRows, usedByRows, optionImpactRows] = await Promise.all([
                    listOptionRows(contractId, serviceId),
                    listPresentationRows(contractId, serviceId),
                    listComponentRows(contractId, serviceId),
                    prisma.$queryRaw<Array<{ count: bigint }>>(Prisma.sql`
                      SELECT COUNT(*)::bigint AS "count"
                      FROM "ServicePlanComponent" component
                      LEFT JOIN "ServiceCommercialOption" target_option ON target_option."id" = component."targetOptionId"
                      WHERE component."contractId" = ${contractId}
                        AND component."isActive" = true
                        AND (component."targetServiceId" = ${serviceId} OR target_option."serviceId" = ${serviceId})
                    `),
                    prisma.$queryRaw<Array<{ optionId: string; count: bigint }>>(Prisma.sql`
                      SELECT component."targetOptionId" AS "optionId", COUNT(*)::bigint AS "count"
                      FROM "ServicePlanComponent" component
                      INNER JOIN "ServiceCommercialOption" target_option ON target_option."id" = component."targetOptionId"
                      WHERE component."contractId" = ${contractId}
                        AND component."isActive" = true
                        AND target_option."serviceId" = ${serviceId}
                      GROUP BY component."targetOptionId"
                    `),
                  ]);
                  const optionImpactById = new Map(
                    optionImpactRows.map((item) => [item.optionId, Number(item.count)])
                  );
                  const options = optionRows.map((item) => ({
                    ...mapCommercialOption(item),
                    usedByPlansCount: optionImpactById.get(item.id) ?? 0,
                  }));
                  '''
              service = service[:detail_start] + replacement + service[detail_end:]
              print('catalog impact queries: applied')
          else:
              print('catalog impact queries: already applied')
          service_path.write_text(service, encoding='utf-8')

          student_path = Path('apps/api/src/modules/alunos/aluno.service.ts')
          student = student_path.read_text(encoding='utf-8')
          student = replace_required(
              student,
              "import { getServiceForContract } from '../services/service.service.js';\n",
              "import { getServiceForContract } from '../services/service.service.js';\nimport { assertStudentInterestServiceSelectable } from './aluno.service-selection.js';\n",
              'student selector import',
          )
          assertion_start = student.find('const assertBaseServiceIsSelectable =')
          if assertion_start >= 0:
              assertion_end = student.index('\n\n', student.index('};', assertion_start)) + 2
              student = student[:assertion_start] + student[assertion_end:]
              print('legacy selector removal: applied')
          else:
              print('legacy selector removal: already applied')
          student = student.replace(
              'assertBaseServiceIsSelectable(service);',
              'assertStudentInterestServiceSelectable(service);',
          )
          update_anchor = '          assertStudentInterestServiceSelectable(service);\n\n          alunoData.serviceId = service.id as never;'
          update_replacement = '          assertStudentInterestServiceSelectable(service, currentAluno.serviceId);\n\n          alunoData.serviceId = service.id as never;'
          student = replace_required(student, update_anchor, update_replacement, 'preserve current unavailable service')
          student_path.write_text(student, encoding='utf-8')

          form_path = Path('apps/web/src/pages/AlunoForm.tsx')
          form = form_path.read_text(encoding='utf-8')
          form = replace_required(
              form,
              '      const data = await serviceCatalogService.list();\n      setServiceOptions(data.filter((item) => item.isActive));',
              '      const data = await serviceCatalogService.list(isEditMode);\n      setServiceOptions(data);',
              'load current inactive service',
          )
          form = replace_required(
              form,
              '  const interestServiceOptions = serviceOptions.filter((item) => !item.parentServiceId);\n  const financialServiceOptions = serviceOptions.filter((item) => item.parentServiceId);',
              '''  const interestServiceOptions = serviceOptions
                  .filter((item) => !item.parentServiceId && (item.isActive || item.id === selectedServiceId))
                  .sort(
                    (left, right) =>
                      (left.displayOrder ?? 0) - (right.displayOrder ?? 0) ||
                      left.name.localeCompare(right.name, 'pt-BR')
                  );
                const financialServiceOptions = serviceOptions.filter(
                  (item) => item.parentServiceId && item.isActive
                );''',
              'student option filters',
          )
          form = replace_required(
              form,
              '''                                  <option key={service.id} value={service.id}>
                                        {service.name}
                                      </option>''',
              '''                                  <option key={service.id} value={service.id} disabled={!service.isActive}>
                                        {service.name}{service.isActive ? '' : ' (indisponível — vínculo atual)'}
                                      </option>''',
              'unavailable student option label',
          )
          form_path.write_text(form, encoding='utf-8')

          catalog_path = Path('apps/web/src/pages/Settings/ServicesCatalog.tsx')
          catalog = catalog_path.read_text(encoding='utf-8')
          catalog = replace_required(
              catalog,
              "  validUntil: '',\n  isActive: true,\n};\n\nconst emptyPresentationForm",
              "  validUntil: '',\n  isActive: true,\n  usedByPlansCount: 0,\n};\n\nconst emptyPresentationForm",
              'option impact form state',
          )
          catalog = replace_required(
              catalog,
              "  const normalized = value.replace(/\\./g, '').replace(',', '.').trim();\n  if (!normalized) return undefined;",
              "  const trimmed = value.trim();\n  if (!trimmed) return undefined;\n  const normalized = trimmed.includes(',')\n    ? trimmed.replace(/\\./g, '').replace(',', '.')\n    : trimmed;",
              'decimal parser',
          )
          category_block = '''      if (detail && detail.category !== serviceForm.category) {
                    const confirmed = window.confirm(
                      'A categoria será alterada. Opções e componentes existentes não serão excluídos. Deseja continuar?'
                    );
                    if (!confirmed) return;
                  }
          '''
          impact_block = category_block + '''
                  if (detail?.isActive && !serviceForm.isActive && detail.usedByPlansCount > 0) {
                    const confirmed = window.confirm(
                      `Este serviço participa de ${detail.usedByPlansCount} plano(s) ativo(s). Ao inativá-lo, esses componentes deixarão de aparecer como ativos na apresentação comercial. Deseja continuar?`
                    );
                    if (!confirmed) return;
                  }
          '''
          catalog = replace_required(catalog, category_block, impact_block, 'service impact confirmation')
          catalog = replace_required(
              catalog,
              '      isActive: option.isActive,\n    });',
              '      isActive: option.isActive,\n      usedByPlansCount: option.usedByPlansCount ?? 0,\n    });',
              'option impact edit state',
          )
          option_try = '''    try {
                    const amount = parseOptionalNumber(optionForm.priceAmount);'''
          option_confirm = '''    try {
                    if (optionForm.id && !optionForm.isActive && optionForm.usedByPlansCount > 0) {
                      const original = detail?.options.find((item) => item.id === optionForm.id);
                      if (original?.isActive) {
                        const confirmed = window.confirm(
                          `Esta opção participa de ${optionForm.usedByPlansCount} plano(s) ativo(s). Ao inativá-la, esses componentes deixarão de aparecer como ativos na apresentação comercial. Deseja continuar?`
                        );
                        if (!confirmed) return;
                      }
                    }
                    const amount = parseOptionalNumber(optionForm.priceAmount);'''
          catalog = replace_required(catalog, option_try, option_confirm, 'option impact confirmation')
          catalog = catalog.replace('{detail.components.length === 0 &&', '{detail.activeComponentsCount === 0 &&')
          catalog = replace_required(
              catalog,
              '<StatusBadge active={component.isActive} />',
              '<StatusBadge active={component.isCommerciallyActive ?? component.isActive} />{component.isActive && component.isCommerciallyActive === false && <p className="mt-1 text-xs text-amber-700">Destino inativo: mantido apenas no histórico.</p>}',
              'effective component presentation',
          )
          catalog = catalog.replace(
              'items.filter((item) => item.id !== detail.id)',
              'items.filter((item) => item.id !== detail.id && item.isActive)',
          )
          for marker in (
              'usedByPlansCount: optionImpactById.get(item.id) ?? 0',
              'isCommerciallyActive: isPlanComponentCommerciallyActive',
              'assertStudentInterestServiceSelectable(service, currentAluno.serviceId)',
              'indisponível — vínculo atual',
              'optionForm.usedByPlansCount > 0',
          ):
              if marker not in service + student + form + catalog:
                  raise RuntimeError(f'Expected marker missing after patch: {marker}')
          catalog_path.write_text(catalog, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "Final compatibility fixes already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/modules/services/service.service.ts apps/api/src/modules/alunos/aluno.service.ts apps/web/src/pages/AlunoForm.tsx apps/web/src/pages/Settings/ServicesCatalog.tsx
            git commit -m "fix(services): preserve legacy links and plan impact"
            git push origin HEAD:feat/210-services-commercial-catalog
          fi

      - name: Generate Prisma Client (api)
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: pnpm docs:check
