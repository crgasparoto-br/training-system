name: Apply Issue 268 Corrections

on:
  pull_request:
    types:
      - reopened
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    name: Apply staged correction package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/268-student-lifecycle-domain

      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          cat .issue268-payload.part* | base64 -d > /tmp/issue268-changes.tar.gz
          echo "b9bdab9cd4cff598ee305a6abca942e045ddab0c34bf21f84911dc3fdc1d37d7  /tmp/issue268-changes.tar.gz" | sha256sum -c -

      - name: Extract code package
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.github/workflows/validate-pr.yml' -xzf /tmp/issue268-changes.tar.gz -C .
          rm -f .issue268-payload.part*
          git status --short

      - name: Commit code package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-issue-268"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(alunos): resolve issue 268 audit findings"

      - name: Push code package
        shell: bash
        run: git push origin HEAD:feature/268-student-lifecycle-domain
