name: Validate PR

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - 'feat/**'

jobs:
  diagnose:
    name: Diagnose catalog API patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/210-services-commercial-catalog

      - name: Run patch diagnostic
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > patch.log 2>&1
          from pathlib import Path

          path = Path('apps/api/src/modules/services/service.service.ts')
          content = path.read_text(encoding='utf-8')
          print('loaded', len(content))

          if 'isPlanComponentCommerciallyActive,' not in content:
              anchor = '  assertValidity,\n  normalizeCatalogCode,'
              print('import anchor', anchor in content)
              content = content.replace(
                  anchor,
                  '  assertValidity,\n  isPlanComponentCommerciallyActive,\n  normalizeCatalogCode,',
                  1,
              )

          start = content.index('function mapCommercialOption')
          end = content.index('function mapPresentationItem', start)
          segment = content[start:end]
          print('option segment', start, end)
          if 'usedByPlansCount: 0' not in segment:
              anchor = '    origin: asOrigin(row.origin),\n    createdAt: row.createdAt.toISOString(),'
              print('option anchor', anchor in segment)
              segment = segment.replace(
                  anchor,
                  '    origin: asOrigin(row.origin),\n    usedByPlansCount: 0,\n    createdAt: row.createdAt.toISOString(),',
                  1,
              )
          content = content[:start] + segment + content[end:]

          start = content.index('function mapComponent')
          end = content.index('async function listServiceRows', start)
          segment = content[start:end]
          print('component segment', start, end)
          if 'isCommerciallyActive:' not in segment:
              anchor = '    isActive: row.isActive,\n    displayOrder: row.displayOrder,'
              print('component anchor', anchor in segment)
              segment = segment.replace(
                  anchor,
                  '''    isActive: row.isActive,
                  isCommerciallyActive: isPlanComponentCommerciallyActive({
                    isActive: row.isActive,
                    targetServiceId: row.targetServiceId,
                    targetOptionId: row.targetOptionId,
                    targetServiceActive: row.targetServiceActive,
                    targetOptionActive: row.targetOptionActive,
                  }),
                  displayOrder: row.displayOrder,''',
                  1,
              )
          content = content[:start] + segment + content[end:]

          anchor = '  const activeComponentsCount = components.filter((component) => component.isActive).length;'
          print('count anchor', anchor in content)
          content = content.replace(
              anchor,
              '  const activeComponentsCount = components.filter((component) => component.isCommerciallyActive).length;',
              1,
          )

          if 'optionImpactRows' not in content:
              start_marker = '    const [optionRows, presentationRows, componentRows, usedByRows] = await Promise.all(['
              end_marker = '    const components = componentRows.map(mapComponent);'
              print('detail start marker', start_marker in content)
              print('detail end marker', end_marker in content)
              start = content.index(start_marker)
              end = content.index(end_marker, start)
              print('detail segment', start, end)

          required = (
              'isPlanComponentCommerciallyActive,',
              'usedByPlansCount: 0',
              'isCommerciallyActive: isPlanComponentCommerciallyActive',
          )
          print('missing', [marker for marker in required if marker not in content])
          path.write_text(content, encoding='utf-8')
          print('done')
          PY
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat patch.log
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: catalog-api-patch-diagnostics
          path: |
            patch.log
            apps/api/src/modules/services/service.service.ts

      - name: Report diagnostic status
        run: |
          test "${{ steps.patch.outputs.status }}" = "0"
