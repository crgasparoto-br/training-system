name: Issue 246 Historical Integrity Remediation

on:
  pull_request:
    branches:
      - develop

jobs:
  remediate:
    if: github.head_ref == 'feat/246-adipometry-domain-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic historical remediation
        run: node scripts/issue-246-historical-remediation.cjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm --filter @corrida/api exec prisma generate
          pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Run historical integrity controls
        run: |
          bash -n scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-foundation.sh
          pnpm type-check
          pnpm docs:check

      - name: Commit historical integrity remediation
        shell: bash
        run: |
          rm scripts/issue-246-historical-remediation.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/prisma/migrations/20260730070000_issue_246_adipometry_foundation/migration.sql scripts/verify-adipometry-foundation.sh packages/types/adipometry.ts scripts/issue-246-historical-remediation.cjs
          git commit -m 'fix(adipometry): enforce reproducible historical snapshots'
          git push origin HEAD:${{ github.head_ref }}
