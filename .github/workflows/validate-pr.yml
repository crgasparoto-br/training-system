name: Issue 263 Finalize

on:
  push:
    branches:
      - feat/263-generalize-contracts-collaborators

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/263-generalize-contracts-collaborators'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/263-generalize-contracts-collaborators
          fetch-depth: 0

      - name: Apply audited corrections
        run: |
          python .github/issue263-fix-1.py
          python .github/issue263-fix-1b.py
          python .github/issue263-fix-2a.py
          python .github/issue263-fix-2b.py
          python .github/issue263-fix-3.py
          python .github/issue263-fix-4a.py
          python .github/issue263-fix-4b.py

      - name: Restore standard CI and remove temporary files
        run: |
          git fetch origin develop
          git show origin/develop:.github/workflows/validate-pr.yml > .github/workflows/validate-pr.yml
          rm -f \
            .github/workflows/issue-263-one-shot-sync.yml \
            .github/issue-263-trigger \
            .github/issue-263-sync-complete \
            .github/issue263-fix-1.py \
            .github/issue263-fix-1b.py \
            .github/issue263-fix-2.py \
            .github/issue263-fix-2a.py \
            .github/issue263-fix-2b.py \
            .github/issue263-fix-3.py \
            .github/issue263-fix-4a.py \
            .github/issue263-fix-4b.py

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete issue 263 contract generalization"
          git push origin HEAD:feat/263-generalize-contracts-collaborators
