name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/210-services-commercial-catalog

      - name: Apply one-time compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/Settings/ServicesCatalog.tsx')
          content = path.read_text(encoding='utf-8')
          content = content.replace('  ServicePresentationItem,\n', '')
          content = content.replace('  CircleAlert,\n', '  AlertCircle as CircleAlert,\n')
          path.write_text(content, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "Compatibility fix already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/pages/Settings/ServicesCatalog.tsx
            git commit -m "fix(web): use compatible alert icon"
            git push origin HEAD:feat/210-services-commercial-catalog
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (api)
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Type check
        run: |
          set -o pipefail
          pnpm type-check 2>&1 | tee typecheck.log

      - name: Upload type check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: pnpm docs:check
