name: Validate PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    env:
      # A suíte de integração instancia clientes Prisma em vários módulos. Cada
      # pool usa uma única conexão no CI para preservar a cobertura completa sem
      # disputar o max_connections do PostgreSQL efêmero.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Issue 136 readable remediation
        if: github.event_name == 'push' && github.ref_name == 'fix/136-capacity-prescription-persistence'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/remediation/issue-136/01-core.py ]; then
            echo "No Issue 136 remediation payload found."
            exit 0
          fi
          python .github/remediation/issue-136/01-core.py
          python .github/remediation/issue-136/02-source.py
          python .github/remediation/issue-136/03-tests-docs.py
          rm -rf .github/remediation/issue-136
          rm -f .github/workflows/issue-136-adipometry-remediation.yml
          git fetch --no-tags --depth=1 origin 506883feed3e865268f4a3c8045b3a043344b7f4
          git show 506883feed3e865268f4a3c8045b3a043344b7f4:.github/workflows/validate-pr.yml > .github/workflows/validate-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: persist adipometry methodology snapshot"
          git push origin HEAD:fix/136-capacity-prescription-persistence

      - name: Create workflow evidence attestation
        shell: bash
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          AUDIT_MERGE_PREVIEW_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          cat > orquestrador-artifact.json <<EOF
          {
            "schemaVersion": 1,
            "kind": "validate-pr-evidence",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "eventName": "${GITHUB_EVENT_NAME}",
            "headSha": "${AUDIT_HEAD_SHA}",
            "baseSha": "${AUDIT_BASE_SHA}",
            "mergePreviewSha": "${AUDIT_MERGE_PREVIEW_SHA}",
            "ref": "${GITHUB_REF}",
            "refName": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (api)
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply test database migrations
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec prisma migrate deploy 2>&1 | tee migration-output.log

      - name: Upload migration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-output-${{ github.run_id }}
          path: |
            migration-output.log
            orquestrador-artifact.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify lifecycle legacy backfill
        run: |
          set -o pipefail
          bash scripts/verify-student-lifecycle-legacy-backfill.sh 2>&1 | tee lifecycle-backfill-output.log

      - name: Upload lifecycle legacy backfill output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-backfill-output-${{ github.run_id }}
          path: |
            lifecycle-backfill-output.log
            orquestrador-artifact.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify lifecycle migration rerun
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e PGPASSWORD=postgres \
            postgres:16-alpine \
            psql -h localhost -U postgres -d training_system_test -v ON_ERROR_STOP=1 \
            -f /workspace/apps/api/prisma/migrations/20260721120000_student_lifecycle_domain/migration.sql

      - name: Type check
        run: |
          set -o pipefail
          pnpm type-check 2>&1 | tee type-check-output.log

      - name: Upload type-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-output-${{ github.run_id }}
          path: |
            type-check-output.log
            orquestrador-artifact.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: |
            test-output.log
            orquestrador-artifact.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: |
          set -o pipefail
          pnpm docs:check 2>&1 | tee docs-check-output.log

      - name: Upload documentation check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-check-output-${{ github.run_id }}
          path: |
            docs-check-output.log
            orquestrador-artifact.json
          if-no-files-found: ignore
          retention-days: 7
