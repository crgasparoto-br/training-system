name: Validate PR

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Delivery V2 risk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      risk_profile: ${{ steps.risk.outputs.risk_profile }}
      docs_required: ${{ steps.risk.outputs.docs_required }}
      code_changed: ${{ steps.risk.outputs.code_changed }}
      web_changed: ${{ steps.risk.outputs.web_changed }}
      api_changed: ${{ steps.risk.outputs.api_changed }}
      database_required: ${{ steps.risk.outputs.database_required }}
      reasons_json: ${{ steps.risk.outputs.reasons_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Collect changed paths
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            require('node:fs').writeFileSync(
              '/tmp/delivery-v2-changed-paths.json',
              JSON.stringify(files.map((file) => file.filename))
            );
      - name: Classify PR deterministically
        id: risk
        env:
          DELIVERY_V2_REQUESTED_RISK: ${{ vars.DELIVERY_V2_RISK_PROFILE || 'auto' }}
        run: node scripts/delivery-v2-ci-classifier.mjs --paths-file /tmp/delivery-v2-changed-paths.json
      - name: Publish classification summary
        run: |
          echo "## Delivery V2 risk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Effective: \`${{ steps.risk.outputs.risk_profile }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reasons: \`${{ steps.risk.outputs.reasons_json }}\`" >> "$GITHUB_STEP_SUMMARY"

  merge_preview:
    name: Merge preview compatibility
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: needs.classify.outputs.code_changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - if: needs.classify.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - if: needs.classify.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.classify.outputs.code_changed == 'true' && needs.classify.outputs.risk_profile != 'fast'
        run: pnpm --filter @corrida/api exec prisma generate
      - name: FAST web type compatibility
        if: needs.classify.outputs.code_changed == 'true' && needs.classify.outputs.risk_profile == 'fast' && needs.classify.outputs.web_changed == 'true'
        run: pnpm --filter @corrida/web type-check
      - name: STANDARD or CRITICAL type compatibility
        if: needs.classify.outputs.code_changed == 'true' && needs.classify.outputs.risk_profile != 'fast'
        run: pnpm type-check

  fast_validation:
    name: FAST validation
    needs: [classify, merge_preview]
    if: ${{ always() && github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.merge_preview.result == 'success' && needs.classify.outputs.risk_profile == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VERIFICATION_HEAD_SHA }}
      - name: Create exact-head evidence
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$AUDIT_HEAD_SHA"
          printf '{"schemaVersion":1,"kind":"validate-pr-evidence","repository":"%s","workflow":"%s","runId":"%s","eventName":"%s","riskProfile":"fast","headSha":"%s","checkoutSha":"%s","baseSha":"%s","mergePreviewSha":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$AUDIT_HEAD_SHA" "$CHECKOUT_SHA" "$AUDIT_BASE_SHA" "$GITHUB_SHA" > orquestrador-artifact.json
      - run: node --test scripts/delivery-v2-ci-classifier.test.mjs
      - if: needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.docs_required == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - if: needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.docs_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - if: needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.docs_required == 'true'
        run: pnpm install --frozen-lockfile
      - name: Web type check
        if: needs.classify.outputs.web_changed == 'true'
        run: pnpm --filter @corrida/web type-check
      - name: Web lint
        if: needs.classify.outputs.web_changed == 'true'
        run: pnpm --filter @corrida/web lint
      - name: FAST related tests
        if: needs.classify.outputs.web_changed == 'true'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          mapfile -t changed_files < <(git diff --name-only "origin/$BASE_REF...HEAD")
          test_files=()
          source_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              apps/web/src/*.test.ts|apps/web/src/*.test.tsx|apps/web/src/*.test.js|apps/web/src/*.test.jsx|apps/web/src/*.spec.ts|apps/web/src/*.spec.tsx|apps/web/src/*.spec.js|apps/web/src/*.spec.jsx)
                test_files+=("${file#apps/web/}") ;;
              apps/web/src/*.ts|apps/web/src/*.tsx|apps/web/src/*.js|apps/web/src/*.jsx)
                source_files+=("${file#apps/web/}") ;;
            esac
          done
          if [ "${#test_files[@]}" -gt 0 ]; then
            pnpm --filter @corrida/web exec vitest run "${test_files[@]}" --passWithNoTests --no-file-parallelism
          fi
          if [ "${#source_files[@]}" -gt 0 ]; then
            pnpm --filter @corrida/web exec vitest related "${source_files[@]}" --run --passWithNoTests --no-file-parallelism
          fi
      - name: Web build
        if: needs.classify.outputs.web_changed == 'true'
        run: pnpm --filter @corrida/web build
      - name: Architecture checks
        if: needs.classify.outputs.code_changed == 'true'
        run: pnpm arch:check
      - name: Documentation checks
        if: needs.classify.outputs.docs_required == 'true'
        run: pnpm docs:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-pr-fast-${{ github.event.pull_request.head.sha }}
          path: orquestrador-artifact.json
          if-no-files-found: error
          retention-days: 30

  standard_validation:
    name: STANDARD validation
    needs: [classify, merge_preview]
    if: ${{ always() && github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.merge_preview.result == 'success' && needs.classify.outputs.risk_profile == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_DATABASE_INTEGRATION_TESTS: 'false'
      VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VERIFICATION_HEAD_SHA }}
      - name: Create exact-head evidence
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$AUDIT_HEAD_SHA"
          printf '{"schemaVersion":1,"kind":"validate-pr-evidence","repository":"%s","workflow":"%s","runId":"%s","eventName":"%s","riskProfile":"standard","headSha":"%s","checkoutSha":"%s","baseSha":"%s","mergePreviewSha":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$AUDIT_HEAD_SHA" "$CHECKOUT_SHA" "$AUDIT_BASE_SHA" "$GITHUB_SHA" > orquestrador-artifact.json
      - run: node --test scripts/delivery-v2-ci-classifier.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corrida/api exec prisma generate
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Non-database tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - run: pnpm arch:check
      - run: pnpm access:check
      - run: pnpm docs:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-pr-standard-${{ github.event.pull_request.head.sha }}
          path: orquestrador-artifact.json
          if-no-files-found: error
          retention-days: 30

  critical_validation:
    name: CRITICAL validation
    needs: [classify, merge_preview]
    if: ${{ always() && ((github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.merge_preview.result == 'success' && needs.classify.outputs.risk_profile == 'critical') || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VERIFICATION_HEAD_SHA }}
      - name: Create exact-head evidence
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$AUDIT_HEAD_SHA"
          printf '{"schemaVersion":1,"kind":"validate-pr-evidence","repository":"%s","workflow":"%s","runId":"%s","eventName":"%s","riskProfile":"critical","headSha":"%s","checkoutSha":"%s","baseSha":"%s","mergePreviewSha":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$AUDIT_HEAD_SHA" "$CHECKOUT_SHA" "$AUDIT_BASE_SHA" "$GITHUB_SHA" > orquestrador-artifact.json
      - run: node --test scripts/delivery-v2-ci-classifier.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Puppeteer browser
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome
      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate
      - name: Verify critical database and migration regressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-adipometry-migration-existing-data.sh
          bash scripts/verify-adipometry-migration-full-chain.sh
          pnpm --filter @corrida/api exec prisma migrate deploy
          bash scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-audit-remediation.sh
          bash scripts/verify-adipometry-persistence-boundaries.sh
          bash scripts/verify-student-lifecycle-legacy-backfill.sh
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e PGPASSWORD=postgres \
            postgres:16-alpine \
            psql -h localhost -U postgres -d training_system_test -v ON_ERROR_STOP=1 \
            -f /workspace/apps/api/prisma/migrations/20260721120000_student_lifecycle_domain/migration.sql
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Full tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate settings parameters in real browser
        env:
          SETTINGS_PARAMETERS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm --filter @corrida/api exec node scripts/visual-audit-settings-parameters.mjs
      - name: Architecture checks
        run: pnpm arch:check
      - name: Access catalog checks
        run: pnpm access:check
      - name: Documentation checks
        run: pnpm docs:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-pr-critical-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            orquestrador-artifact.json
            artifacts/settings-parameters-visual/**
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate repository
    needs: [classify, merge_preview, fast_validation, standard_validation, critical_validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      RISK_PROFILE: ${{ github.event_name == 'pull_request' && needs.classify.outputs.risk_profile || 'critical' }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      MERGE_PREVIEW_RESULT: ${{ needs.merge_preview.result }}
      FAST_RESULT: ${{ needs.fast_validation.result }}
      STANDARD_RESULT: ${{ needs.standard_validation.result }}
      CRITICAL_RESULT: ${{ needs.critical_validation.result }}
    steps:
      - name: Enforce adaptive validation result
        shell: bash
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$CLASSIFY_RESULT" = "success"
            test "$MERGE_PREVIEW_RESULT" = "success"
            case "$RISK_PROFILE" in
              fast) test "$FAST_RESULT" = "success" ;;
              standard) test "$STANDARD_RESULT" = "success" ;;
              critical) test "$CRITICAL_RESULT" = "success" ;;
              *) echo "Unknown risk profile: $RISK_PROFILE"; exit 1 ;;
            esac
          else
            test "$CRITICAL_RESULT" = "success"
          fi
      - name: Publish gate summary
        if: always()
        run: |
          echo "## Validate repository" >> "$GITHUB_STEP_SUMMARY"
          echo "Delivery V2 risk profile: \`${RISK_PROFILE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Required check remains: \`Validate repository\`." >> "$GITHUB_STEP_SUMMARY"
