name: Apply Issue 275 trusted remediation

on:
  pull_request:
    branches:
      - tmp/issue-275-remediation-base

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Issue 275 branch
        uses: actions/checkout@v4
        with:
          ref: feat/275-pre-registration-qa-rollout
          fetch-depth: 0

      - name: Correct the concurrent claim fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('apps/api/scripts/verify-issue-275-integrated-e2e.ts')
          source = target.read_text(encoding='utf-8')

          replacements = {
              "body: { name: accountA.name, email: accountA.email, password: 'Senha-segura-275', role: 'STUDENT' },": """body: {
                name: claimLead.identity.name,
                email: accountA.email,
                password: 'Senha-segura-275',
                role: 'STUDENT',
              },""",
              "body: { name: accountB.name, email: accountB.email, password: 'Senha-segura-275', role: 'STUDENT' },": """body: {
                name: claimLead.identity.name,
                email: accountB.email,
                password: 'Senha-segura-275',
                role: 'STUDENT',
              },""",
          }
          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of: {before}')
              source = source.replace(before, after)

          before_assertion = "  assert(claims.filter((result) => result.status === 201).length === 1, 'Claims concorrentes não tiveram vencedor único');"
          after_assertion = """  const claimOutcomes = claims.map((result) => {
            const details = result.body.details;
            const code =
              details && typeof details === 'object' && 'code' in details
                ? String((details as { code?: unknown }).code ?? '')
                : undefined;
            return { status: result.status, code, success: result.body.success === true };
          });
          await writeFile(
            path.join(artifactDir, 'concurrency-claim-outcomes.json'),
            `${JSON.stringify(claimOutcomes, null, 2)}\\n`,
            'utf8'
          );
          const claimWinnerCount = claims.filter((result) => result.status === 201).length;
          assert(
            claimWinnerCount === 1,
            `Claims concorrentes não tiveram vencedor único: ${JSON.stringify(claimOutcomes)}`
          );
          const losingClaim = claims.find((result) => result.status !== 201);
          const losingDetails = losingClaim?.body.details;
          const losingCode =
            losingDetails && typeof losingDetails === 'object' && 'code' in losingDetails
              ? String((losingDetails as { code?: unknown }).code ?? '')
              : undefined;
          assert(
            losingClaim?.status === 409 &&
              ['ACCOUNT_ALREADY_LINKED', 'ACCOUNT_INCOMPATIBLE'].includes(losingCode ?? ''),
            `Claim perdedor não retornou conflito estável: ${JSON.stringify(claimOutcomes)}`
          );
          const linkedClaim = await prisma.aluno.findUnique({
            where: { id: claimLead.id },
            select: { userId: true },
          });
          assert(Boolean(linkedClaim?.userId), 'Claim vencedor não vinculou uma conta ao Aluno');
          const linkedEvents = await prisma.studentLifecycleEvent.count({
            where: { alunoId: claimLead.id, eventType: 'ACCOUNT_LINKED' },
          });
          assert(linkedEvents === 1, 'Claims concorrentes duplicaram o evento ACCOUNT_LINKED');
          const claimedUsers = await prisma.user.findMany({
            where: { email: { in: [accountA.email, accountB.email] } },
            select: { id: true },
          });
          assert(claimedUsers.length === 1, 'Claim perdedor deixou conta órfã persistida');
          assert(
            claimedUsers[0]?.id === linkedClaim?.userId,
            'Conta persistida não corresponde ao vínculo canônico do Aluno'
          );"""
          after_assertion = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in after_assertion.splitlines()
          )
          if source.count(before_assertion) != 1:
              raise SystemExit('Expected original concurrency assertion exactly once')
          source = source.replace(before_assertion, after_assertion)

          before_return = """    claimWinnerCount: 1,
    activeInviteCount,"""
          after_return = """    claimWinnerCount,
    claimLoserCode: losingCode,
    claimLinkedEventCount: linkedEvents,
    claimPersistedUserCount: claimedUsers.length,
    activeInviteCount,"""
          if source.count(before_return) != 1:
              raise SystemExit('Expected original concurrency result exactly once')
          source = source.replace(before_return, after_return)
          target.write_text(source, encoding='utf-8')
          PY

          cat > apps/api/tests/issue-275-integrated-e2e-fixture.contract.test.ts <<'EOF'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';

          describe('Issue 275 integrated concurrency fixture', () => {
            const source = readFileSync(
              path.resolve(process.cwd(), 'scripts/verify-issue-275-integrated-e2e.ts'),
              'utf8'
            );

            it('uses the canonical lead identity for both concurrent account attempts', () => {
              expect(source.match(/name: claimLead\.identity\.name/g)).toHaveLength(2);
              expect(source).not.toContain('name: accountA.name');
              expect(source).not.toContain('name: accountB.name');
            });

            it('records and verifies the transactional outcome of the losing claim', () => {
              expect(source).toContain('concurrency-claim-outcomes.json');
              expect(source).toContain("['ACCOUNT_ALREADY_LINKED', 'ACCOUNT_INCOMPATIBLE']");
              expect(source).toContain('linkedEvents === 1');
              expect(source).toContain('claimedUsers.length === 1');
              expect(source).toContain('claimedUsers[0]?.id === linkedClaim?.userId');
            });
          });
          EOF
          sed -i 's/^          //' apps/api/tests/issue-275-integrated-e2e-fixture.contract.test.ts

          git show 3319d3e96fba2870cc51a33bc3d5c3ebad0f28c6:.github/workflows/validate-pr.yml > .github/workflows/validate-pr.yml
          git show 766744405e32ea2d8a103b4246e483a56b528038:.github/workflows/issue-275-pre-registration-qa.yml > .github/workflows/issue-275-pre-registration-qa.yml
          rm -f .github/workflows/issue-275-remediation.yml
          rm -f apps/api/src/issue-275-source-materialization.test.ts

          git diff --check
          test "$(grep -c 'name: claimLead.identity.name' apps/api/scripts/verify-issue-275-integrated-e2e.ts)" -eq 2
          grep -q 'concurrency-claim-outcomes.json' apps/api/scripts/verify-issue-275-integrated-e2e.ts
          grep -q "ACCOUNT_INCOMPATIBLE" apps/api/scripts/verify-issue-275-integrated-e2e.ts
          grep -q 'claimedUsers.length === 1' apps/api/scripts/verify-issue-275-integrated-e2e.ts
          grep -q 'claimedUsers\[0\]?.id === linkedClaim?.userId' apps/api/scripts/verify-issue-275-integrated-e2e.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: correct issue 275 concurrent claim fixture"
          git push origin HEAD:feat/275-pre-registration-qa-rollout
