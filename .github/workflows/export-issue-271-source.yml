name: Apply Issue 271 Corrective Patch

on:
  push:
    branches:
      - feat/271-public-pre-registration

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Rebuild and apply corrective patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-271-patch/part-* > /tmp/issue-271.patch.gz.b64
          base64 --decode /tmp/issue-271.patch.gz.b64 | gzip --decompress > /tmp/issue-271.patch
          git apply --check /tmp/issue-271.patch
          git apply /tmp/issue-271.patch

      - name: Commit implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/issue-271-patch
          rm -f .github/workflows/export-issue-271-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve issue 271 audit findings"
          git push origin HEAD:feat/271-public-pre-registration
