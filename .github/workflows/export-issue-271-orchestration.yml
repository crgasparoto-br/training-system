name: Apply Issue 271 Orchestration Changes

on:
  push:
    branches:
      - feat/271-public-pre-registration
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Reconstruct and apply the reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-271-payload/chunk-* | tr -d '\r\n ' > /tmp/issue-271-changes.b64
          echo "Encoded bytes: $(wc -c < /tmp/issue-271-changes.b64)"
          base64 --decode /tmp/issue-271-changes.b64 > /tmp/issue-271-changes.tar.gz
          sha256sum /tmp/issue-271-changes.tar.gz
          echo "31b798b7ea6a8bacf82f5c412243ec7d49c62b102cf59d6107249e20f92e61cc  /tmp/issue-271-changes.tar.gz" | sha256sum --check
          tar -tzf /tmp/issue-271-changes.tar.gz > /tmp/issue-271-files.txt
          cat /tmp/issue-271-files.txt
          tar -xzf /tmp/issue-271-changes.tar.gz -C .

      - name: Remove orchestration transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/issue-271-payload
          rm -f .github/workflows/export-issue-271-orchestration.yml

      - name: Commit the functional correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate pre-registration identity and honest handoffs (#271)"
          git push origin HEAD:feat/271-public-pre-registration
