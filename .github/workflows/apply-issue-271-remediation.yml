name: Apply Issue 271 Remediation

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/apply-issue-271-remediation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Apply audited remediation
        shell: bash
        run: |
          cat > /tmp/issue-271.patch.gz.b64 <<'PATCH'
[... ELLIPSIZATION ...]
PATCH
          base64 --decode /tmp/issue-271.patch.gz.b64 | gzip --decompress > /tmp/issue-271.patch
          git apply /tmp/issue-271.patch
          rm -f .github/workflows/apply-issue-271-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require independent guardian approval for issue 271'
          git push origin HEAD:feat/271-public-pre-registration
