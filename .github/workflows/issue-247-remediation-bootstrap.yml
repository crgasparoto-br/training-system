name: Bootstrap issue 247 remediation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/247-adipometry-api' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/247-adipometry-api
          fetch-depth: 0

      - name: Execute remediation script literally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-247-remediation-runner.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Commit patch and remove temporary workflows"
          if start not in workflow or end not in workflow:
              raise SystemExit('runner script markers not found')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if code.count(old) != 1:
              raise SystemExit('substitution helper was not found exactly once')
          code = code.replace(old, new, 1)
          Path('/tmp/issue-247-remediation.py').write_text(code + '\n')
          PY
          python /tmp/issue-247-remediation.py
          rm -f .github/workflows/issue-247-remediation-bootstrap.yml

      - name: Commit remediation and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(adpt): remediate adversarial CI failures'
          git push origin HEAD:feat/247-adipometry-api
