name: Apply Issue 271 Request Timestamp Fix V2

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/apply-issue-271-requested-at-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_issue_271_requested_at?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_issue_271_requested_at
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_issue_271_requested_at"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply immutable request timestamp remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          def insert_after(path, anchor, insertion):
              p = Path(path)
              text = p.read_text()
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {anchor[:80]!r}')
              p.write_text(text.replace(anchor, anchor + insertion, 1))

          admin_service = 'apps/api/src/modules/pre-registration-admin/pre-registration-guardian-authorization-admin.service.ts'
          replace_once(
              admin_service,
              '    requestedAt: authorization.updatedAt.toISOString(),',
              '    requestedAt: (authorization.requestedAt || authorization.createdAt).toISOString(),',
          )

          schema = 'apps/api/prisma/schema.prisma'
          replace_once(
              schema,
              '  relationship      String?\n  status            String    @default("PENDING")\n  validatedAt       DateTime?\n',
              '  relationship      String?\n  status            String    @default("PENDING")\n  requestedAt       DateTime?\n  validatedAt       DateTime?\n',
          )

          public_service = 'apps/api/src/modules/pre-registration-public/pre-registration-public.service.ts'
          replace_once(
              public_service,
              '  relationship: string | null;\n  validatedAt: Date | null;',
              '  relationship: string | null;\n  requestedAt: Date | null;\n  validatedAt: Date | null;',
          )
          replace_count(
              public_service,
              'SELECT "status", "relationship", "validatedAt", "revokedAt", "updatedAt"',
              'SELECT "status", "relationship", "requestedAt", "validatedAt", "revokedAt", "updatedAt"',
              3,
          )
          replace_once(
              public_service,
              'SELECT "status", NULL::text AS "relationship", "validatedAt", "revokedAt", "updatedAt"',
              'SELECT "status", NULL::text AS "relationship", "requestedAt", "validatedAt", "revokedAt", "updatedAt"',
          )
          replace_count(public_service, 'authorizationUpdatedAt', 'authorizationRequestedAt', 4)
          replace_once(
              public_service,
              'requestedAt: authorization.updatedAt.toISOString(),\n            approvalRequired: false,',
              'requestedAt: (authorization.requestedAt || authorization.updatedAt).toISOString(),\n            approvalRequired: false,',
          )
          replace_once(
              public_service,
              '        const updatedRows = await tx.$queryRaw<Array<{ updatedAt: Date }>>`',
              '        const updatedRows = await tx.$queryRaw<Array<{ requestedAt: Date }>>`',
          )
          replace_once(
              public_service,
              '          SET "relationship" = ${relationship},\n              "updatedAt" = CURRENT_TIMESTAMP\n',
              '          SET "relationship" = ${relationship},\n              "requestedAt" = COALESCE("requestedAt", CURRENT_TIMESTAMP),\n              "updatedAt" = CURRENT_TIMESTAMP\n',
          )
          replace_once(public_service, '          RETURNING "updatedAt"\n', '          RETURNING "requestedAt"\n')
          replace_once(
              public_service,
              'requestedAt: updatedRows[0].updatedAt.toISOString(),',
              'requestedAt: updatedRows[0].requestedAt.toISOString(),',
          )

          admin_test = 'apps/api/tests/pre-registration-guardian-admin-approval.integration.test.ts'
          replace_once(
              admin_test,
              '  let alunoId: string;\n',
              "  let alunoId: string;\n  const requestedAt = new Date('2026-07-23T10:15:00.000Z');\n  let validatedAt: string;\n",
          )
          replace_once(
              admin_test,
              "            status: 'PENDING',\n",
              "            status: 'PENDING',\n            requestedAt,\n",
          )
          replace_once(
              admin_test,
              "      guardian: { userId: guardianUserId, name: 'Responsável Declarado' },\n    });",
              "      guardian: { userId: guardianUserId, name: 'Responsável Declarado' },\n      requestedAt: requestedAt.toISOString(),\n    });",
          )
          replace_once(
              admin_test,
              '    expect(approved.validatedAt).toBeTruthy();\n',
              '    expect(approved.requestedAt).toBe(requestedAt.toISOString());\n    expect(approved.validatedAt).toBeTruthy();\n    expect(approved.validatedAt).not.toBe(approved.requestedAt);\n    validatedAt = approved.validatedAt!;\n',
          )
          replace_once(
              admin_test,
              "    expect(revoked).toMatchObject({ status: 'REVOKED' });\n",
              "    expect(revoked).toMatchObject({\n      status: 'REVOKED',\n      requestedAt: requestedAt.toISOString(),\n      validatedAt,\n    });\n    expect(revoked.revokedAt).toBeTruthy();\n    expect(revoked.revokedAt).not.toBe(revoked.requestedAt);\n",
          )

          public_test = 'apps/api/tests/pre-registration-public.integration.test.ts'
          request_expectation = """    expect(request).toMatchObject({
              status: 'PENDING',
              relationship: 'Mãe',
              approvalRequired: true,
            });
          """
          # Dedent the literal to the exact TypeScript indentation.
          request_expectation = '\n'.join(line[10:] if line.startswith('          ') else line for line in request_expectation.splitlines()) + '\n'
          insert_after(
              public_test,
              request_expectation,
              """    expect(request.requestedAt).toBeTruthy();

          const immutableRequestedAt = new Date('2026-07-23T09:30:00.000Z');
          await prisma.$executeRaw`
            UPDATE "PreRegistrationGuardianAuthorization"
            SET "requestedAt" = ${immutableRequestedAt},
                "updatedAt" = ${new Date('2026-07-23T10:30:00.000Z')}
            WHERE "alunoId" = ${invited.alunoId}
              AND "guardianUserId" = ${guardian.id}
          `;
          const repeatedRequest = await preRegistrationPublicService.requestGuardianAuthorization(
            guardian.id,
            invited.alunoId,
            { relationship: 'Mãe', declarationAccepted: true }
          );
          expect(repeatedRequest.requestedAt).toBe(immutableRequestedAt.toISOString());

          """,
          )
          pending_anchor = """    const pending = await prisma.preRegistrationGuardianAuthorization.findFirstOrThrow({
              where: { alunoId: invited.alunoId, guardianUserId: guardian.id },
            });
          """
          pending_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in pending_anchor.splitlines()) + '\n'
          insert_after(
              public_test,
              pending_anchor,
              """    expect(pending.requestedAt?.toISOString()).toBe(immutableRequestedAt.toISOString());
          expect(pending.updatedAt.toISOString()).not.toBe(immutableRequestedAt.toISOString());
          """,
          )

          migration = Path('apps/api/prisma/migrations/20260724141000_issue_271_guardian_request_timestamp/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Issue #271 audit remediation: preserve the time at which the guardian
          -- actually submitted the relationship declaration. updatedAt remains mutable
          -- for approval and revocation and must not be presented as the request time.
          ALTER TABLE "PreRegistrationGuardianAuthorization"
            ADD COLUMN "requestedAt" TIMESTAMP(3);

          -- Pending rows with a declared relationship still have the declaration update
          -- as their latest mutation. For already approved/revoked legacy rows, the exact
          -- declaration time was not stored, so createdAt is the stable conservative
          -- fallback instead of incorrectly using the later approval/revocation time.
          UPDATE "PreRegistrationGuardianAuthorization"
          SET "requestedAt" = CASE
            WHEN "relationship" IS NULL OR btrim("relationship") = '' THEN NULL
            WHEN "status" = 'PENDING' THEN "updatedAt"
            ELSE "createdAt"
          END;
          ''')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Run focused integration tests
        run: pnpm --filter @corrida/api exec jest tests/pre-registration-guardian-admin-approval.integration.test.ts tests/pre-registration-public.integration.test.ts --runInBand

      - name: Run type check
        run: pnpm type-check

      - name: Commit validated remediation
        shell: bash
        run: |
          rm .github/workflows/apply-issue-271-requested-at-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve guardian request timestamp (#271)"
          git push origin HEAD:feat/271-public-pre-registration
