name: Apply Issue 273 Worktree

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/export-worktree-273.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild and apply implementation patch
        run: |
          cat .issue273/patch.*.b64 | base64 --decode | gunzip > /tmp/issue273.patch
          patch -p1 --forward --batch < /tmp/issue273.patch

      - name: Remove transport-only files
        run: |
          rm -rf .issue273
          rm -f .github/workflows/export-worktree-273.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete canonical PAR-Q implementation (#273)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
