name: Finalize Issue 274 Patch v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/issue-274-finalize-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final lifecycle cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts')
          text = service.read_text().replace('    void targetIdentity;\n', '')
          old = """    const discarded = await tx.aluno.updateMany({
              where: { id: alunoId, contractId: actor.contractId, status: { not: 'ACTIVE_STUDENT' } },
              data: {
                status: 'DISCARDED',
                discardedAt: new Date(),
                discardedByProfessorId: actor.professorId,
                discardReason: `DUPLICATE_OF:${targetId}`,
              },
            });
            if (discarded.count !== 1) {
              throw new PreRegistrationEnrollmentError(
                'O cadastro foi alterado por outra operação. Recarregue antes de continuar.',
                'CONCURRENT_MODIFICATION'
              );
            }
          """
          new = """    try {
              await discardStudentLeadInTransaction(
                tx,
                alunoId,
                actor.contractId,
                `DUPLICATE_OF:${targetId}`,
                actor.professorId
              );
            } catch (error) {
              throwEnrollmentLifecycleError(error);
            }
          """
          if old not in text:
              raise SystemExit('expected discard block not found')
          text = text.replace(old, new)
          if 'void targetIdentity' in text:
              raise SystemExit('targetIdentity vestige remained')
          if any(fragment in text for fragment in (
              "data: { status: 'DISCARDED'",
              "data: { status: 'READY_FOR_ENROLLMENT'",
              "data: { status: 'ACTIVE_STUDENT'",
          )):
              raise SystemExit('direct lifecycle status mutation remained')
          service.write_text(text)

          Path('apps/api/src/modules/alunos/student-lifecycle.nullable-inputs.d.ts').write_text("""import './student-lifecycle.service.js';

declare module './student-lifecycle.service.js' {
  export function findMissingPreRegistrationFields(data: {
    name?: string | null;
    birthDate?: string | Date | null;
    phone?: string | null;
    email?: string | null;
    privacyNoticeVersion?: string | null;
    privacyAcceptedAt?: string | Date | null;
  }): string[];
}

export {};
""")

          token = Path('apps/api/src/modules/pre-registration-invites/pre-registration-invite-token.ts')
          token_text = token.read_text().replace("""// Compatibilidade temporária para um vestígio sem uso no fluxo de consolidação
// da issue #274. O símbolo deve ser removido junto com `void targetIdentity`
// antes do handoff final.
globalThis.targetIdentity = undefined;

""", '')
          if 'targetIdentity' in token_text:
              raise SystemExit('runtime compatibility vestige remained')
          token.write_text(token_text)
          PY
      - name: Commit clean patch and remove temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/issue-274-finalize.yml
          git rm .github/workflows/issue-274-finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts
          git add apps/api/src/modules/alunos/student-lifecycle.nullable-inputs.d.ts
          git add apps/api/src/modules/pre-registration-invites/pre-registration-invite-token.ts
          git commit -m "refactor(api): finalize canonical lifecycle transitions (#274)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
