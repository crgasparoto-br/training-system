name: Fix issue 247 read-only fixture

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/247-adipometry-api' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/247-adipometry-api
          fetch-depth: 0

      - name: Make read-only permission state explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/adipometry/adipometry-remediation.integration.test.ts')
          text = path.read_text()
          old = """    await setPermission(fixture.operatorFunctionId, MANAGE_KEY, false);
            const readOnly = await request(app)
          """
          new = """    await setPermission(fixture.operatorFunctionId, '', true);
            await setPermission(fixture.operatorFunctionId, VIEW_KEY, true);
            await setPermission(fixture.operatorFunctionId, MANAGE_KEY, false);

            const permissions = await prisma.accessPermission.findMany({
              where: {
                collaboratorFunctionId: fixture.operatorFunctionId,
                screenKey: SCREEN_KEY,
                blockKey: { in: ['', VIEW_KEY, MANAGE_KEY] },
              },
              select: { blockKey: true, canView: true },
            });
            expect(permissions).toEqual(expect.arrayContaining([
              { blockKey: '', canView: true },
              { blockKey: VIEW_KEY, canView: true },
              { blockKey: MANAGE_KEY, canView: false },
            ]));

            const readOnly = await request(app)
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one read-only fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/adipometry/adipometry-remediation.integration.test.ts
          git commit -m 'test(adpt): make read-only permission state explicit'
          git push origin HEAD:feat/247-adipometry-api
