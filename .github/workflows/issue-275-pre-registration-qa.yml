name: Issue 275 Pre-registration QA

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/src/common/pre-registration-*'
      - 'apps/api/src/main.ts'
      - 'apps/api/src/modules/pre-registration-**'
      - 'apps/api/src/modules/alunos/**'
      - 'apps/api/scripts/verify-issue-275-**'
      - 'apps/api/tests/issue-275-**'
      - 'apps/api/tests/pre-registration-**'
      - 'apps/api/prisma/**'
      - 'apps/api/package.json'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/config/pre-registration-availability.ts'
      - 'apps/web/src/config/pre-registration-rollout*'
      - 'apps/web/src/layouts/DashboardLayout.tsx'
      - 'apps/web/src/pages/PreRegistration**'
      - 'apps/web/src/pages/PublicPreRegistration/**'
      - 'apps/web/src/services/api.ts'
      - 'apps/web/index.html'
      - 'scripts/verify-student-lifecycle-legacy-backfill.sh'
      - 'docs/**pre-registration**'
      - 'docs/README.md'
      - 'docs/architecture/deployment.md'
      - '.env.example'
      - '.github/workflows/issue-275-pre-registration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-275-pre-registration-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-qa:
    name: Validate integrated E2E, authorization, performance and rollout
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      NODE_ENV: test
      JWT_SECRET: issue-275-ci-secret-with-sufficient-length
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PRE_REGISTRATION_ENABLED: 'true'
      PRE_REGISTRATION_TELEMETRY_ENABLED: 'true'
      VITE_PRE_REGISTRATION_ENABLED: 'true'
      PRE_REGISTRATION_INVITE_TTL_DAYS: '30'
      PRIVACY_NOTICE_URL: https://example.test/privacidade
      PRIVACY_NOTICE_VERSION: 2026-07
      HEALTH_PRIVACY_NOTICE_VERSION: 2026-07

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence manifest
        shell: bash
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          AUDIT_MERGE_PREVIEW_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          mkdir -p artifacts/issue-275
          cat > artifacts/issue-275/evidence.json <<EOF
          {
            "schemaVersion": 5,
            "kind": "issue-275-pre-registration-qa",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "eventName": "${GITHUB_EVENT_NAME}",
            "headSha": "${AUDIT_HEAD_SHA}",
            "baseSha": "${AUDIT_BASE_SHA}",
            "mergePreviewSha": "${AUDIT_MERGE_PREVIEW_SHA}",
            "ref": "${GITHUB_REF}",
            "rolloutApiEnabled": true,
            "rolloutWebEnabled": true,
            "dataset": "synthetic-postgresql-16",
            "repositoryValidationCheck": "Validate PR",
            "requiredEvidence": [
              "integrated-e2e",
              "adversarial-scenarios",
              "mandatory-scenario-regressions",
              "authorization-matrix",
              "authorization-cartesian",
              "authorization-matrix-extended",
              "performance-rollout",
              "endpoint-performance",
              "browser-privacy",
              "accessibility",
              "migration-backfill",
              "health-intake",
              "parq",
              "evidence-completeness"
            ],
            "historicalWorkflowsAvailableManually": [
              "Issue 272 Regression Evidence",
              "Issue 273 Regression Evidence",
              "Issue 273 Visual Evidence",
              "Issue 273 Runtime Diagnostic",
              "Issue 274 Visual Evidence",
              "Visual Audit Issue 270",
              "Visual Audit Issue 271"
            ]
          }
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and web for runtime verifiers
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Install Chrome for runtime verifiers
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Apply migrations
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec prisma migrate deploy 2>&1 \
            | tee artifacts/issue-275/migrations.log

      - name: Verify lifecycle legacy backfill
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-student-lifecycle-legacy-backfill.sh 2>&1 \
            | tee artifacts/issue-275/lifecycle-backfill.log

      - name: Test rollout gates and telemetry privacy
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec jest --runInBand \
            src/common/pre-registration-rollout.test.ts \
            src/common/pre-registration-safe-log.test.ts 2>&1 \
            | tee artifacts/issue-275/api-rollout-tests.log
          pnpm --filter @corrida/web exec vitest run \
            src/config/pre-registration-rollout.test.ts 2>&1 \
            | tee artifacts/issue-275/web-rollout-tests.log

      - name: Verify canonical health intake
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-272-health-intake.ts 2>&1 \
            | tee artifacts/issue-275/health-intake.log

      - name: Verify canonical PAR-Q
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-273-parq.ts 2>&1 \
            | tee artifacts/issue-275/parq.log

      - name: Verify integrated pre-registration lifecycle
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-integrated-e2e.ts 2>&1 \
            | tee artifacts/issue-275/integrated-e2e.log

      - name: Verify adversarial integrated scenarios
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-adversarial-scenarios.ts 2>&1 \
            | tee artifacts/issue-275/adversarial-scenarios.log

      - name: Verify mandatory scenario regressions
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec jest --runInBand \
            tests/pre-registration-public-routes.contract.test.ts \
            tests/pre-registration-admin.contract.test.ts \
            tests/pre-registration-enrollment-routes.contract.test.ts \
            tests/pre-registration-public-claim-concurrency.integration.test.ts \
            src/modules/pre-registration-invites/pre-registration-invite-concurrency.integration.test.ts \
            src/modules/pre-registration-invites/pre-registration-invite-temporal-consistency.integration.test.ts \
            tests/pre-registration-review-invalidation.contract.test.ts \
            tests/pre-registration-public-deduplication.contract.test.ts \
            tests/pre-registration-health-intake.routes.test.ts \
            tests/pre-registration-parq.routes.test.ts \
            tests/pre-registration-enrollment-concurrency.adapter.test.ts 2>&1 \
            | tee artifacts/issue-275/mandatory-scenario-regressions.log

      - name: Verify API authorization matrix
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-authorization-matrix.ts 2>&1 \
            | tee artifacts/issue-275/authorization-matrix.log

      - name: Verify cartesian API authorization matrix
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-authorization-cartesian.ts 2>&1 \
            | tee artifacts/issue-275/authorization-cartesian.log

      - name: Verify proportional queries and rollout preservation
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-performance-rollout.ts 2>&1 \
            | tee artifacts/issue-275/performance-rollout.log

      - name: Measure real endpoint performance
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-endpoint-performance.ts 2>&1 \
            | tee artifacts/issue-275/endpoint-performance.log

      - name: Verify browser privacy and accessibility
        shell: bash
        run: |
          set -o pipefail
          VITE_API_URL=http://127.0.0.1:3011 \
          VITE_PRE_REGISTRATION_ENABLED=true \
            pnpm --filter @corrida/web build 2>&1 \
            | tee artifacts/issue-275/browser-privacy-web-build.log
          pnpm --filter @corrida/api exec tsx \
            scripts/verify-issue-275-browser-privacy.ts 2>&1 \
            | tee artifacts/issue-275/browser-privacy.log

      - name: Verify enabled and disabled production web builds
        shell: bash
        run: |
          set -o pipefail
          VITE_PRE_REGISTRATION_ENABLED=false pnpm --filter @corrida/web build 2>&1 \
            | tee artifacts/issue-275/web-build-disabled.log
          VITE_PRE_REGISTRATION_ENABLED=true pnpm --filter @corrida/web build 2>&1 \
            | tee artifacts/issue-275/web-build-enabled.log

      - name: Reset verifier processes and PostgreSQL sessions
        shell: bash
        run: |
          set -euo pipefail
          pkill -TERM -f '[t]sx src/main.ts' || true
          pkill -TERM -f '[n]ode.*src/main.ts' || true
          pkill -TERM -f '[p]npm.*src/main.ts' || true
          pkill -TERM -f '[v]ite preview' || true
          sleep 1
          postgres_container="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)"
          test -n "${postgres_container}"
          docker exec "${postgres_container}" psql \
            -U postgres \
            -d training_system_test \
            -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'training_system_test' AND pid <> pg_backend_pid();" \
            | tee artifacts/issue-275/database-session-reset.log

      - name: Verify extended API authorization matrix
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec jest --runInBand \
            tests/issue-275-authorization-matrix-extended.integration.test.ts 2>&1 \
            | tee artifacts/issue-275/authorization-matrix-extended.log

      - name: Verify evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            artifacts/issue-275/evidence.json
            artifacts/issue-275/migrations.log
            artifacts/issue-275/lifecycle-backfill.log
            artifacts/issue-275/health-intake.log
            artifacts/issue-275/parq.log
            artifacts/issue-275/integrated-e2e.json
            artifacts/issue-275/integrated-e2e.log
            artifacts/issue-275/adversarial-scenarios.json
            artifacts/issue-275/adversarial-scenarios.log
            artifacts/issue-275/mandatory-scenario-regressions.log
            artifacts/issue-275/authorization-matrix.json
            artifacts/issue-275/authorization-matrix.log
            artifacts/issue-275/authorization-cartesian.json
            artifacts/issue-275/authorization-cartesian.log
            artifacts/issue-275/authorization-matrix-extended.log
            artifacts/issue-275/performance-rollout.json
            artifacts/issue-275/performance-rollout.log
            artifacts/issue-275/endpoint-performance.json
            artifacts/issue-275/endpoint-performance.log
            artifacts/issue-275/browser-privacy.json
            artifacts/issue-275/browser-privacy.log
            artifacts/issue-275/accessibility.json
            artifacts/issue-275/accessibility-tree.json
            artifacts/issue-275/accessibility-mobile.png
            artifacts/issue-275/accessibility-desktop.png
          )
          for evidence_file in "${required_files[@]}"; do
            test -s "${evidence_file}"
          done
          jq -e '
            .scenarios.basic and
            .scenarios.completeNoAlert and
            .scenarios.positiveParq and
            .scenarios.resume and
            .scenarios.inviteRegeneration and
            .scenarios.duplicates and
            .scenarios.concurrency
          ' artifacts/issue-275/integrated-e2e.json >/dev/null
          jq -e '
            .scenarios.canonicalConsolidation.sourceHistoryPreserved and
            .scenarios.clinicalConsolidationBlocked.blockedWithoutMutation and
            .scenarios.concurrentBasicCompletion.winnerCount == 1 and
            .scenarios.administrativePublicRace.coherentIdentity
          ' artifacts/issue-275/adversarial-scenarios.json >/dev/null
          jq -e '
            .expectedEntryCount == 112 and
            (.entries | length) == 112 and
            ([.entries[] | select(.passed != true)] | length) == 0 and
            .deniedWritesPersisted == false and
            .activeInviteCount == 1 and
            .foreignAuditEvents == 0 and
            .authorizedAuditProfiles == 4 and
            .sanitizedAuditPayload == true
          ' artifacts/issue-275/authorization-cartesian.json >/dev/null
          jq -e '
            .plans.administrativeList and
            .plans.normalizedPhoneLookup and
            .plans.tokenHashLookup and
            .rollback.disabledWithoutMutation and
            .rollback.reenabledWithoutMutation
          ' artifacts/issue-275/performance-rollout.json >/dev/null
          jq -e '
            ([.endpoints[] | select(.errorRate != 0)] | length) == 0 and
            .contention.errorRate == 0 and
            .boundedHistories.inviteHistory.actualRows <= 20 and
            .boundedHistories.lifecycleAudit.actualRows <= 100
          ' artifacts/issue-275/endpoint-performance.json >/dev/null
          jq -e '
            .inviteTokenRemovedFromUrl and
            .inviteTokenAbsentFromStorage and
            .cpfAbsentFromStorageAndBrowserLogs and
            .clinicalPayloadAbsentFromStorage and
            .inspectionBoundary == "full-invite-lifecycle" and
            .initialPhaseInspected and
            .referrerTokenAbsent and
            .apiTelemetryObserved and
            .apiLogsSanitized and
            .browserErrors == 0 and
            (.externalAnalyticsOrigins | length) == 0
          ' artifacts/issue-275/browser-privacy.json >/dev/null
          jq -e '
            .keyboardOnlyNavigation and
            .nativeRequiredFieldFocus and
            .errorFocusManaged and
            .focusAfterStageChange and
            .labelsAssociated and
            .contrastPassed and
            .screenReaderTreeCaptured and
            .zoom200NoHorizontalOverflow and
            .mobileInputSemanticsPassed
          ' artifacts/issue-275/accessibility.json >/dev/null
          grep -q 'legacy-incomplete-student-ok' artifacts/issue-275/lifecycle-backfill.log
          grep -q 'multiple-parq-history-ok' artifacts/issue-275/lifecycle-backfill.log
          grep -q 'similar-tenants-isolated-ok' artifacts/issue-275/lifecycle-backfill.log
          grep -q 'new-lead-rerun-ok' artifacts/issue-275/lifecycle-backfill.log
          grep -q 'in-progress-rerun-ok' artifacts/issue-275/lifecycle-backfill.log
          grep -q 'Test Suites:.*passed' artifacts/issue-275/mandatory-scenario-regressions.log
          grep -q 'Test Suites:.*passed' artifacts/issue-275/authorization-matrix-extended.log
          cat > artifacts/issue-275/evidence-completeness.json <<EOF
          {
            "schemaVersion": 4,
            "headSha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "requiredFiles": ${#required_files[@]},
            "integratedScenarios": 11,
            "authorizationProfiles": 8,
            "authorizationActions": 14,
            "authorizationCartesianEntries": 112,
            "sampledEndpointFamilies": 8,
            "browserPrivacyGate": "passed",
            "accessibilityGate": "passed",
            "representativeMigrationGate": "passed",
            "sanitizedAuditGate": "passed",
            "mandatoryScenarioRegressionGate": "passed",
            "extendedAuthorizationGate": "passed",
            "repositoryValidationCheck": "Validate PR",
            "historicalWorkflowMode": "manual"
          }
          EOF

      - name: Upload issue 275 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-275-pre-registration-qa-${{ github.run_id }}
          path: artifacts/issue-275
          if-no-files-found: error
          retention-days: 14
