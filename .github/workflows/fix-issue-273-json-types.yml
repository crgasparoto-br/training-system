name: Fix Issue 273 JSON Types

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/fix-issue-273-json-types.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace invalid Prisma JSON predicate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/pre-registration-public/pre-registration-parq.service.ts')
          content = path.read_text()
          old = '''function positiveItems(value: Prisma.JsonValue | null | undefined): ParqPositiveItem[] {
            if (!Array.isArray(value)) return [];
            return value.filter((item): item is ParqPositiveItem => {
              if (!item || typeof item !== 'object' || Array.isArray(item)) return false;
              const record = item as Record<string, unknown>;
              return typeof record.key === 'string' && typeof record.label === 'string';
            });
          }
          '''
          new = '''function positiveItems(value: Prisma.JsonValue | null | undefined): ParqPositiveItem[] {
            if (!Array.isArray(value)) return [];
            const items: ParqPositiveItem[] = [];
            for (const item of value) {
              if (!item || typeof item !== 'object' || Array.isArray(item)) continue;
              const record = item as Prisma.JsonObject;
              if (typeof record.key !== 'string' || typeof record.label !== 'string') continue;
              items.push({
                key: record.key as ParqPositiveItem['key'],
                label: record.label,
              });
            }
            return items;
          }
          '''
          if old not in content:
              raise SystemExit('positiveItems implementation not found')
          path.write_text(content.replace(old, new, 1))
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-issue-273-json-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: parse PAR-Q positive items from Prisma JSON"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
