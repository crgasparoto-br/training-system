name: Finalize Issue 274 Patch v3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch issue 274
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts')
          text = path.read_text()
          text = text.replace('    void targetIdentity;\n', '')
          start = text.index('    const discarded = await tx.aluno.updateMany({')
          end_marker = """    }

    const validUntil = new Date"""
          end = text.index(end_marker, start)
          replacement = """    try {
      await discardStudentLeadInTransaction(
        tx,
        alunoId,
        actor.contractId,
        `DUPLICATE_OF:${targetId}`,
        actor.professorId
      );
    } catch (error) {
      throwEnrollmentLifecycleError(error);
    }

    const validUntil = new Date"""
          text = text[:start] + replacement + text[end + len(end_marker):]
          if 'void targetIdentity' in text:
            raise SystemExit('targetIdentity remained')
          if "data: {\n        status: 'DISCARDED'" in text:
            raise SystemExit('discard mutation remained')
          path.write_text(text)

          Path('apps/api/src/modules/alunos/student-lifecycle.nullable-inputs.d.ts').write_text("""import './student-lifecycle.service.js';

declare module './student-lifecycle.service.js' {
  export function findMissingPreRegistrationFields(data: {
    name?: string | null;
    birthDate?: string | Date | null;
    phone?: string | null;
    email?: string | null;
    privacyNoticeVersion?: string | null;
    privacyAcceptedAt?: string | Date | null;
  }): string[];
}

export {};
""")

          token = Path('apps/api/src/modules/pre-registration-invites/pre-registration-invite-token.ts')
          token_text = token.read_text()
          marker = '// Compatibilidade temporária para um vestígio sem uso no fluxo de consolidação\n'
          if marker in token_text:
            token_text = token_text[token_text.index('import crypto'):]
            lines = token_text.splitlines()
            lines = [line for line in lines if 'targetIdentity' not in line and 'Compatibilidade temporária' not in line and 'da issue #274' not in line and 'antes do handoff final' not in line]
            token_text = '\n'.join(lines) + '\n'
          token.write_text(token_text)
          PY
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/issue-274-finalize.yml
          rm -f .github/workflows/issue-274-finalize-v2.yml
          rm -f .github/workflows/issue-274-finalize-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(api): finalize canonical lifecycle transitions (#274)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
