name: Fix Issue 271 Draft Fixtures

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/fix-issue-271-draft-fixtures.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Align authenticated draft fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          behavior_path = Path('apps/web/src/pages/PublicPreRegistration/PublicPreRegistration.behavior.test.tsx')
          behavior = behavior_path.read_text(encoding='utf-8')
          old = """    mocks.getSession.mockResolvedValue(baseSession);
              window.sessionStorage.clear();
          """.replace('              ', '')
          new = """    mocks.getSession.mockResolvedValue(baseSession);
              window.localStorage.clear();
              window.localStorage.setItem('user', JSON.stringify({ id: 'guardian-1' }));
              window.sessionStorage.clear();
          """.replace('              ', '')
          if behavior.count(old) != 1:
              raise RuntimeError('Authenticated behavior fixture insertion point not found')
          behavior_path.write_text(behavior.replace(old, new, 1), encoding='utf-8')

          visual_path = Path('apps/api/scripts/visual-audit-issue-271.mjs')
          visual = visual_path.read_text(encoding='utf-8')
          old_key = "'pre-registration-draft-v2:internal-student-id'"
          new_key = "'pre-registration-draft-v3:guardian-user:internal-student-id'"
          if visual.count(old_key) != 1:
              raise RuntimeError('Legacy visual draft key not found')
          visual_path.write_text(visual.replace(old_key, new_key, 1), encoding='utf-8')

          Path('.github/workflows/fix-issue-271-draft-fixtures.yml').unlink()
          PY

      - name: Commit fixture alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(issue-271): seed authenticated draft scope'
          git push origin HEAD:feat/271-public-pre-registration
