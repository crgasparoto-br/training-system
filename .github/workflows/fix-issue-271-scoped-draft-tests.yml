name: Fix Issue 271 Scoped Draft Tests

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/fix-issue-271-scoped-draft-tests.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Align authenticated draft fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/PublicPreRegistration/PublicPreRegistration.behavior.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "const scopedDraftKey = `${DRAFT_KEY}:${baseSession.alunoId}`;"
          new = "const scopedDraftKey = `${DRAFT_KEY}:guardian-1:${baseSession.alunoId}`;"
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one legacy scoped draft key fixture')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-issue-271-scoped-draft-tests.yml').unlink()
          PY

      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(issue-271): scope drafts by authenticated user'
          git push origin HEAD:feat/271-public-pre-registration
