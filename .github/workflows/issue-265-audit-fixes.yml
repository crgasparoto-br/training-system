name: Apply issue 265 audit fixes

on:
  push:
    branches:
      - feat/265-fixed-schedule-student-form
    paths:
      - .github/workflows/issue-265-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/265-fixed-schedule-student-form
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply audited corrections
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/issue-265-audit-fixes.mjs
          node /tmp/issue-265-audit-fixes.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply test migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Validate repository
        run: pnpm validate

      - name: Commit corrections and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-265-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages docs
          git commit -m "fix: address issue 265 audit findings"
          git push origin HEAD:feat/265-fixed-schedule-student-form
