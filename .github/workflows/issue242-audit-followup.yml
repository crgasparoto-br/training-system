name: Apply issue 242 audit follow-up

on:
  push:
    branches:
      - fix/242-service-catalog-transaction-timeout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/242-service-catalog-transaction-timeout
          fetch-depth: 0
      - name: Apply audit correction
        run: |
          git apply --check .github/issue242-audit-followup.patch
          git apply .github/issue242-audit-followup.patch
          git diff --check
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/services/service.bootstrap.ts apps/api/tests/service-catalog-bootstrap.integration.scenarios.ts
          git commit -m "fix(api): preserve component targets on catalog conflict (#242)"
          git push origin HEAD:fix/242-service-catalog-transaction-timeout
