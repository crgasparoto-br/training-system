name: Finalize issue 242 refactor

on:
  push:
    branches:
      - fix/242-service-catalog-transaction-timeout

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/242-service-catalog-transaction-timeout
          fetch-depth: 0
      - name: Apply focused service-base refactor
        run: |
          git apply --check .github/issue242-service-base.patch
          git apply .github/issue242-service-base.patch
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/services/service.service-base.ts
          git commit -m "refactor(api): reuse catalog Prisma client (#242)"
          git push origin HEAD:fix/242-service-catalog-transaction-timeout
