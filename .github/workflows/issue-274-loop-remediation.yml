              "  await recordClaimDuplicateReviewInTransaction(\n"
              "    tx,\n"
              "    userId,\n"
              "    invite.alunoId,\n"
              "    claimDetection\n"
              "  );\n\n"
              "  return invite.alunoId;\n"
          )

          for path in [
              public_service_path,
              atomic_path,
              duplicate_path,
          ]:
              file = Path(path)
              text = file.read_text()
              text = text.replace('now.getFullYear() - birthDate.getFullYear()', 'now.getUTCFullYear() - birthDate.getUTCFullYear()')
              text = text.replace('now.getMonth() - birthDate.getMonth()', 'now.getUTCMonth() - birthDate.getUTCMonth()')
              text = text.replace('now.getDate() < birthDate.getDate()', 'now.getUTCDate() < birthDate.getUTCDate()')
              file.write_text(text)

          index_path = 'apps/api/src/modules/pre-registration-public/index.ts'
          replace_once(index_path, "import './pre-registration-claim-review.adapter.js';\n\n", '')

          docs_path = 'docs/architecture/pre-registration-enrollment.md'
          docs = Path(docs_path).read_text()
          docs = docs.replace(
              '- `apps/api/src/modules/pre-registration-public/pre-registration-public.service.ts`: aplica o detector no claim, depois do lock do convite e antes de qualquer vínculo; o resultado não cria uma resposta pública diferenciada.',
              '- `apps/api/src/modules/pre-registration-public/pre-registration-public.service.ts`: aplica o detector no claim, depois do lock do convite e antes de qualquer vínculo; a pendência privada e a auditoria são persistidas na mesma transação do vínculo, sem resposta pública diferenciada.'
          )
          docs = docs.replace(
              'A deduplicação pública ocorre após autorização e bloqueio do onboarding e antes de `upsertStudentIdentity`, eliminando a janela entre checagem e gravação.',
              'A deduplicação pública ocorre após autorização e bloqueio do onboarding. Escritas de identidade adquirem um advisory lock transacional por tenant antes da detecção e do `upsertStudentIdentity`, serializando identificadores concorrentes; conflitos de serialização permanecem fail-closed.'
          )
          if '## Data civil' not in docs:
              docs += '''\n\n## Data civil\n\n`birthDate` é um valor civil. A API pública aceita somente `YYYY-MM-DD`; a fronteira canônica valida o calendário, preserva o prefixo civil sem converter offsets e persiste meia-noite UTC apenas como representação técnica. Cálculos de idade usam componentes UTC para não deslocar o dia por timezone.\n'''
          Path(docs_path).write_text(docs)

          Path('apps/api/tests/student-identity-civil-date.test.ts').write_text(r'''import { readFileSync } from 'node:fs';
import { resolve } from 'node:path';
import {
  normalizeStudentBirthDate,
} from '../src/modules/alunos/student-identity.service.js';

describe('student identity civil birth date', () => {
  it('preserves the declared civil day instead of converting the timezone offset', () => {
    expect(normalizeStudentBirthDate('2000-01-01T23:30:00-03:00')).toBe(
      '2000-01-01T00:00:00.000Z'
    );
    expect(normalizeStudentBirthDate('2000-01-01')).toBe('2000-01-01T00:00:00.000Z');
  });

  it('rejects invalid civil dates', () => {
