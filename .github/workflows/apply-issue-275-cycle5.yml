name: Apply Issue 275 Cycle 5

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-275-cycle5.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/275-pre-registration-qa-rollout
          fetch-depth: 0
      - name: Relax semantic selectors for required labels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo '2efc2e8d5dec190b7398708679e232d2d1cc946ef1143afa266793ac932d5895  .audit/issue-275-cycle5.patch' | sha256sum -c -
          git apply --index .audit/issue-275-cycle5.patch
          rm .audit/issue-275-cycle5.patch
          git add -A
          git diff --cached --check
          git commit -m 'test: usar seletores semânticos para campos obrigatórios'
          git push origin HEAD:feat/275-pre-registration-qa-rollout
