name: Apply issue 239 patch

on:
  push:
    branches:
      - fix/239-remove-assessment-from-student-form
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/239-remove-assessment-from-student-form
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply implementation
        run: python scripts/apply-issue-239.py

      - name: Commit implementation
        shell: bash
        run: |
          rm scripts/apply-issue-239.py
          rm .github/workflows/issue-239-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): remove assessment data from student form (#239)"
          git push origin HEAD:fix/239-remove-assessment-from-student-form

      - name: Validate repository
        shell: bash
        run: |
          set +e
          pnpm validate > /tmp/issue-239-validation.log 2>&1
          status=$?
          tail -n 200 /tmp/issue-239-validation.log
          exit $status
