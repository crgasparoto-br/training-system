name: Apply and validate issue 271 corrections

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/apply-issue-271-final.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-validate-publish:
    name: Apply, validate, audit and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Reconstruct and verify correction patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue271/part-00 .github/issue271/part-01 .github/issue271/part-02 .github/issue271/part-03 > /tmp/issue271.patch.gz.b64
          test "$(wc -c < /tmp/issue271.patch.gz.b64)" = '31192'
          base64 -d /tmp/issue271.patch.gz.b64 > /tmp/issue271.patch.gz
          test "$(wc -c < /tmp/issue271.patch.gz)" = '23392'
          echo '6967e6311787b83d266d29199d22491a6b7f42870cd60f7a16b735dbb8391314  /tmp/issue271.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue271.patch.gz > /tmp/issue271.patch

      - name: Apply corrections and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --exclude=.github/workflows/visual-audit-issue-271.yml /tmp/issue271.patch
          git apply --index --exclude=.github/workflows/visual-audit-issue-271.yml /tmp/issue271.patch
          rm -rf .github/issue271 .github/issue271-bin
          rm -f .github/workflows/apply-issue-271-final.yml
          rm -f .github/workflows/orchestrate-issue-271.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolver pendências auditadas da issue 271'
          test -z "$(git status --porcelain)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply migrations to PostgreSQL
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Validate Prisma schema
        run: pnpm --filter @corrida/api exec prisma validate

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test with database integrations
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/issue271-test.log

      - name: Build
        run: pnpm build

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: pnpm docs:check

      - name: Install Chrome for visual audit
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Run responsive visual audit
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec node scripts/visual-audit-issue-271.mjs 2>&1 | tee /tmp/issue271-visual.log

      - name: Hygiene checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/issue271
          test ! -e .github/issue271-bin
          test ! -e .github/workflows/apply-issue-271-final.yml
          test ! -e .github/workflows/orchestrate-issue-271.yml
          test -z "$(git status --porcelain)"
          ! git grep -nE '<<<<<<<|=======|>>>>>>>' -- ':!pnpm-lock.yaml'

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-271-final-visual-${{ github.run_id }}
          path: |
            artifacts/issue-271-visual/*.png
            /tmp/issue271-test.log
            /tmp/issue271-visual.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish validated commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/271-public-pre-registration
          FINAL_SHA="$(git rev-parse HEAD)"
          gh pr ready 281
          gh pr comment 281 --body "## Orquestração concluída — issue #271\n\nCommit validado e publicado: \`${FINAL_SHA}\`\n\n- PostgreSQL e migrations: aprovado\n- Prisma e type-check: aprovado\n- lint e testes: aprovado\n- build, arquitetura, acesso e documentação: aprovado\n- auditoria visual responsiva: aprovada\n- higiene e remoção dos artefatos temporários: aprovada\n\nA PR está pronta para auditoria independente final."

      - name: Record failed orchestration
        if: failure()
        shell: bash
        run: |
          {
            echo '## Orquestração com pendência — issue #271'
            echo
            echo "Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if test -f /tmp/issue271-test.log; then
              echo '### Trecho final dos testes'
              echo '```text'
              tail -n 160 /tmp/issue271-test.log
              echo '```'
            elif test -f /tmp/issue271-visual.log; then
              echo '### Trecho final da auditoria visual'
              echo '```text'
              tail -n 160 /tmp/issue271-visual.log
              echo '```'
            else
              echo 'A falha ocorreu antes da geração dos diagnósticos de testes.'
            fi
            echo
            echo 'A PR permanece em rascunho e nenhum commit funcional não validado foi enviado.'
          } > /tmp/issue271-failure.md
          gh pr comment 281 --body-file /tmp/issue271-failure.md
