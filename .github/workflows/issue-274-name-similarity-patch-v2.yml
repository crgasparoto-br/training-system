name: Patch Issue 274 Name Similarity v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Ignore Portuguese name particles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts')
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "const leftTokens = new Set(a.split(' ').filter((token) => token.length > 1));")
          expected_right = "const rightTokens = new Set(b.split(' ').filter((token) => token.length > 1));"
          if lines[start + 1].strip() != expected_right:
            raise SystemExit('expected name similarity token block not found')
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          replacement = [
            indent + "const insignificantTokens = new Set(['da', 'das', 'de', 'do', 'dos', 'e']);",
            indent + 'const leftTokens = new Set(',
            indent + "  a.split(' ').filter((token) => token.length > 1 && !insignificantTokens.has(token))",
            indent + ');',
            indent + 'const rightTokens = new Set(',
            indent + "  b.split(' ').filter((token) => token.length > 1 && !insignificantTokens.has(token))",
            indent + ');',
          ]
          lines[start:start + 2] = replacement
          text = '\n'.join(lines) + '\n'
          if text.count('const insignificantTokens = new Set') != 1:
            raise SystemExit('name similarity patch was not applied exactly once')
          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/issue-274-name-similarity-patch.yml
          rm -f .github/workflows/issue-274-name-similarity-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): ignore Portuguese particles in name similarity (#274)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
