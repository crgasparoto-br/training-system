name: Issue 426 patch transport

on:
  push:
    branches:
      - fix/426-alternating-movement-type

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/426-alternating-movement-type
          fetch-depth: 0

      - name: Apply issue 426 patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function replaceExact(file, before, after, expected = 1) {
            const original = fs.readFileSync(file, 'utf8');
            const occurrences = original.split(before).length - 1;
            if (occurrences !== expected) {
              throw new Error(`${file}: expected ${expected} occurrence(s), found ${occurrences}`);
            }
            fs.writeFileSync(file, original.split(before).join(after), 'utf8');
          }

          const oldEnum = `enum MovementType {\n  U\n  I\n  O\n}`;
          const newEnum = `enum MovementType {\n  U\n  I\n  O\n  A\n}`;
          replaceExact('apps/api/prisma/schema.prisma', oldEnum, newEnum);
          replaceExact('prisma/schema.prisma', oldEnum, newEnum);

          replaceExact(
            'apps/api/src/modules/contracts/contract-defaults.service.ts',
            `import {\n  PrismaClient,\n  type CountingType,\n  type LoadType,\n  type MovementType,\n} from '@prisma/client';`,
            `import {\n  MovementType,\n  PrismaClient,\n  type CountingType,\n  type LoadType,\n} from '@prisma/client';`
          );
          replaceExact(
            'apps/api/src/modules/contracts/contract-defaults.service.ts',
            `const MOVEMENT_TYPES = new Set<string>(['U', 'I', 'O']);`,
            `const MOVEMENT_TYPES = new Set<string>(Object.values(MovementType));`
          );

          replaceExact(
            'apps/api/src/scripts/import-exercises.ts',
            `  if (['U', 'I', 'O'].includes(upper)) {\n    return upper as MovementType;\n  }`,
            `  if (Object.values(MovementType).includes(upper as MovementType)) {\n    return upper as MovementType;\n  }`
          );

          replaceExact(
            'apps/web/src/services/library.service.ts',
            `'U' | 'I' | 'O'`,
            `'U' | 'A' | 'I' | 'O'`,
            2
          );

          const oldMovementOptions = `const MOVEMENT_TYPES = [\n  { value: 'U', label: 'Unilateral' },\n  { value: 'I', label: 'Isolado' },\n  { value: 'O', label: 'Outros (Bilateral)' },\n];`;
          const newMovementOptions = `const MOVEMENT_TYPES = [\n  { value: 'U', label: 'Unilateral' },\n  { value: 'A', label: 'Alternado' },\n  { value: 'I', label: 'Isolado' },\n  { value: 'O', label: 'Outros (Bilateral)' },\n];`;
          replaceExact('apps/web/src/pages/Library/ExerciseModal.tsx', oldMovementOptions, newMovementOptions);
          replaceExact('apps/web/src/pages/Library/index.tsx', oldMovementOptions, newMovementOptions);

          replaceExact(
            'IMPORTACAO_EXERCICIOS.md',
            `"movementType": "U | I | O"`,
            `"movementType": "U | A | I | O"`
          );
          replaceExact(
            'IMPORTACAO_EXERCICIOS.md',
            `- **U** - Unilateral\n- **I** - Isométrico\n- **O** - Outros`,
            `- **U** - Unilateral\n- **A** - Alternado\n- **I** - Isolado\n- **O** - Outros (Bilateral)`
          );

          replaceExact(
            'docs/architecture/contract-defaults.md',
            `- ignora códigos de catálogo que não pertencem aos enums suportados pelo produto, em vez de reinterpretá-los silenciosamente;`,
            `- aceita \`A = Alternado\` como valor canônico de \`movementType\`, preservando \`U\`, \`I\` e \`O\`;\n- ignora códigos não suportados, incluindo \`B\` e \`-\`, em vez de reinterpretá-los silenciosamente;`
          );

          const migrationDir = 'apps/api/prisma/migrations/20260910150500_add_alternating_movement_type';
          fs.mkdirSync(migrationDir, { recursive: true });
          fs.writeFileSync(
            path.join(migrationDir, 'migration.sql'),
            `-- Extend the exercise movement domain without reinterpreting existing values.\nALTER TYPE "MovementType" ADD VALUE IF NOT EXISTS 'A';\n`,
            'utf8'
          );

          const testPath = 'apps/api/src/modules/contracts/contract-defaults.movement-type.test.ts';
          fs.writeFileSync(
            testPath,
            `import fs from 'node:fs';\nimport path from 'node:path';\nimport { loadProductExerciseDefaults } from './contract-defaults.service.js';\n\ndescribe('movementType dos exercícios padrão', () => {\n  it('aceita A como movimento Alternado a partir do catálogo canônico', () => {\n    const defaults = loadProductExerciseDefaults();\n    const alternating = defaults.filter((item) => item.movementType === 'A');\n\n    expect(alternating.length).toBeGreaterThan(0);\n    expect(alternating.map((item) => item.name)).toContain('Mobilidade de Quadril Alternado');\n  });\n\n  it('não converte B ou - para outro tipo de movimento', () => {\n    const rawRows = JSON.parse(\n      fs.readFileSync(path.resolve(process.cwd(), 'src/scripts/exercises-data.json'), 'utf8')\n    ) as Array<{ movementType?: string }>;\n    const unsupportedCodes = rawRows\n      .map((row) => row.movementType?.trim().toUpperCase())\n      .filter((value) => value === 'B' || value === '-');\n\n    expect(unsupportedCodes.length).toBeGreaterThan(0);\n\n    const defaults = loadProductExerciseDefaults();\n    expect(\n      defaults.some((item) => ['B', '-'].includes(String(item.movementType ?? '')))\n    ).toBe(false);\n  });\n});\n`,
            'utf8'
          );

          fs.rmSync('.github/workflows/issue-426-patch.yml');
          NODE

      - name: Commit material patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: suportar movimento alternado na biblioteca"
          git push origin HEAD:fix/426-alternating-movement-type
