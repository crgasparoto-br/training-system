name: Issue 263 One-shot Sync

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/263-generalize-contracts-collaborators'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check one-shot marker
        id: marker
        run: |
          if [ -f .github/issue-263-sync-complete ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize schemas and remove legacy writes
        if: steps.marker.outputs.done == 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          def patch_schema(path: str) -> None:
              source = Path(path).read_text()
              source = replace_once(
                  source,
                  '  currentStatus              String?\n  lastProfileReviewAt',
                  '  currentStatus              String?\n  currentCollaboratorContractId String? @unique\n  lastProfileReviewAt',
                  f'{path}: professor current pointer field',
              )
              source = replace_once(
                  source,
                  '  contracts                Contract[]\n  collaboratorFunction',
                  '  contracts                Contract[] @relation("ContractResponsibleProfessor")\n  generatedCollaboratorContracts Contract[] @relation("ContractCollaborator")\n  collaboratorContracts          CollaboratorContract[] @relation("CollaboratorContracts")\n  currentCollaboratorContract    CollaboratorContract? @relation("CurrentCollaboratorContract", fields: [currentCollaboratorContractId], references: [id], onDelete: SetNull)\n  collaboratorFunction',
                  f'{path}: professor contract relations',
              )
              source = replace_once(
                  source,
                  '  @@index([responsibleManagerId])\n  @@index([collaboratorFunctionId])',
                  '  @@index([responsibleManagerId])\n  @@index([currentCollaboratorContractId])\n  @@index([collaboratorFunctionId])',
                  f'{path}: professor pointer index',
              )
              source = replace_once(
                  source,
                  '  status      ContractTemplateStatus @default(DRAFT)\n  headerHtml',
                  '  status      ContractTemplateStatus @default(DRAFT)\n  applicability ContractTemplateApplicability @default(STUDENT)\n  headerHtml',
                  f'{path}: template applicability',
              )
              source = replace_once(
                  source,
                  '  alunoId             String\n  responsavelName',
                  '  alunoId             String?\n  collaboratorId      String?\n  partyType           ContractPartyType @default(STUDENT)\n  origin              ContractLinkOrigin @default(ELECTRONIC)\n  responsavelName',
                  f'{path}: typed contract fields',
              )
              source = replace_once(
                  source,
                  '  aluno                Aluno                   @relation(fields: [alunoId], references: [id], onDelete: Cascade)\n  service',
                  '  aluno                Aluno?                  @relation(fields: [alunoId], references: [id], onDelete: Cascade)\n  collaborator         Professor?              @relation("ContractCollaborator", fields: [collaboratorId], references: [id], onDelete: Restrict)\n  service',
                  f'{path}: optional student and collaborator relation',
              )
              source = replace_once(
                  source,
                  '  professor            Professor?              @relation(fields: [professorId], references: [id], onDelete: SetNull)\n  signatures',
                  '  professor            Professor?              @relation("ContractResponsibleProfessor", fields: [professorId], references: [id], onDelete: SetNull)\n  signatures',
                  f'{path}: responsible professor relation name',
              )
              source = replace_once(
                  source,
                  '  studentContracts     StudentContract[]\n  auditLogs',
                  '  studentContracts     StudentContract[]\n  collaboratorContract CollaboratorContract?\n  auditLogs',
                  f'{path}: collaborator contract document relation',
              )
              source = replace_once(
                  source,
                  '  @@index([alunoId])\n  @@index([templateId])',
                  '  @@index([alunoId])\n  @@index([collaboratorId])\n  @@index([partyType])\n  @@index([templateId])',
                  f'{path}: typed contract indexes',
              )
              student_contract_marker = '''model ContractSignature {'''
              collaborator_model = '''model CollaboratorContract {
  id                 String                     @id @default(cuid())
  collaboratorId     String
  contractId         String?                    @unique
  status             CollaboratorContractStatus @default(draft)
  origin             ContractLinkOrigin         @default(ELECTRONIC)
  startDate          DateTime?
  endDate            DateTime?
  signedAt           DateTime?
  canceledAt         DateTime?
  cancellationReason String?
  notes              String?
  legacyDocumentUrl  String?
  legacySourceKey    String?                    @unique
  createdAt          DateTime                   @default(now())
  updatedAt          DateTime                   @updatedAt

  collaborator       Professor                  @relation("CollaboratorContracts", fields: [collaboratorId], references: [id], onDelete: Restrict)
  contract           Contract?                  @relation(fields: [contractId], references: [id], onDelete: Cascade)
  currentForProfessor Professor?                 @relation("CurrentCollaboratorContract")

  @@index([collaboratorId])
  @@index([status])
  @@index([startDate])
  @@index([endDate])
}

'''
              if 'model CollaboratorContract {' not in source:
                  source = replace_once(
                      source,
                      student_contract_marker,
                      collaborator_model + student_contract_marker,
                      f'{path}: collaborator contract model',
                  )
              enum_marker = 'enum ContractStatus {'
              new_enums = '''enum ContractPartyType {
  STUDENT
  COLLABORATOR
}

enum ContractTemplateApplicability {
  STUDENT
  COLLABORATOR
  BOTH
}

enum ContractLinkOrigin {
  ELECTRONIC
  LEGACY_PDF
  LEGACY_DECLARATION
}

enum CollaboratorContractStatus {
  draft
  pending_signature
  active
  expired
  canceled
  terminated
  legacy
}

'''
              if 'enum ContractPartyType {' not in source:
                  source = replace_once(
                      source,
                      enum_marker,
                      new_enums + enum_marker,
                      f'{path}: contract enums',
                  )
              Path(path).write_text(source)

          for schema in ('apps/api/prisma/schema.prisma', 'prisma/schema.prisma'):
              patch_schema(schema)

          if Path('apps/api/prisma/schema.prisma').read_text() != Path('prisma/schema.prisma').read_text():
              raise RuntimeError('Canonical Prisma schemas diverged after synchronization')

          validations_path = Path('packages/utils/validations.ts')
          validations = validations_path.read_text()
          validations, first = re.subn(r'^\s*hasSignedContract:\s*z\.boolean\(\)\.optional\(\),\n', '', validations, count=1, flags=re.MULTILINE)
          validations, second = re.subn(r'^\s*signedContractDocumentUrl:\s*optionalString\(500\),\n', '', validations, count=1, flags=re.MULTILINE)
          if first != 1 or second != 1:
              raise RuntimeError(f'Legacy validation fields not found exactly once: {first}, {second}')
          validations_path.write_text(validations)

          access_path = Path('packages/types/access-control.ts')
          access = access_path.read_text()
          access, count = re.subn(
              r"(key:\s*'collaborators\.actions\.uploadSignedContract',\s*\n\s*label:\s*)'[^']*'(,\s*\n\s*description:\s*)'[^']*'",
              r"\1'Gerenciar contrato'\2'Permite criar, revisar, enviar, cancelar e colocar em vigor contratos do colaborador.'",
              access,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Collaborator contract permission catalog entry not found exactly once')
          access_path.write_text(access)

          routes_path = Path('apps/api/src/modules/professores/professor.routes.ts')
          routes = routes_path.read_text()
          guard = '''router.post('/signed-contract-upload', (_req, res) =>
            sendError(
              res,
              'O upload legado foi desativado. Use o controle contratual na edição do colaborador.',
              410
            )
          );

          '''
          target = "router.post(\n  '/signed-contract-upload',\n  uploadSignedContract.single('file'),"
          if guard.strip() not in routes:
              routes = replace_once(routes, target, guard + target, 'professor legacy upload guard')
          routes_path.write_text(routes)

          test_path = Path('apps/api/tests/professor.routes.test.ts')
          tests = test_path.read_text()
          pattern = re.compile(
              r"\n\s*it\('faz upload de contrato assinado e rejeita formato inválido'.*?\n\s*}\);(?=\n\s*it\(|\n}\);)",
              re.DOTALL,
          )
          replacement = '''
            it('bloqueia o upload legado de contrato assinado', async () => {
              const response = await request(app)
                .post('/signed-contract-upload')
                .attach('file', Buffer.from('fake-pdf'), 'contract.pdf');

              expect(response.status).toBe(410);
              expect(response.body.error).toContain('upload legado foi desativado');
              expect(professorService.uploadSignedContract).not.toHaveBeenCalled();
            });'''
          tests, count = pattern.subn(replacement, tests, count=1)
          if count != 1:
              raise RuntimeError('Legacy professor upload test block not found exactly once')
          test_path.write_text(tests)

          Path('.github/issue-263-sync-complete').write_text('completed\n')
          PY

      - name: Validate synchronized Prisma schemas
        if: steps.marker.outputs.done == 'false'
        run: |
          corepack enable
          corepack prepare pnpm@10.6.4 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @corrida/api exec prisma validate --schema prisma/schema.prisma
          pnpm prisma:check
          pnpm type-check

      - name: Commit synchronized files
        if: steps.marker.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/prisma/schema.prisma \
            prisma/schema.prisma \
            packages/utils/validations.ts \
            packages/types/access-control.ts \
            apps/api/src/modules/professores/professor.routes.ts \
            apps/api/tests/professor.routes.test.ts \
            .github/issue-263-sync-complete
          git commit -m "fix: synchronize issue 263 contract schema and legacy guards"
          git push origin HEAD:${{ github.head_ref }}
