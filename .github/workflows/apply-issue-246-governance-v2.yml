name: Apply Issue 246 Governance Delta v2

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/issue-246/transport.part-*
      - .github/issue-246/compat.py
      - .github/issue-246/profile-contract-compat.py
      - .github/issue-246/canonical-guedes-compat.py
      - .github/issue-246/structured-maturation-compat.py
      - .github/issue-246/boundary-approval-compat.py
      - .github/issue-246/boundary-assertion-cast-compat.py
      - .github/workflows/apply-issue-246-governance-v2.yml

permissions:
  contents: write

concurrency:
  group: issue-246-governance-delta-v2
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      PRISMA_CONNECTION_LIMIT: '1'
      PRISMA_POOL_TIMEOUT_SECONDS: '30'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/246-adipometry-foundation
          fetch-depth: 0

      - name: Reconstruct and apply verified delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-246/transport.part-* > /tmp/issue246transport.tar.xz.b64
          test "$(sha256sum /tmp/issue246transport.tar.xz.b64 | cut -d' ' -f1)" = "9276004934e04d4edb9a2d0c5dad7c5fcabcd35df91913c9697fca310a665c76"
          base64 --decode /tmp/issue246transport.tar.xz.b64 > /tmp/issue246transport.tar.xz
          test "$(sha256sum /tmp/issue246transport.tar.xz | cut -d' ' -f1)" = "37927df6844309388321025468a40ce36b981a53868f51c479968b5b692a118e"
          rm -rf /tmp/issue246transport
          mkdir -p /tmp/issue246transport
          tar -xJf /tmp/issue246transport.tar.xz -C /tmp/issue246transport
          python -m py_compile .github/issue-246/compat.py .github/issue-246/profile-contract-compat.py .github/issue-246/canonical-guedes-compat.py .github/issue-246/structured-maturation-compat.py .github/issue-246/boundary-approval-compat.py .github/issue-246/boundary-assertion-cast-compat.py /tmp/issue246transport/apply.py
          python .github/issue-246/compat.py
          python .github/issue-246/profile-contract-compat.py
          python .github/issue-246/canonical-guedes-compat.py
          python .github/issue-246/structured-maturation-compat.py
          python .github/issue-246/boundary-approval-compat.py
          cp -a /tmp/issue246transport/apps /tmp/issue246transport/packages /tmp/issue246transport/docs /tmp/issue246transport/scripts .
          cp /tmp/issue246transport/apply.py .github/issue-246/apply.py
          python .github/issue-246/apply.py
          python .github/issue-246/boundary-assertion-cast-compat.py
          sed -i "/from 'vitest';/d" apps/api/src/modules/adipometry/adipometry-governance.test.ts
          ! grep -q "from 'vitest'" apps/api/src/modules/adipometry/adipometry-governance.test.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and generate Prisma client
        run: |
          pnpm --filter @corrida/api exec prisma format
          pnpm --filter @corrida/api exec prisma generate

      - name: Verify migration paths
        run: |
          bash scripts/verify-adipometry-migration-existing-data.sh
          bash scripts/verify-adipometry-migration-full-chain.sh

      - name: Apply migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Verify adipometry persistence and governance
        run: |
          bash scripts/verify-adipometry-foundation.sh
          bash scripts/verify-adipometry-audit-remediation.sh
          bash scripts/verify-adipometry-persistence-boundaries.sh
          GOVERNANCE_DATABASE_URL="${DATABASE_URL%%\?*}"
          DATABASE_URL="$GOVERNANCE_DATABASE_URL" bash scripts/verify-adipometry-clinical-governance.sh

      - name: Validate repository
        run: |
          pnpm type-check
          pnpm lint
          pnpm test
          pnpm build
          pnpm arch:check
          pnpm access:check
          pnpm docs:check

      - name: Commit validated delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue-246/apply.py
          git rm -f .github/issue-246/apply-governance.py.gz.b64
          git rm -f .github/issue-246/transport.part-*
          git rm -f .github/issue-246/compat.py
          git rm -f .github/issue-246/profile-contract-compat.py
          git rm -f .github/issue-246/canonical-guedes-compat.py
          git rm -f .github/issue-246/structured-maturation-compat.py
          git rm -f .github/issue-246/boundary-approval-compat.py
          git rm -f .github/issue-246/boundary-assertion-cast-compat.py
          git rm -f .github/workflows/apply-issue-246-governance.yml
          git rm -f .github/workflows/apply-issue-246-governance-v2.yml
          rmdir .github/issue-246 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(adipometry): add contract clinical governance"
          git push origin HEAD:feat/246-adipometry-foundation
