name: Issue 136 rebase onto develop

on:
  pull_request:
    branches:
      - fix/136-capacity-prescription-persistence
    paths:
      - .github/issue-136-rebase-trigger

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout technical trigger branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebase trigger branch onto current develop
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          set +e
          git rebase origin/develop 2>&1 | tee rebase.log
          rebase_status=${PIPESTATUS[0]}
          set -e
          if [ "$rebase_status" -ne 0 ]; then
            echo "::error::Rebase conflicts detected"
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            echo "Repository status:"
            git status --short
            git rebase --abort
            exit "$rebase_status"
          fi
          git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload rebase diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-136-rebase-${{ github.run_id }}
          path: rebase.log
          if-no-files-found: warn
          retention-days: 7
