name: Issue 136 rebase onto develop

on:
  push:
    branches:
      - fix/136-capacity-prescription-persistence
    paths:
      - .github/workflows/issue-136-rebase.yml

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/136-capacity-prescription-persistence
          fetch-depth: 0

      - name: Rebase onto current develop
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          set +e
          git rebase origin/develop 2>&1 | tee rebase.log
          rebase_status=${PIPESTATUS[0]}
          set -e
          if [ "$rebase_status" -ne 0 ]; then
            echo "::error::Rebase conflicts detected"
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            echo "Repository status:"
            git status --short
            git rebase --abort
            exit "$rebase_status"
          fi
          git push --force-with-lease origin HEAD:fix/136-capacity-prescription-persistence
