name: Apply Issue 246 Remediation

on:
  push:
    branches:
      - feat/246-adipometry-foundation

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[issue246-remediation-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/246-adipometry-foundation

      - name: Reassemble verified remediation package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/issue246-remediation.tar.gz
          : > "$package"
          for sha in \
            22d296c1ce5a280ae7c4d1dec9541f8514e3d9f4 \
            a59095cc2d2887186d7478bc602ef454fa8e39ad \
            ab70fce4c8b9bb3c30de85985e96e8f37a278030 \
            0f8cce2172f18ecd6ea6f2fd2ff62da6f2a11245 \
            c1147a58faa3b5da0127122b724db76892f194a9 \
            f1d0eb602bd4e600f046f44c168890873c7a203c
          do
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq --raw-output '.content' \
              | tr -d '\n' \
              | base64 --decode >> "$package"
          done
          echo "53baa962860623bf6de9deb78b3b0108594f99d05bb43b6002a49fce374e77c8  $package" | sha256sum --check --strict
          tar --extract --gzip --file "$package" --directory "$GITHUB_WORKSPACE"

      - name: Commit remediation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-issue-246-worktree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(adpt): harden issue 246 foundation [issue246-remediation-applied]"
          git push origin HEAD:feat/246-adipometry-foundation
