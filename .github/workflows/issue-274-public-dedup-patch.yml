name: Patch Issue 274 Public Deduplication

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch atomic public save
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/pre-registration-public/pre-registration-public-atomic.service.ts')
          lines = path.read_text().splitlines()
          import_line = "import { detectPreRegistrationDuplicates } from '../pre-registration-enrollment/pre-registration-enrollment.service.js';"
          if import_line not in lines:
            index = next(i for i, line in enumerate(lines) if line.startswith("import { PreRegistrationPublicError }"))
            lines.insert(index, import_line)

          marker = '        access = await startAuthorizedPreRegistrationInTransaction(tx, access, userId);'
          insertion = [
            '',
            "        if (input.step === 'IDENTIFICATION' || input.step === 'CONTACT') {",
            '          const detection = await detectPreRegistrationDuplicates(tx, {',
            '            contractId: access.contractId,',
            '            alunoId: access.alunoId,',
            '            overrides: input.data,',
            '          });',
            '          if (',
            "            detection.classification === 'BLOCKING' ||",
            "            detection.classification === 'REVIEW_REQUIRED'",
            '          ) {',
            '            throw new PreRegistrationPublicError(',
            "              'Seus dados precisam de revisão pela academia antes de continuar.',",
            "              'DUPLICATE_REVIEW_REQUIRED',",
            '              { reviewRequired: true }',
            '            );',
            '          }',
            '        }',
          ]
          sentinel = 'const detection = await detectPreRegistrationDuplicates(tx, {'
          if not any(sentinel in line for line in lines):
            index = lines.index(marker) + 1
            lines[index:index] = insertion

          text = '\n'.join(lines) + '\n'
          if text.count(import_line) != 1 or text.count(sentinel) != 1:
            raise SystemExit('public deduplication patch was not applied exactly once')
          path.write_text(text)
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-274-public-dedup-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/pre-registration-public/pre-registration-public-atomic.service.ts
          git commit -m "fix(api): run canonical dedup before public identity saves (#274)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
