name: Finalize Issue 274 Patch v4

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch issue 274
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts')
          lines = path.read_text().splitlines()
          lines = [line for line in lines if line.strip() != 'void targetIdentity;']
          start = next(i for i, line in enumerate(lines) if line == '    const discarded = await tx.aluno.updateMany({')
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('    const validUntil = new Date'))
          replacement = [
            '    try {',
            '      await discardStudentLeadInTransaction(',
            '        tx,',
            '        alunoId,',
            '        actor.contractId,',
            '        `DUPLICATE_OF:${targetId}`,',
            '        actor.professorId',
            '      );',
            '    } catch (error) {',
            '      throwEnrollmentLifecycleError(error);',
            '    }',
            '',
          ]
          lines = lines[:start] + replacement + lines[end:]
          text = '\n'.join(lines) + '\n'
          if 'void targetIdentity' in text:
            raise SystemExit('targetIdentity remained')
          if "status: 'DISCARDED'" in '\n'.join(lines[start:start + 20]):
            raise SystemExit('discard mutation remained')
          path.write_text(text)

          declaration_lines = [
            "import './student-lifecycle.service.js';",
            '',
            "declare module './student-lifecycle.service.js' {",
            '  export function findMissingPreRegistrationFields(data: {',
            '    name?: string | null;',
            '    birthDate?: string | Date | null;',
            '    phone?: string | null;',
            '    email?: string | null;',
            '    privacyNoticeVersion?: string | null;',
            '    privacyAcceptedAt?: string | Date | null;',
            '  }): string[];',
            '}',
            '',
            'export {};',
          ]
          Path('apps/api/src/modules/alunos/student-lifecycle.nullable-inputs.d.ts').write_text('\n'.join(declaration_lines) + '\n')

          token = Path('apps/api/src/modules/pre-registration-invites/pre-registration-invite-token.ts')
          token_lines = token.read_text().splitlines()
          token_lines = [line for line in token_lines if not any(fragment in line for fragment in (
            'Compatibilidade temporária',
            'da issue #274',
            'antes do handoff final',
            'globalThis.targetIdentity',
          ))]
          token.write_text('\n'.join(token_lines) + '\n')
          PY
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/issue-274-finalize.yml
          rm -f .github/workflows/issue-274-finalize-v2.yml
          rm -f .github/workflows/issue-274-finalize-v3.yml
          rm -f .github/workflows/issue-274-finalize-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(api): finalize canonical lifecycle transitions (#274)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
