name: Trigger Issue 271 Remediation

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-271-trigger.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply audited remediation patch
    if: github.head_ref == 'feat/271-public-pre-registration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Reassemble and validate remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-271-patch/part-*.txt > /tmp/issue-271.patch.gz.b64
          echo '26246a98e3fec0ef0fedaa48363ae752e07b57555785dd0ec950740068d0d7d3  /tmp/issue-271.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/issue-271.patch.gz.b64 | gzip --decompress > /tmp/issue-271.patch
          echo '2879fcc37cc17294093952f42f270b349f348fd1de7d82e2fe1e93ea00a96de8  /tmp/issue-271.patch' | sha256sum --check --strict
          git apply --check /tmp/issue-271.patch

      - name: Apply and publish remediation
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/issue-271.patch
          rm -rf .github/issue-271-patch
          rm -f .github/workflows/apply-issue-271-remediation.yml
          rm -f .github/workflows/apply-issue-271-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require independent guardian approval for issue 271'
          git push origin HEAD:feat/271-public-pre-registration
