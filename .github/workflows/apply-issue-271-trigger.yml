name: Trigger Issue 271 Remediation

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-271-trigger.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply audited remediation patch
    if: github.head_ref == 'feat/271-public-pre-registration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/<<'PATCH'/,/^PATCH$/p" .github/workflows/apply-issue-271-remediation.yml | sed '1d;$d' > /tmp/issue-271.patch.gz.b64
          base64 --decode /tmp/issue-271.patch.gz.b64 | gzip --decompress > /tmp/issue-271.patch
          git apply /tmp/issue-271.patch
          rm -f .github/workflows/apply-issue-271-remediation.yml
          rm -f .github/workflows/apply-issue-271-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require independent guardian approval for issue 271'
          git push origin HEAD:${{ github.head_ref }}
