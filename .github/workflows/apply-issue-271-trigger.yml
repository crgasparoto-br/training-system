name: Trigger Issue 271 Remediation

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-271-trigger.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply audited remediation patch
    if: github.head_ref == 'feat/271-public-pre-registration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Decode remediation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          workflow = Path('.github/workflows/apply-issue-271-remediation.yml').read_text()
          marker = "<<'PATCH'\n"
          if marker not in workflow or '\nPATCH\n' not in workflow:
              raise SystemExit('embedded patch markers not found')
          payload = workflow.split(marker, 1)[1].split('\nPATCH\n', 1)[0].strip()
          compressed = base64.b64decode(payload, validate=True)
          patch = gzip.decompress(compressed)
          Path('/tmp/issue-271.patch').write_bytes(patch)
          print(f'decoded remediation patch: {len(patch)} bytes')
          PY

      - name: Verify and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/issue-271.patch
          git apply /tmp/issue-271.patch
          rm -f .github/workflows/apply-issue-271-remediation.yml
          rm -f .github/workflows/apply-issue-271-trigger.yml
          git status --short

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require independent guardian approval for issue 271'
          git push origin HEAD:feat/271-public-pre-registration
