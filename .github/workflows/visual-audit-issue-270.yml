name: Visual Audit Issue 270

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Final clean audit of issue 270 responsive states
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ''
      VITE_PRE_REGISTRATION_ENABLED: 'true'
      ISSUE_270_VISUAL_REVIEW_FIXTURE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Build web application
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build

      - name: Audit routes, states and interactions
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec node \
            --import ./scripts/visual-audit-pre-registration-availability-hook.mjs \
            scripts/visual-audit-issue-270.mjs 2>&1 | tee visual-audit.log

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-270-visual-${{ github.run_id }}
          path: |
            artifacts/issue-270-visual/*.png
            visual-audit.log
          if-no-files-found: warn
          retention-days: 14
