name: Visual Audit Issue 270

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.issue-270-corrections/**'
      - 'apps/web/src/pages/PreRegistrationAdmin/**'
      - 'apps/web/src/services/pre-registration-admin.service.ts'
      - 'packages/types/pre-registration-admin.ts'
      - 'apps/api/scripts/visual-audit-issue-270.mjs'
      - '.github/workflows/visual-audit-issue-270.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Apply corrections and capture routes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/270-pre-registration-admin
          fetch-depth: 0

      - name: Apply correction package
        shell: bash
        run: |
          set -euo pipefail
          cat .issue-270-corrections/part* | base64 --decode > /tmp/issue-270-corrections.tgz
          tar -xzf /tmp/issue-270-corrections.tgz -C .
          rm -rf .issue-270-corrections
          rm -f .github/workflows/apply-issue-270-corrections.yml
          rm -f .github/workflows/export-issue-270-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve audit findings for issue 270'
          git push origin HEAD:feat/270-pre-registration-admin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build

      - name: Capture routes
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec node scripts/visual-audit-issue-270.mjs 2>&1 | tee visual-audit.log

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-270-visual-${{ github.run_id }}
          path: |
            artifacts/issue-270-visual/*.png
            visual-audit.log
          if-no-files-found: warn
          retention-days: 14
