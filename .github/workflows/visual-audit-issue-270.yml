name: Visual Audit Issue 270

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/src/pages/PreRegistrationAdmin/**'
      - 'apps/web/src/services/pre-registration-admin.service.ts'
      - 'packages/types/pre-registration-admin.ts'
      - 'apps/api/scripts/visual-audit-issue-270.mjs'
      - '.github/workflows/visual-audit-issue-270.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Fix list width and audit interface states
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/270-pre-registration-admin
          fetch-depth: 0

      - name: Apply responsive table correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/PreRegistrationAdmin/PreRegistrationAdminList.tsx')
          s = p.read_text()
          s = s.replace('      <Card>\n        <CardHeader className="pb-4">\n          <div className="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">\n            <div>\n              <CardTitle className="text-lg">Registros</CardTitle>', '      <Card className="min-w-0">\n        <CardHeader className="pb-4">\n          <div className="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">\n            <div>\n              <CardTitle className="text-lg">Registros</CardTitle>')
          marker = '      <Card className="min-w-0">'
          before, after = s.split(marker, 1)
          after = after.replace('        <CardContent>\n          {loading ? (', '        <CardContent className="min-w-0">\n          {loading ? (', 1)
          s = before + marker + after
          s = s.replace('<div className="hidden overflow-x-auto md:block">\n                <table className="w-full min-w-[1120px] text-left text-sm">', '<div className="hidden w-full min-w-0 max-w-full overflow-x-auto md:block">\n                <table className="w-full table-fixed text-left text-sm">')
          s = s.replace('''                      <th className="px-3 py-3">Pessoa</th>
                      <th className="px-3 py-3">Etapa e convite</th>
                      <th className="px-3 py-3">Progresso</th>
                      <th className="px-3 py-3">Origem</th>
                      <th className="px-3 py-3">Responsável</th>
                      <th className="px-3 py-3">Última atividade</th>
                      <th className="px-3 py-3">Próxima ação</th>
                      <th className="w-12 px-3 py-3">''', '''                      <th className="w-[23%] px-3 py-3">Pessoa</th>
                      <th className="w-[15%] px-3 py-3">Etapa e convite</th>
                      <th className="w-[14%] px-3 py-3">Progresso</th>
                      <th className="w-[14%] px-3 py-3">Responsável</th>
                      <th className="w-[13%] px-3 py-3">Última atividade</th>
                      <th className="w-[17%] px-3 py-3">Próxima ação</th>
                      <th className="w-[4%] px-2 py-3">''')
          s = s.replace('''                        <td className="px-3 py-3">
                          <Link
                            className="font-medium text-foreground hover:text-primary"''', '''                        <td className="min-w-0 px-3 py-3 align-top">
                          <Link
                            className="block truncate font-medium text-foreground hover:text-primary"''')
          s = s.replace('''                          <p className="mt-0.5 max-w-xs truncate text-xs text-muted-foreground">
                            {contactLine(lead)}
                          </p>
                          {lead.contacts.masked && (''', '''                          <p className="mt-0.5 truncate text-xs text-muted-foreground">
                            {contactLine(lead)}
                          </p>
                          <p className="mt-1 truncate text-[11px] text-muted-foreground">
                            Origem: {lead.origin}
                          </p>
                          {lead.contacts.masked && (''')
          s = s.replace('<td className="px-3 py-3 text-muted-foreground">{lead.origin}</td>\n                        <td className="px-3 py-3 text-muted-foreground">', '<td className="px-3 py-3 align-top text-muted-foreground">')
          s = s.replace('<td className="px-3 py-3 text-muted-foreground">\n                          {formatDate(lead.lastActivityAt)}', '<td className="px-3 py-3 align-top text-muted-foreground">\n                          {formatDate(lead.lastActivityAt)}')
          s = s.replace('<td className="px-3 py-3">\n                          <span className="font-medium text-foreground">', '<td className="min-w-0 px-3 py-3 align-top">\n                          <span className="block font-medium text-foreground">')
          s = s.replace('<p className="mt-0.5 max-w-xs text-xs text-muted-foreground">', '<p className="mt-0.5 line-clamp-3 text-xs text-muted-foreground">')
          s = s.replace('<td className="px-3 py-3">\n                          <Link', '<td className="px-2 py-3 align-top">\n                          <Link')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/PreRegistrationAdmin/PreRegistrationAdminList.tsx
          git diff --cached --check
          git commit -m 'fix: prevent pre-registration list overflow'
          git push origin HEAD:feat/270-pre-registration-admin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Build web application
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build

      - name: Audit routes, states and interactions
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec node scripts/visual-audit-issue-270.mjs 2>&1 | tee visual-audit.log

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-270-visual-${{ github.run_id }}
          path: |
            artifacts/issue-270-visual/*.png
            visual-audit.log
          if-no-files-found: warn
          retention-days: 14
