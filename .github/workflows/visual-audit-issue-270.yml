name: Visual Audit Issue 270

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/src/pages/PreRegistrationAdmin/**'
      - 'apps/web/src/pages/PreRegistrationAvailabilityBoundary*'
      - 'apps/web/src/layouts/DashboardLayout.tsx'
      - 'apps/web/src/services/pre-registration-admin.service.ts'
      - 'packages/types/pre-registration-admin.ts'
      - 'apps/api/scripts/visual-audit-issue-270.mjs'
      - '.github/workflows/visual-audit-issue-270.yml'
  workflow_dispatch:

jobs:
  screenshots:
    name: Final clean audit of issue 270 responsive states
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://127.0.0.1:3002
      VITE_PRE_REGISTRATION_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Build web application
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build

      - name: Start enrollment review compatibility mock
        shell: bash
        run: |
          cat > /tmp/issue-270-api-mock.mjs <<'EOF'
          import { createServer } from 'node:http';

          const review = {
            alunoId: 'lead-1',
            status: 'READY_FOR_ENROLLMENT',
            recordVersion: 1,
            fingerprint: 'issue-270-visual-fingerprint',
            classification: 'NONE',
            candidates: [],
            restrictedCandidateCount: 0,
            canConfirmDifferentPeople: false,
            canUseExistingCanonical: false,
            canMarkReady: false,
            canConfirmEnrollment: true,
            health: {
              healthModuleStatus: 'COMPLETED',
              parqModuleStatus: 'COMPLETED',
              parqRequiresProfessionalReview: true,
            },
            downstream: {
              contract: 'NOT_CONFIGURED',
              plan: 'NOT_CONFIGURED',
              billing: 'NOT_CONFIGURED',
              responsibleProfessor: 'NOT_CONFIGURED',
              schedule: 'NOT_CONFIGURED',
            },
          };

          const adminUser = {
            id: 'admin-user-270',
            email: 'admin-270@example.test',
            name: 'Gestor Visual 270',
            type: 'professor',
            profile: { name: 'Gestor Visual 270' },
            accessControl: { isMaster: true, permissions: [] },
          };

          function corsHeaders(request) {
            return {
              'access-control-allow-origin': request.headers.origin || 'http://127.0.0.1:4173',
              'access-control-allow-methods': 'GET,POST,PATCH,OPTIONS',
              'access-control-allow-headers': 'Authorization,Content-Type',
              'access-control-allow-credentials': 'true',
              'vary': 'Origin',
            };
          }

          createServer((request, response) => {
            const cors = corsHeaders(request);
            if (request.method === 'OPTIONS') {
              response.writeHead(204, cors);
              response.end();
              return;
            }
            if (
              request.method === 'GET' &&
              request.url === '/api/v1/pre-registration/availability'
            ) {
              response.writeHead(204, { ...cors, 'cache-control': 'no-store' });
              response.end();
              return;
            }
            if (request.method === 'GET' && request.url === '/api/v1/auth/me') {
              response.writeHead(200, { ...cors, 'content-type': 'application/json' });
              response.end(JSON.stringify({ success: true, data: adminUser }));
              return;
            }
            if (
              request.method === 'GET' &&
              request.url === '/api/v1/pre-registration-admin/leads/lead-1/enrollment-review'
            ) {
              response.writeHead(200, { ...cors, 'content-type': 'application/json' });
              response.end(JSON.stringify({ success: true, data: review }));
              return;
            }
            response.writeHead(404, { ...cors, 'content-type': 'application/json' });
            response.end(JSON.stringify({ success: false, error: 'Not mocked' }));
          }).listen(3002, '127.0.0.1');
          EOF
          node /tmp/issue-270-api-mock.mjs > /tmp/issue-270-api-mock.log 2>&1 &
          echo $! > /tmp/issue-270-api-mock.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3002/api/v1/pre-registration-admin/leads/lead-1/enrollment-review \
              > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/issue-270-api-mock.log
          exit 1

      - name: Audit routes, states and interactions
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec node scripts/visual-audit-issue-270.mjs 2>&1 | tee visual-audit.log

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-270-visual-${{ github.run_id }}
          path: |
            artifacts/issue-270-visual/*.png
            visual-audit.log
            /tmp/issue-270-api-mock.log
          if-no-files-found: warn
          retention-days: 14
