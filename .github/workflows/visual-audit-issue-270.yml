name: Visual Audit Issue 270

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/src/pages/PreRegistrationAdmin/**'
      - 'apps/web/src/layouts/DashboardLayout.tsx'
      - 'apps/web/src/services/pre-registration-admin.service.ts'
      - 'packages/types/pre-registration-admin.ts'
      - 'apps/api/scripts/visual-audit-issue-270.mjs'
      - '.github/workflows/visual-audit-issue-270.yml'
  workflow_dispatch:

jobs:
  screenshots:
    name: Diagnose issue 270 mobile overflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Build web application
        run: |
          pnpm --filter @corrida/types build
          pnpm --filter @corrida/utils build
          pnpm --filter @corrida/web build

      - name: Instrument overflow diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/scripts/visual-audit-issue-270.mjs')
          s = p.read_text()
          needle = "  const overflow = await page.evaluate(() => ({\n"
          replacement = """  const offenders = await page.evaluate(() =>
    Array.from(document.querySelectorAll('*'))
      .map((element) => {
        const rect = element.getBoundingClientRect();
        return {
          tag: element.tagName,
          className: typeof element.className === 'string' ? element.className : '',
          left: Math.round(rect.left),
          right: Math.round(rect.right),
          width: Math.round(rect.width),
          scrollWidth: element.scrollWidth,
          text: (element.textContent || '').trim().slice(0, 80),
        };
      })
      .filter((item) => item.right > window.innerWidth + 1 || item.left < -1)
      .sort((a, b) => Math.max(b.right - window.innerWidth, -b.left) - Math.max(a.right - window.innerWidth, -a.left))
      .slice(0, 20)
  );
  await page.screenshot({
    path: path.join(outputDir, `${name}-diagnostico.png`),
    fullPage: true,
  });
  const overflow = await page.evaluate(() => ({
"""
          if needle not in s:
              raise SystemExit('Overflow marker not found')
          s = s.replace(needle, replacement, 1)
          s = s.replace(
              "`${name}: overflow horizontal (${overflow.scrollWidth}px > ${overflow.width}px)`",
              "`${name}: overflow horizontal (${overflow.scrollWidth}px > ${overflow.width}px); offenders=${JSON.stringify(offenders)}`",
              1,
          )
          p.write_text(s)
          PY

      - name: Audit routes, states and interactions
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @corrida/api exec node scripts/visual-audit-issue-270.mjs 2>&1 | tee visual-audit.log

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-270-visual-${{ github.run_id }}
          path: |
            artifacts/issue-270-visual/*.png
            visual-audit.log
          if-no-files-found: warn
          retention-days: 14
