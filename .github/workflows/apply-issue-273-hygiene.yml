name: Apply Issue 273 Hygiene

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-issue-273-hygiene.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified hygiene patch
        run: |
          set -euo pipefail
          base64 --decode .issue273/hygiene.patch.gz.b64 > /tmp/issue273-hygiene.patch.gz
          gzip --test /tmp/issue273-hygiene.patch.gz
          gunzip --stdout /tmp/issue273-hygiene.patch.gz > /tmp/issue273-hygiene.patch
          patch --dry-run -p1 --forward --batch < /tmp/issue273-hygiene.patch
          patch -p1 --forward --batch < /tmp/issue273-hygiene.patch

      - name: Remove transport-only files and commit
        run: |
          rm -rf .issue273
          rm -f .github/workflows/apply-issue-273-hygiene.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove obsolete legacy PAR-Q editor (#273)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
