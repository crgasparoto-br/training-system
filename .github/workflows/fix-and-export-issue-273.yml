name: Fix and Export Issue 273

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/fix-and-export-issue-273.yml'

permissions:
  contents: write

jobs:
  fix-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix PostgreSQL JSON object counts and pre-cutover fixture loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          migration_paths = [
              Path('apps/api/prisma/migrations/20260725201000_issue_273_canonical_parq/migration.sql'),
              Path('prisma/migrations/20260725201000_issue_273_canonical_parq/migration.sql'),
          ]
          pattern = re.compile(r'jsonb_object_length\(([^\n]+?)\) = (\d+)')
          for path in migration_paths:
              content = path.read_text()
              content, count = pattern.subn(r'(SELECT COUNT(*) FROM jsonb_object_keys(\1)) = \2', content)
              if count != 4:
                  raise SystemExit(f'{path}: expected 4 jsonb_object_length replacements, got {count}')
              path.write_text(content)

          script = Path('scripts/verify-issue-273-parq-migration.sh')
          content = script.read_text()
          marker = 'psql_admin_stdin "$DB_NAME" <<\'SQL\'\nINSERT INTO "Contract"'
          replacement = 'psql_admin_stdin "$DB_NAME" <<\'SQL\'\nSET session_replication_role = replica;\n\nINSERT INTO "Contract"'
          if marker not in content:
              raise SystemExit('fixture heredoc marker not found')
          content = content.replace(marker, replacement, 1)
          end_marker = "  ('existing-legacy-eight', 'issue-273-canonical-legacy', 'issue-273-contract', 'student', '2026-06-20', '{\"q1\":false,\"q2\":true,\"q3\":false,\"q4\":false,\"q5\":false,\"q6\":false,\"q7\":false,\"q8\":true}'::jsonb, '[{\"key\":\"q2\",\"label\":\"Dor no peito\"}]'::jsonb, true, '2026-06-20', '2026-06-20');\nSQL"
          end_replacement = end_marker[:-3] + '\n\nSET session_replication_role = origin;\nSQL'
          if end_marker not in content:
              raise SystemExit('fixture heredoc end marker not found')
          script.write_text(content.replace(end_marker, end_replacement, 1))
          PY

      - name: Remove transport workflow and commit
        run: |
          rm -f .github/workflows/fix-and-export-issue-273.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make PAR-Q migration PostgreSQL-compatible (#273)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Package clean worktree
        run: |
          tar --exclude='.git' --exclude='node_modules' -czf /tmp/training-system-issue-273.tar.gz .

      - name: Upload clean worktree
        uses: actions/upload-artifact@v4
        with:
          name: training-system-issue-273-${{ github.event.pull_request.head.ref }}
          path: /tmp/training-system-issue-273.tar.gz
          if-no-files-found: error
          retention-days: 1
