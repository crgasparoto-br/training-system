name: Fix issue 247 remediation runner

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix-runner:
    if: github.head_ref == 'feat/247-adipometry-api' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/247-adipometry-api
          fetch-depth: 0

      - name: Correct runner source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/issue-247-remediation-runner.yml')
          text = path.read_text()
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if text.count(old) != 1:
              raise SystemExit('runner helper was not found exactly once')
          text = text.replace(old, new, 1)

          cleanup_anchor = "          Path('.github/workflows/issue-247-remediation-bootstrap-v2.yml').unlink(missing_ok=True)"
          cleanup_extra = "\n".join([
              cleanup_anchor,
              "          Path('.github/workflows/issue-247-runner-fix.yml').unlink(missing_ok=True)",
              "          Path('.github/issue-247-actions-links.md').unlink(missing_ok=True)",
          ])
          if text.count(cleanup_anchor) != 1:
              raise SystemExit('runner cleanup anchor was not found exactly once')
          path.write_text(text.replace(cleanup_anchor, cleanup_extra, 1))
          PY

      - name: Commit corrected runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/issue-247-remediation-runner.yml
          git commit -m 'chore: correct issue 247 remediation runner'
          git push origin HEAD:feat/247-adipometry-api
