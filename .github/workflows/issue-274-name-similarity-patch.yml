name: Patch Issue 274 Name Similarity

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Ignore Portuguese name particles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts')
          text = path.read_text()
          old = """  const leftTokens = new Set(a.split(' ').filter((token) => token.length > 1));
  const rightTokens = new Set(b.split(' ').filter((token) => token.length > 1));"""
          new = """  const insignificantTokens = new Set(['da', 'das', 'de', 'do', 'dos', 'e']);
  const leftTokens = new Set(
    a.split(' ').filter((token) => token.length > 1 && !insignificantTokens.has(token))
  );
  const rightTokens = new Set(
    b.split(' ').filter((token) => token.length > 1 && !insignificantTokens.has(token))
  );"""
          if old not in text:
            raise SystemExit('expected name similarity block not found')
          text = text.replace(old, new, 1)
          if text.count('const insignificantTokens = new Set') != 1:
            raise SystemExit('name similarity patch was not applied exactly once')
          path.write_text(text)
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-274-name-similarity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment.service.ts
          git commit -m "fix(api): ignore Portuguese particles in name similarity (#274)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
