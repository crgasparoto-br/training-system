name: Apply issue 272 type-check fix

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'feat/272-canonical-health-intake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/272-canonical-health-intake
          fetch-depth: 0
      - name: Apply fix and clean temporary assets
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/issue-272/fix.patch.gz.b64 > /tmp/fix.patch.gz
          gzip -dc /tmp/fix.patch.gz > /tmp/fix.patch
          git apply --binary --index /tmp/fix.patch
          rm -rf .github/issue-272
          rm .github/workflows/temporary-issue-272-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve health intake type checks'
          git push origin HEAD:feat/272-canonical-health-intake
