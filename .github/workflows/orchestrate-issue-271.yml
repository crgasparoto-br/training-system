name: Orchestrate Issue 271

on:
  push:
    branches:
      - feat/271-public-pre-registration
    paths:
      - '.github/workflows/orchestrate-issue-271.yml'
      - 'apps/api/prisma/**'
      - 'apps/api/src/modules/pre-registration-public/**'
      - 'apps/api/src/modules/alunos/student-identity.service.ts'
      - 'apps/api/tests/pre-registration-public.integration.test.ts'
      - 'apps/api/scripts/visual-audit-issue-271.mjs'
      - 'apps/web/src/pages/PublicPreRegistration/**'
      - 'apps/web/src/services/pre-registration-public.service.ts'
      - 'packages/types/pre-registration-public.ts'
      - 'packages/utils/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  orchestrate:
    name: Validate, audit and sanitize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply migrations to PostgreSQL
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Validate Prisma schema
        run: pnpm --filter @corrida/api exec prisma validate

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test with database integrations
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Architecture checks
        run: pnpm arch:check

      - name: Access catalog checks
        run: pnpm access:check

      - name: Documentation checks
        run: pnpm docs:check

      - name: Install Chrome for visual audit
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Run responsive visual audit
        run: pnpm --filter @corrida/api exec node scripts/visual-audit-issue-271.mjs

      - name: Hygiene checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/issue271
          test ! -e .github/issue271-bin
          test ! -e .github/workflows/apply-issue-271-final.yml
          test "$(git status --porcelain | wc -l)" = '0'
          ! git grep -nE '<<<<<<<|=======|>>>>>>>' -- ':!pnpm-lock.yaml'

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-271-orchestration-${{ github.run_id }}
          path: artifacts/issue-271-visual/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Record successful orchestration
        if: success()
        shell: bash
        run: |
          gh pr comment 281 --body "## Orquestração concluída — issue #271\n\nCommit validado: \`${GITHUB_SHA}\`\n\n- PostgreSQL e migrations: aprovado\n- Prisma e type-check: aprovado\n- lint e testes: aprovado\n- build e arquitetura: aprovado\n- catálogo de acesso e documentação: aprovado\n- auditoria visual responsiva: aprovada\n- higiene da branch: aprovada\n\nA PR foi marcada como pronta para nova auditoria independente."
          gh pr ready 281

      - name: Record failed orchestration
        if: failure()
        shell: bash
        run: |
          gh pr comment 281 --body "## Orquestração com pendência — issue #271\n\nCommit avaliado: \`${GITHUB_SHA}\`\n\nUm ou mais gates falharam. Consulte a execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A PR permanece em rascunho."
