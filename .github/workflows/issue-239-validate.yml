name: Validate issue 239 implementation

on:
  push:
    branches:
      - fix/239-remove-assessment-from-student-form
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/239-remove-assessment-from-student-form
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Run repository validation
        shell: bash
        run: |
          set +e
          pnpm validate > issue-239-validation.log 2>&1
          echo $? > issue-239-validation.status
          exit 0
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-239-validation-log
          path: issue-239-validation.log
      - name: Enforce validation result
        shell: bash
        run: exit "$(cat issue-239-validation.status)"
