name: Issue 274 Remediation Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment-concurrency.adapter.ts'
      - 'apps/api/tests/pre-registration-enrollment-concurrency.adapter.test.ts'
      - 'apps/web/src/pages/PreRegistrationAdmin/PreRegistrationEnrollmentDetailRemediated.tsx'
      - 'apps/api/scripts/issue-274-remediation-visual-evidence.mjs'
      - '.github/workflows/issue-274-remediation-evidence.yml'
      - '.github/workflows/issue-274-client-capability-remediation.yml'
      - 'docs/quality/issue-274-visual-contract.md'
  push:
    branches:
      - feat/274-enrollment-conversion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediation-evidence:
    name: Validate concurrency and expanded visual states
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Run concurrency adapter tests
        run: pnpm --filter @corrida/api test -- --runInBand tests/pre-registration-enrollment-concurrency.adapter.test.ts

      - name: Type check affected workspaces
        run: |
          pnpm --filter @corrida/api type-check
          pnpm --filter @corrida/web type-check

      - name: Install browser
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Start web application
        shell: bash
        run: |
          pnpm --filter @corrida/web exec vite --host 127.0.0.1 --port 4173 > /tmp/issue-274-remediation-web.log 2>&1 &
          echo $! > /tmp/issue-274-remediation-web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/pre-matriculas/visual-lead > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/issue-274-remediation-web.log
          exit 1

      - name: Capture expanded visual scenarios
        shell: bash
        env:
          ISSUE_274_WEB_URL: http://127.0.0.1:4173
          ISSUE_274_REMEDIATION_OUTPUT: artifacts/issue-274-remediation-visual
          ISSUE_274_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p "$ISSUE_274_REMEDIATION_OUTPUT"
          node apps/api/scripts/issue-274-remediation-visual-evidence.mjs 2>&1 \
            | tee "$ISSUE_274_REMEDIATION_OUTPUT/runner.log"

      - name: Preserve web server log
        if: always()
        run: |
          mkdir -p artifacts/issue-274-remediation-visual
          cp /tmp/issue-274-remediation-web.log artifacts/issue-274-remediation-visual/web-server.log || true

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-274-remediation-evidence-${{ github.run_id }}
          path: artifacts/issue-274-remediation-visual
          if-no-files-found: error
          retention-days: 14

  client-capability-remediation:
    name: Remediate Prisma client capability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/274-enrollment-conversion
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply client capability guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/alunos/student-identity.service.ts')
          text = path.read_text()
          old = '''  const client = options.client;
  await lockStudentIdentityDeduplicationScope(
    client as Prisma.TransactionClient,
    contractId
  );
  const aluno = await client.aluno.findFirst({
'''
          new = '''  const client = options.client;
  if (typeof (client as { $queryRaw?: unknown }).$queryRaw === 'function') {
    await lockStudentIdentityDeduplicationScope(
      client as Prisma.TransactionClient,
      contractId
    );
  }
  const aluno = await client.aluno.findFirst({
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one unconditional lock block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Run mock-client regressions
        run: |
          pnpm --filter @corrida/api test -- --runInBand tests/profile-review.service.test.ts
          pnpm --filter @corrida/api test -- --runInBand tests/aluno-assessment-boundary.service.test.ts

      - name: Run issue 274 adversarial regressions
        run: |
          pnpm --filter @corrida/api test -- --runInBand tests/student-identity-civil-date.test.ts
          RUN_DATABASE_INTEGRATION_TESTS=true pnpm --filter @corrida/api test -- --runInBand tests/issue-274-loop-remediation.integration.test.ts

      - name: Type check API
        run: pnpm --filter @corrida/api type-check

      - name: Publish remediation and restore workflows
        shell: bash
        run: |
          git config user.name "solverit-issue-loop"
          git config user.email "solverit-issue-loop@users.noreply.github.com"
          git show eac904e3d9e79086bdcda05ce6668b7764353989:.github/workflows/issue-274-remediation-evidence.yml > .github/workflows/issue-274-remediation-evidence.yml
          rm -f .github/workflows/issue-274-client-capability-remediation.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(issue-274): compatibilizar lock com clientes simulados"
          git push origin HEAD:feat/274-enrollment-conversion
