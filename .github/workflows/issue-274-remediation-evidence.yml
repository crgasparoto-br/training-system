name: Issue 274 Remediation Evidence

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/src/modules/pre-registration-enrollment/pre-registration-enrollment-concurrency.adapter.ts'
      - 'apps/api/src/modules/pre-registration-enrollment/pre-registration-clinical-ownership.service.ts'
      - 'apps/api/src/modules/pre-registration-enrollment/pre-registration-consolidation-ownership.contract.ts'
      - 'apps/api/prisma/migrations/*issue_274*ownership*/migration.sql'
      - 'apps/api/tests/pre-registration-enrollment-concurrency.adapter.test.ts'
      - 'apps/api/tests/pre-registration-clinical-ownership.contract.test.ts'
      - 'apps/api/tests/pre-registration-clinical-ownership.integration.test.ts'
      - 'apps/api/tests/issue-274-loop-remediation.integration.test.ts'
      - 'apps/api/jest.config.js'
      - 'apps/web/src/pages/PreRegistrationAdmin/PreRegistrationEnrollmentDetailRemediated.tsx'
      - 'apps/api/scripts/issue-274-remediation-visual-evidence.mjs'
      - '.github/workflows/issue-274-remediation-evidence.yml'
      - 'docs/architecture/pre-registration-enrollment.md'
      - 'docs/quality/issue-274-visual-contract.md'
  push:
    branches:
      - feat/274-enrollment-conversion
  workflow_dispatch:

jobs:
  remediation-evidence:
    name: Validate concurrency and expanded visual states
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Run concurrency and ownership contract tests
        run: |
          pnpm --filter @corrida/api test -- --runInBand tests/pre-registration-enrollment-concurrency.adapter.test.ts
          pnpm --filter @corrida/api test -- --runInBand tests/pre-registration-clinical-ownership.contract.test.ts

      - name: Type check affected workspaces
        run: |
          pnpm --filter @corrida/api type-check
          pnpm --filter @corrida/web type-check

      - name: Install browser
        run: pnpm --filter @corrida/api exec puppeteer browsers install chrome

      - name: Start web application
        shell: bash
        run: |
          pnpm --filter @corrida/web exec vite --host 127.0.0.1 --port 4173 > /tmp/issue-274-remediation-web.log 2>&1 &
          echo $! > /tmp/issue-274-remediation-web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/pre-matriculas/visual-lead > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/issue-274-remediation-web.log
          exit 1

      - name: Capture expanded visual scenarios
        shell: bash
        env:
          ISSUE_274_WEB_URL: http://127.0.0.1:4173
          ISSUE_274_REMEDIATION_OUTPUT: artifacts/issue-274-remediation-visual
          ISSUE_274_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p "$ISSUE_274_REMEDIATION_OUTPUT"
          node apps/api/scripts/issue-274-remediation-visual-evidence.mjs 2>&1 \
            | tee "$ISSUE_274_REMEDIATION_OUTPUT/runner.log"

      - name: Preserve web server log
        if: always()
        run: |
          mkdir -p artifacts/issue-274-remediation-visual
          cp /tmp/issue-274-remediation-web.log artifacts/issue-274-remediation-visual/web-server.log || true

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-274-remediation-evidence-${{ github.run_id }}
          path: artifacts/issue-274-remediation-visual
          if-no-files-found: error
          retention-days: 14

  adversarial-postgresql:
    name: Validate atomicity, deduplication and clinical ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_system_test?schema=public&connection_limit=1&pool_timeout=30
      NODE_ENV: test
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      RUN_ISSUE_274_LOOP_INTEGRATION_TESTS: 'true'
      RUN_ISSUE_274_SCALAR_OWNERSHIP_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @corrida/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @corrida/api exec prisma migrate deploy

      - name: Run adversarial PostgreSQL tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/issue-274-loop-integration
          pnpm --filter @corrida/api test -- --runInBand \
            tests/issue-274-loop-remediation.integration.test.ts \
            tests/pre-registration-clinical-ownership.integration.test.ts 2>&1 \
            | tee artifacts/issue-274-loop-integration/test-output.log
          cat > artifacts/issue-274-loop-integration/evidence.json <<EOF_JSON
          {
            "schemaVersion": 1,
            "issue": 274,
            "headSha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "scenarios": [
              "atomic-claim-and-concurrent-deduplication",
              "scalar-clinical-ownership-service-preflight",
              "scalar-clinical-ownership-database-trigger"
            ]
          }
          EOF_JSON

      - name: Upload adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-274-loop-integration-${{ github.run_id }}
          path: artifacts/issue-274-loop-integration
          if-no-files-found: error
          retention-days: 14
