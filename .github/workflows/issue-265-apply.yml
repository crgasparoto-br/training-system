name: Apply issue 265 agenda retry hygiene

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/265-fixed-schedule-student-form'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/265-fixed-schedule-student-form
          fetch-depth: 1
          show-progress: false

      - name: Apply corrections
        run: |
          if ! node scripts/issue-265-apply.mjs > issue-265-agenda-retry.log 2>&1; then
            cat issue-265-agenda-retry.log
            exit 1
          fi
          cat issue-265-agenda-retry.log

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-265-agenda-retry-${{ github.run_id }}
          path: issue-265-agenda-retry.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/Agenda.tsx
          git commit -m "fix(issue-265): report confirmed deactivation failures"
          git push origin HEAD:feat/265-fixed-schedule-student-form
