name: Apply issue 265 final audit corrections

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/265-fixed-schedule-student-form'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/265-fixed-schedule-student-form
          fetch-depth: 1
          show-progress: false

      - name: Apply corrections
        run: node scripts/issue-265-apply.mjs

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/agenda/fixed-schedule.service.ts \
            apps/api/src/modules/agenda/agenda.service.ts \
            apps/api/src/modules/agenda/agenda.routes.ts \
            apps/api/tests/fixed-schedule.service.test.ts \
            apps/web/src/components/alunos/FixedScheduleEditor.tsx \
            apps/web/src/pages/Agenda.tsx \
            apps/web/src/services/agenda.service.ts
          git commit -m "fix(issue-265): close final audit gaps"
          git push origin HEAD:feat/265-fixed-schedule-student-form
