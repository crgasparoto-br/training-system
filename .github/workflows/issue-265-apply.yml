name: Apply issue 265 source patch

on:
  push:
    branches:
      - feat/265-fixed-schedule-student-form
    paths:
      - scripts/issue-265-apply.mjs
      - .github/workflows/issue-265-apply.yml
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/265-fixed-schedule-student-form' || github.ref_name == 'feat/265-fixed-schedule-student-form'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/265-fixed-schedule-student-form
          fetch-depth: 1
          show-progress: false

      - name: Apply audit corrections
        run: node scripts/issue-265-apply.mjs

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/alunos/FixedScheduleEditor.tsx \
            apps/web/src/pages/Agenda.tsx \
            apps/api/src/modules/alunos/aluno.routes.ts
          git commit -m "fix(issue-265): address first audit findings"
          git push origin HEAD:feat/265-fixed-schedule-student-form
