name: Issue 265 lint diagnostics

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-diagnostics:
    if: github.head_ref == 'feat/265-fixed-schedule-student-form'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/265-fixed-schedule-student-form
          fetch-depth: 1
          show-progress: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and capture output
        id: lint
        continue-on-error: true
        run: pnpm lint > issue-265-lint.log 2>&1

      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue-265-lint-${{ github.run_id }}
          path: issue-265-lint.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve lint conclusion
        if: steps.lint.outcome == 'failure'
        run: exit 1
