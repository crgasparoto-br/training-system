name: Apply Issue 271 Corrections

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/visual-audit-issue-271.yml'
      - '.github/issue271/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply audited corrections atomically
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/271-public-pre-registration')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Reconstruct and apply audited source package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue271/part-00 \
              .github/issue271/part-01 \
              .github/issue271/part-02 \
              .github/issue271/part-03 \
              .github/issue271/part-04 > /tmp/issue271-changes.b64
          base64 --decode /tmp/issue271-changes.b64 > /tmp/issue271-changes.tgz
          tar -xzf /tmp/issue271-changes.tgz -C "$GITHUB_WORKSPACE"
          rm -rf .github/issue271

      - name: Commit final corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: resolver pendências auditadas da issue 271'
          git push origin HEAD:feat/271-public-pre-registration
