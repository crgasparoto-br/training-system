name: Apply Issue 246 Professor Control Fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/246-adipometry-foundation

      - name: Apply verified control-evidence fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/issue246-professor-control-fix.tar.gz
          workdir=/tmp/issue246-professor-control-fix
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/9a78360957c7a367d72e8fb69e9c532bc7aa8357" \
            | jq --raw-output '.content' \
            | tr -d '\n' \
            | base64 --decode > "$package"
          echo "6893eb177d7085d9376b1f0e2b72921f1505656aec78ac6de87b657378854403  $package" | sha256sum --check --strict
          mkdir -p "$workdir"
          tar --extract --gzip --file "$package" --directory "$workdir"
          bash "$workdir/apply-issue246-professor-control-fix.sh"

      - name: Commit aligned negative-control evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-adipometry-foundation.sh
          git diff --cached --check
          git commit -m "test(adpt): align professor tenant-control evidence"
          git push origin HEAD:feat/246-adipometry-foundation
