name: Issue 246 Bootstrap

on:
  push:
    branches:
      - feat/246-adipometry-domain-foundation
    paths:
      - '.github/workflows/issue-246-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/246-adipometry-domain-foundation
          fetch-depth: 0

      - name: Extract implementation bundle
        env:
          BUNDLE_BASE64: >-
            
        run: |
          printf '%s' "$BUNDLE_BASE64" | base64 -d > /tmp/issue-246-bundle.tar.gz
          tar -xzf /tmp/issue-246-bundle.tar.gz

      - name: Apply deterministic patch
        run: node scripts/apply-issue-246-foundation.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Prisma schemas
        run: |
          pnpm --filter @corrida/api exec prisma format --schema prisma/schema.prisma
          pnpm --filter @corrida/api exec prisma format --schema ../../prisma/schema.prisma

      - name: Validate generated changes
        run: |
          pnpm type-check
          pnpm arch:check
          pnpm docs:check

      - name: Commit implementation
        run: |
          rm scripts/apply-issue-246-foundation.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'feat(adipometry): add historical domain foundation'
          git push origin HEAD:feat/246-adipometry-domain-foundation
