name: Apply Issue 273 Runtime Verifier Fix

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/issue-273-runtime-verifier-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/273-canonical-parq
          fetch-depth: 1
          show-progress: false

      - name: Patch runtime verifier after concurrent save
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/scripts/verify-issue-273-parq.ts')
          text = path.read_text(encoding='utf-8')
          old = """  assert(concurrent.filter((result) => result.status === 'fulfilled').length === 1, 'exactly one concurrent save must succeed');
          assert(
            concurrent.filter((result) => result.status === 'rejected').length === 1,
            'exactly one concurrent save must conflict'
          );

          const completed = await preRegistrationParqService.complete(ids.studentUser, ids.aluno, {
            catalogVersion: PARQ_CATALOG_VERSION,
            sessionGeneration: first.sessionGeneration,
            expectedVersion: second.version,
            responses: positive,
          """
          new = """  assert(concurrent.filter((result) => result.status === 'fulfilled').length === 1, 'exactly one concurrent save must succeed');
          assert(
            concurrent.filter((result) => result.status === 'rejected').length === 1,
            'exactly one concurrent save must conflict'
          );

          const winningDraft = await preRegistrationParqService.getSession(ids.studentUser, ids.aluno);
          assert(
            winningDraft.version === second.version + 1,
            'concurrent save winner did not advance the optimistic version'
          );

          const completed = await preRegistrationParqService.complete(ids.studentUser, ids.aluno, {
            catalogVersion: PARQ_CATALOG_VERSION,
            sessionGeneration: first.sessionGeneration,
            expectedVersion: winningDraft.version,
            responses: winningDraft.responses,
          """
          if old not in text:
              raise SystemExit('runtime verifier target block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit verifier fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/scripts/verify-issue-273-parq.ts
          git commit -m "test: reload winning PAR-Q draft after concurrency"
          git push origin HEAD:feat/273-canonical-parq
