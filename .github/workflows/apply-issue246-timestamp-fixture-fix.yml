name: Apply Issue 246 Timestamp Fixture Fix

on:
  push:
    branches:
      - feat/246-adipometry-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/246-adipometry-foundation

      - name: Align approval timestamp precision
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-adipometry-foundation.sh')
          text = path.read_text()
          text = text.replace('p_approved_at TIMESTAMP\n', 'p_approved_at TIMESTAMP(3)\n')
          text = text.replace('CURRENT_TIMESTAMP::TIMESTAMP AS approved_at', 'CURRENT_TIMESTAMP::TIMESTAMP(3) AS approved_at')
          path.write_text(text)
          PY
          grep -q 'p_approved_at TIMESTAMP(3)' scripts/verify-adipometry-foundation.sh
          test "$(grep -c 'CURRENT_TIMESTAMP::TIMESTAMP(3) AS approved_at' scripts/verify-adipometry-foundation.sh)" -eq 2
          git diff --check

      - name: Commit precision correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-adipometry-foundation.sh
          git rm .github/workflows/apply-issue246-timestamp-fixture-fix.yml
          git diff --cached --check
          git commit -m "test(adpt): align approval fixture timestamp precision"
          git push origin HEAD:feat/246-adipometry-foundation
