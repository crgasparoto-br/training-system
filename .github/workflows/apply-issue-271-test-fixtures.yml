name: Apply Issue 271 Test Fixture Fixes

on:
  push:
    branches:
      - feat/271-public-pre-registration

permissions:
  contents: write

jobs:
  apply-fixes:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/271-public-pre-registration
          fetch-depth: 0

      - name: Update test fixtures
        shell: python
        run: |
          from pathlib import Path

          lifecycle = Path('apps/api/src/modules/alunos/student-lifecycle.service.test.ts')
          text = lifecycle.read_text()
          replacements = {
              "phone: '11910000001',\n      cpf:": "phone: '11910000001',\n      email: 'cpf-a@example.test',\n      cpf:",
              "phone: '11910000002',\n        cpf:": "phone: '11910000002',\n        email: 'cpf-b@example.test',\n        cpf:",
              "phone: '11910101010',\n        cpf,": "phone: '11910101010',\n        email: 'cpf-cross-a@example.test',\n        cpf,",
              "phone: '11920202020',\n          cpf,": "phone: '11920202020',\n          email: 'cpf-cross-b@example.test',\n          cpf,",
              "phone: '11911112222',\n        birthDate:": "phone: '11911112222',\n        email: 'sem-convite@example.test',\n        birthDate:",
              "phone: '11999990000',\n        cpf:": "phone: '11999990000',\n        email: 'tenant-dois@example.test',\n        cpf:",
              "phone: '11999999999',\n          birthDate:": "phone: '11999999999',\n          email: 'cross-tenant@example.test',\n          birthDate:",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected lifecycle fixture not found: {old!r}')
              text = text.replace(old, new, 1)
          lifecycle.write_text(text)

          public = Path('apps/api/tests/pre-registration-public.integration.test.ts')
          text = public.read_text()
          replacements = [
              ("label: 'missing-email-student',\n      name: 'Aluno Sem Email de Contato',\n      birthDate: '1991-02-03',\n      cpf: '52998224725',", "label: 'missing-email-student',\n      name: 'Aluno Sem Email de Contato',\n      birthDate: '1991-02-03',\n      cpf: '12345679034',"),
              ("name: 'Aluno Sem Email de Contato',\n        birthDate: '1991-02-03',\n        cpf: '52998224725',", "name: 'Aluno Sem Email de Contato',\n        birthDate: '1991-02-03',\n        cpf: '12345679034',"),
              ("label: 'alternative-contact-student',\n      name: 'Aluno Contato Alternativo',\n      birthDate: '1990-04-05',\n      cpf: '16899535009',", "label: 'alternative-contact-student',\n      name: 'Aluno Contato Alternativo',\n      birthDate: '1990-04-05',"),
              ("label: 'active-student-new-invite',\n      name: 'Aluno Já Ativo',\n      birthDate: '1988-07-08',\n      cpf: '39053344705',", "label: 'active-student-new-invite',\n      name: 'Aluno Já Ativo',\n      birthDate: '1988-07-08',"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected public fixture not found: {old!r}')
              text = text.replace(old, new, 1)
          public.write_text(text)

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-issue-271-test-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align issue 271 fixtures with required email"
          git push origin HEAD:feat/271-public-pre-registration
