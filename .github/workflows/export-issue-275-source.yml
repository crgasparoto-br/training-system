name: Apply Issue 275 Remediation

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/export-issue-275-source.yml'

permissions:
  contents: write

jobs:
  apply-remediation:
    name: Apply audited remediation patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/275-pre-registration-qa-rollout
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-parts.sha256 <<'EOF'
          a81f817b1a021c84d6585f76d588b3940a733cedbc64e1f294b93b1070b007ce  .audit/issue-275-remediation/patch.part01
          34c4d86d1dd443d6e13a0d7c716314620607860836fbb00e42ffdb6c16286a67  .audit/issue-275-remediation/patch.part02
          3481e1cffd007f8b53aadb92df9938c9d7bb3071a7006c0d6c26b12e8ae2f769  .audit/issue-275-remediation/patch.part03
          4729d30476d94e9336006b5229608c4f4e21a4150685b72343aafedb07761d68  .audit/issue-275-remediation/patch.part04
          acdc4a54f1311b78ece64a9187e7382e3d917d7f40e721eb3d0654c25fdff40c  .audit/issue-275-remediation/patch.part05
          EOF
          sha256sum -c /tmp/expected-parts.sha256
          cat .audit/issue-275-remediation/patch.part* > /tmp/patch.b64
          echo '7b4e8bd149ec3255f84ad6ba1b5163f00c4b05eb33a1073420a56d899e965a2a  /tmp/patch.b64' | sha256sum -c -
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/remediation.patch
          echo '1bb51823a2aec754e678ce20cf69c7aea84e4ec28e069658215d52a8a2c96ea5  /tmp/remediation.patch' | sha256sum -c -

      - name: Apply remediation and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --index --binary /tmp/remediation.patch
          rm -rf .audit/issue-275-remediation
          rm .github/workflows/export-issue-275-source.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: remediar auditoria integrada da issue 275'
          git push origin HEAD:feat/275-pre-registration-qa-rollout
